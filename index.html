<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="x-dns-prefetch-control" content="off" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.puter.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob: https:;
    connect-src 'self' https: wss://*.firebaseio.com wss://*.firebasedatabase.app wss://*.puter.com;
    frame-src https://*.firebaseio.com https://*.firebasedatabase.app https://*.puter.com;
    base-uri 'self';
    form-action 'none';
    object-src 'none';
    upgrade-insecure-requests;
  " />
  <!--
    Note CSP : 'unsafe-inline' est nécessaire pour script-src/style-src car
    l'app utilise massivement des attributs onclick= et style= inline
    (~80 et ~1270 occurrences). Les retirer demanderait de refondre tout le
    rendu HTML vers des classes CSS + addEventListener — hors de portée
    sans réécrire l'app entière. La CSP reste néanmoins utile : elle bloque
    le chargement de scripts/styles depuis n'importe quel domaine non
    listé, ce qui empêche l'exécution d'un script injecté via une faille
    tierce (ex: une dépendance CDN compromise) et limite form-action et
    object-src de façon stricte.
    GitHub Pages ne permet pas de vrais en-têtes HTTP serveur (pas de
    fichier _headers comme sur Netlify/Vercel) — cette CSP via <meta> est
    le maximum réalisable sans backend ni hébergeur alternatif.

    connect-src utilise https: générique (plutôt qu'une liste de domaines
    explicites) car l'app fait des requêtes fetch() vers des domaines non
    prévisibles à l'avance : les sourcemaps des SDK Firebase/jsPDF, l'API
    Puter (génération d'images IA), et surtout les CDN tiers que Puter
    utilise pour héberger les images générées (Flux, Stable Diffusion, etc.),
    dont le domaine exact dépend du modèle et peut changer côté Puter sans
    préavis. Cette directive ne couvre que les requêtes réseau (fetch/XHR/
    WebSocket) — script-src, object-src et form-action restent strictement
    verrouillés, donc ceci n'autorise pas l'exécution de code arbitraire,
    seulement l'envoi/réception de données vers du HTTPS.

    script-src inclut *.firebaseio.com et *.firebasedatabase.app en plus de
    connect-src : quand le SDK Realtime Database ne peut pas ouvrir de
    WebSocket (réseau/proxy restrictif), il bascule automatiquement sur un
    fallback "long polling" qui charge les données via une balise <script>
    injectée dynamiquement (endpoint /.lp?...), pas via fetch/XHR. Ce
    mécanisme est donc soumis à script-src et non à connect-src — sans
    cette entrée, l'app casse silencieusement dès que le WebSocket est
    indisponible, ce qui peut arriver de façon intermittente selon le
    réseau du client.

    frame-ancestors retirée : Chrome/Firefox ignorent explicitement cette
    directive quand elle est livrée via <meta> (seul un vrai en-tête HTTP
    fonctionne), donc la garder ne produisait aucune protection réelle —
    juste une fausse impression de sécurité et un avertissement console.
    GitHub Pages ne permettant pas d'en-têtes HTTP réels, la protection
    anti-clickjacking n'est pas réalisable ici sans changer d'hébergeur.

    Note X-DNS-Prefetch-Control : désactive la pré-résolution DNS des liens
    de la page, qui pourrait servir de canal d'exfiltration furtif (un
    script malveillant encoderait des données dans un sous-domaine et
    forcerait sa résolution DNS, contournant connect-src de la CSP). Cette
    directive est documentée comme utilisable en meta http-equiv.

    Note Permissions-Policy : volontairement absente. Contrairement à CSP,
    cet en-tête n'a PAS de forme meta http-equiv supportée par les
    navigateurs — seule la version HTTP réelle fonctionne, donc impossible
    à appliquer sans backend/hébergeur configurable (Netlify, Vercel,
    Cloudflare Pages le permettraient via un fichier de config serveur).
  -->

/* ═══════════════════════════════════════════════
   FLOW v5 — Windows 11 Fluent
   Mica background · Segoe UI Variable · coral accent
   Thème clair par défaut, variante sombre via data-theme="dark"
   ═══════════════════════════════════════════════ */

:root {
  /* Sombre (Windows 11 dark mica) */
  --fg-rgb:  255,255,255;
  --ink-rgb: 244,238,229;
  --bg-0:    #1f1b19;
  --bg-1:    #262220;
  --bg-paper:#2b2725;
  --layer:   rgba(255,255,255,.035);
  --ink:     #f5f2f0;
  --ink-2:   rgba(245,242,240,.82);
  --ink-3:   rgba(245,242,240,.64);
  --ink-4:   rgba(245,242,240,.50);
  --ink-5:   rgba(245,242,240,.09);
  --surface-1: #2b2725;
  --surface-2: #2f2b29;
  --surface-3: #37322f;
  --border:    rgba(255,255,255,.08);
  --border-hi: rgba(255,255,255,.14);
  --coral:      #e0714d;
  --coral-soft: #f0906f;
  --coral-deep: #c4502c;
  --coral-tint: rgba(224,113,77,.16);
  --coral-glow: rgba(224,113,77,.28);
  --on-coral:   #ffffff;
  --sage:  #6ccb8f;
  --sky:   #7fb0ec;
  --peach: #f0b45a;
  --plum:  #c4a3f0;
  --danger:#f08a8a;
  --rubis-bg: #120e0c;
  /* legacy compat vars */
  --glass-bg:        rgba(var(--fg-rgb),.03);
  --glass-bg-hi:     rgba(var(--fg-rgb),.055);
  --glass-bg-strong: rgba(var(--fg-rgb),.09);
  --glass-edge:      rgba(var(--fg-rgb),.07);
  --glass-edge-hi:   rgba(var(--fg-rgb),.13);
  --glass-edge-lo:   rgba(0,0,0,.5);
  --glass-spec: none;
  --glass-rim:  none;
  --shadow-sm: 0 2px 6px rgba(0,0,0,.25);
  --shadow-md: 0 4px 14px rgba(0,0,0,.30);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.36);
  --shadow-xl: 0 32px 64px rgba(0,0,0,.45), 0 2px 21px rgba(0,0,0,.3);
  --radius-sm: 6px;
  --radius:    8px;
  --radius-lg: 12px;
  --radius-xl: 12px;
  --font-text: 'Segoe UI Variable Text', 'Segoe UI Variable', 'Segoe UI', 'Geist', system-ui, -apple-system, sans-serif;
  --font-display: 'Segoe UI Variable Display', 'Segoe UI Variable', 'Segoe UI', 'Geist', system-ui, -apple-system, sans-serif;
}

:root[data-theme="light"] {
  /* Clair (Windows 11 light mica) — thème par défaut */
  --fg-rgb:  26,26,26;
  --ink-rgb: 26,26,26;
  --bg-0:   #f3efec;
  --bg-1:   #ebe6e2;
  --bg-paper:#ffffff;
  --layer:  rgba(255,255,255,.55);
  --ink:    #1a1a1a;
  --ink-2:  #3d3d3d;
  --ink-3:  #5c5c5c;
  --ink-4:  #707070;
  --ink-5:  rgba(26,26,26,.09);
  --surface-1: #ffffff;
  --surface-2: #ffffff;
  --surface-3: #f6f3f1;
  --border:    rgba(0,0,0,.07);
  --border-hi: rgba(0,0,0,.14);
  --coral:      #c4502c;
  --coral-soft: #b4472a;
  --coral-deep: #9c3a1f;
  --coral-tint: #fbe9e3;
  --coral-glow: rgba(196,80,44,.22);
  --on-coral:   #ffffff;
  --sage:  #2f7d4f;
  --sky:   #2b6cb0;
  --peach: #a8650f;
  --plum:  #7a4cc2;
  --danger:#b42318;
  --rubis-bg: #2b211d;
  --glass-bg:        rgba(0,0,0,.025);
  --glass-bg-hi:     rgba(0,0,0,.045);
  --glass-bg-strong: rgba(0,0,0,.08);
  --glass-edge:      rgba(0,0,0,.07);
  --glass-edge-hi:   rgba(0,0,0,.14);
  --glass-edge-lo:   rgba(0,0,0,.02);
  --shadow-sm: 0 2px 6px rgba(60,30,20,.04);
  --shadow-md: 0 4px 14px rgba(60,30,20,.07);
  --shadow-lg: 0 8px 24px rgba(60,30,20,.10);
  --shadow-xl: 0 32px 64px rgba(60,30,20,.16), 0 2px 21px rgba(60,30,20,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { scroll-behavior: auto; }

body {
  font-family: 'Geist', ui-sans-serif, -apple-system, system-ui, sans-serif;
  background: var(--bg-0);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  overscroll-behavior: none;
  font-size: 13.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -.012em;
  font-feature-settings: "ss01","cv11","tnum";
}

h1, h2, h3 {
  font-family: 'Geist', sans-serif;
  font-weight: 700 !important;
  letter-spacing: -.035em;
  line-height: 1.18;
  color: var(--ink);
  text-wrap: balance;
}
h1 { font-size: 1.5rem !important; }
h2 { font-size: 1.0625rem !important; letter-spacing: -.028em; }
h3 { font-size: .9375rem !important; font-weight: 600 !important; }

button, input, select, textarea { font-family: inherit; color: inherit; }
a { color: inherit; }

/* ═══ BACKGROUND — mesh grid ═══ */
#bg-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: var(--bg-0); overflow: hidden;
}
#bg-canvas::before {
  content: '';
  position: absolute; inset: -1px;
  background-image:
    linear-gradient(rgba(var(--fg-rgb),.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--fg-rgb),.028) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%,
    rgba(0,0,0,.65) 0%, rgba(0,0,0,.1) 60%, transparent 100%);
}
:root[data-theme="light"] #bg-canvas::before {
  background-image:
    linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px);
}
#bg-canvas::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 48% 42% at 2% -2%, oklch(64% .175 35 / 9%) 0%, transparent 60%),
    radial-gradient(ellipse 38% 35% at 100% 102%, oklch(68% .14 240 / 7%) 0%, transparent 55%);
}
:root[data-theme="light"] #bg-canvas::after {
  background:
    radial-gradient(ellipse 48% 42% at 2% -2%, oklch(64% .175 35 / 5%) 0%, transparent 60%),
    radial-gradient(ellipse 38% 35% at 100% 102%, oklch(68% .14 240 / 4%) 0%, transparent 55%);
}

.orb {
  position: fixed; z-index: 0; border-radius: 50%;
  pointer-events: none; filter: blur(90px);
}
.orb-1 { width: 480px; height: 480px; background: radial-gradient(circle, oklch(64% .175 35 / 7%) 0%, transparent 70%); top: -160px; left: 8%; }
.orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, oklch(68% .14 240 / 5%) 0%, transparent 70%); bottom: -160px; right: 8%; }
.orb-3, .orb-4 { display: none; }
#bg-vignette { display: none; }
body::before, body::after { display: none; }

/* ═══ SURFACES ═══ */
.glass, .glass-dark, .glass-card, .modal-box, .login-card, #sidebar, #mobile-tabbar { position: relative; }
.glass { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.glass-dark { background: var(--surface-1); border: 1px solid var(--border); box-shadow: none; }
.glass-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: border-color .18s, box-shadow .18s, background .18s;
  overflow: hidden;
}
.glass-card::before { display: none; }
.glass-card::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(var(--fg-rgb),.06) 40%, rgba(var(--fg-rgb),.06) 60%, transparent 100%);
  pointer-events: none; z-index: 0;
}
.glass-card:hover { border-color: var(--border-hi); background: var(--surface-3); box-shadow: var(--shadow-md); }
.glass-card > * { position: relative; z-index: 1; }
.stat-card { padding: 20px; border-radius: var(--radius-lg); }

/* ═══ INPUTS ═══ */
.glass-input {
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  width: 100%;
  font-size: .875rem;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s, background .15s;
  outline: none;
  box-shadow: none;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.glass-input::placeholder { color: var(--ink-4); }
.glass-input:hover { border-color: var(--border-hi); background: var(--surface-2); }
.glass-input:focus { border-color: var(--coral); background: var(--surface-2); box-shadow: 0 0 0 3px oklch(64% .175 35 / 13%); }
textarea.glass-input { resize: vertical; min-height: 84px; line-height: 1.55; }
select.glass-input option { background: #111; color: var(--ink); }
:root[data-theme="light"] select.glass-input option { background: #fff; color: #0a0a0a; }

/* ═══ BUTTONS ═══ */
.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: .8125rem; font-weight: 500;
  font-family: inherit;
  cursor: pointer; border: none; white-space: nowrap;
  transition: all .14s cubic-bezier(.2,.7,.3,1);
  letter-spacing: -.01em;
  isolation: isolate;
}
.btn:active { transform: scale(.966); }
.btn:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

.btn-primary {
  background: linear-gradient(180deg, oklch(68% .175 35) 0%, oklch(60% .175 35) 100%);
  color: #fff; font-weight: 600;
  border-radius: 999px; padding: 8px 18px;
  box-shadow: inset 0 1px 0 rgba(var(--fg-rgb),.14), 0 2px 8px oklch(64% .175 35 / 32%);
}
.btn-primary::before { display: none; }
.btn-primary:hover {
  background: linear-gradient(180deg, oklch(70% .175 35) 0%, oklch(63% .175 35) 100%);
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(var(--fg-rgb),.16), 0 5px 18px oklch(64% .175 35 / 42%);
}

.btn-ghost {
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--ink-2);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.btn-ghost:hover { background: var(--surface-2); border-color: var(--border-hi); color: var(--ink); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.3); }

.btn-danger { background: rgba(239,68,68,.09); border: 1px solid rgba(239,68,68,.20); color: var(--danger); backdrop-filter: none; -webkit-backdrop-filter: none; }
.btn-danger:hover { background: rgba(239,68,68,.17); transform: translateY(-1px); }

.btn-success { background: oklch(73% .18 145 / 11%); border: 1px solid oklch(73% .18 145 / 22%); color: oklch(73% .18 145); backdrop-filter: none; -webkit-backdrop-filter: none; }
.btn-success:hover { background: oklch(73% .18 145 / 19%); transform: translateY(-1px); }

.btn-sm { padding: 5px 10px; font-size: .75rem; }
.btn-primary.btn-sm { padding: 5px 13px; }
.btn:disabled { opacity: .36; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* ═══ TABS ═══ */
.tab-btn {
  padding: 8px 14px;
  font-size: .8125rem; font-weight: 500;
  color: var(--ink-3);
  border-bottom: 1.5px solid transparent;
  cursor: pointer; transition: all .14s; white-space: nowrap;
  background: transparent;
  border-top: none; border-left: none; border-right: none;
  letter-spacing: -.01em;
}
.tab-btn:hover { color: var(--ink-2); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--coral); }

/* ═══ BADGES ═══ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 4px;
  font-size: .67rem; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.badge-admin      { background: oklch(64% .175 35 / 12%); color: var(--coral-soft); border: 1px solid oklch(64% .175 35 / 22%); }
.badge-controller { background: oklch(68% .14 240 / 12%); color: oklch(78% .12 240); border: 1px solid oklch(68% .14 240 / 22%); }
.badge-client     { background: oklch(73% .18 145 / 12%); color: oklch(80% .15 145); border: 1px solid oklch(73% .18 145 / 22%); }

.role-chip {
  padding: 4px 11px; border-radius: var(--radius-sm);
  font-size: .75rem; font-weight: 500;
  background: var(--surface-3); border: 1px solid var(--border);
  color: var(--ink-3); cursor: pointer; transition: all .14s;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.role-chip:hover { background: var(--surface-2); color: var(--ink-2); border-color: var(--border-hi); }
.role-chip.active { background: oklch(64% .175 35 / 12%); border-color: oklch(64% .175 35 / 28%); color: var(--coral-soft); }
.prio-urgent { background: rgba(239,68,68,.09);  border-color: rgba(239,68,68,.2);  color: var(--danger); }
.prio-normal { background: oklch(68% .14 240 / 9%); border-color: oklch(68% .14 240 / 20%); color: var(--sky); }
.prio-low    { background: var(--surface-3); border-color: var(--border); color: var(--ink-4); }

/* ═══ KEBAB ═══ */
.kebab-wrap { position: relative; }
.kebab-menu {
  display: none; position: fixed;
  background: var(--surface-1); border: 1px solid var(--border-hi);
  border-radius: var(--radius-lg); padding: 5px; min-width: 180px; z-index: 9999;
  box-shadow: var(--shadow-lg);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.kebab-menu.open { display: block; }
.kebab-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
  font-size: .8125rem; font-family: inherit; color: var(--ink-2);
  background: transparent; border: none; cursor: pointer;
  transition: background .1s, color .1s; text-align: left;
}
.kebab-item:hover { background: var(--surface-3); color: var(--ink); }
.kebab-item.kebab-danger { color: var(--danger); }
.kebab-item.kebab-danger:hover { background: rgba(239,68,68,.09); }
.kebab-divider { height: 1px; background: var(--border); margin: 4px 2px; }
/* Virtualisation native du rendu : le navigateur ne calcule/peint que les panneaux
   visibles dans le viewport, sans changer la logique de filtre/pagination JS existante. */
.client-doc-panel-wrap { content-visibility: auto; contain-intrinsic-size: 0 320px; }
.user-card-wrap { content-visibility: auto; contain-intrinsic-size: 0 80px; }
.kanban-card:focus-visible { outline: 2px solid var(--coral); box-shadow: 0 0 0 4px oklch(64% .175 35 / 22%); }

/* ═══ PROFILE GRID ═══ */
.profile-grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
@media (max-width: 768px) { .profile-grid { grid-template-columns: 1fr; } }

/* ═══ TIMELINE ═══ */
.tl-step { display: flex; gap: 16px; align-items: flex-start; padding: 8px 0; }
.tl-line-wrap { display: flex; flex-direction: column; align-items: center; min-width: 36px; }
.tl-dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border: 1.5px solid; transition: box-shadow .2s; position: relative;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.tl-connector { width: 1.5px; flex: 1; min-height: 20px; margin: 3px 0; border-radius: 1px; }
.tl-done .tl-dot { background: oklch(73% .18 145 / 13%); border-color: oklch(73% .18 145); color: oklch(73% .18 145); box-shadow: 0 0 0 4px oklch(73% .18 145 / 8%); }
.tl-done .tl-connector { background: linear-gradient(180deg, oklch(73% .18 145 / 28%) 0%, oklch(64% .175 35 / 18%) 100%); }
.tl-current .tl-dot {
  background: oklch(64% .175 35 / 15%); border-color: var(--coral); color: var(--coral-soft);
  animation: tl-pulse 2.4s ease-in-out infinite;
}
@keyframes tl-pulse {
  0%,100% { box-shadow: 0 0 0 4px oklch(64% .175 35 / 8%), 0 0 12px oklch(64% .175 35 / 22%); }
  50%      { box-shadow: 0 0 0 8px oklch(64% .175 35 / 13%), 0 0 22px oklch(64% .175 35 / 36%); }
}
.tl-current .tl-connector { background: rgba(var(--fg-rgb),.06); }
.tl-pending .tl-dot { background: var(--surface-3); border-color: var(--border); color: var(--ink-4); }
.tl-pending .tl-connector { background: var(--border); }

/* ═══ SIDEBAR — Linear left-rail style ═══ */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: 216px; z-index: 40;
  display: flex; flex-direction: column;
  padding: 16px 10px 16px 8px;
  background: var(--surface-1);
  border-right: 1px solid var(--border);
  box-shadow: none;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
:root[data-theme="light"] #sidebar { background: #fff; }
#sidebar::before { display: none; }
#sidebar > * { position: relative; }

.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  color: var(--ink-3);
  font-size: .8125rem; font-weight: 500;
  cursor: pointer; transition: background .1s, color .1s;
  margin-bottom: 1px;
  border: 1px solid transparent;
  background: transparent;
  width: 100%; text-align: left;
  will-change: background, color;
  letter-spacing: -.012em;
  position: relative;
  overflow: visible;
}
.nav-item:hover { background: var(--surface-3); color: var(--ink); border-color: transparent; }
.nav-item.active {
  background: oklch(64% .175 35 / 10%);
  color: var(--coral-soft);
  border-color: transparent;
}
/* Left indicator */
.nav-item.active::before {
  content: '';
  position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 65%;
  background: var(--coral);
  border-radius: 0 3px 3px 0;
}
:root[data-theme="light"] .nav-item.active { color: var(--coral-deep); background: oklch(64% .175 35 / 7%); }
.nav-icon { width: 15px; height: 15px; opacity: .55; flex-shrink: 0; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-item:hover .nav-icon { opacity: .85; }

#main { margin-left: 216px; min-height: 100vh; padding: 28px 32px 64px; position: relative; z-index: 1; max-width: 1440px; contain: layout; }
#tab-content { contain: layout style; }

/* ═══ LOGO ═══ */
.logo {
  font-family: 'Geist', sans-serif;
  font-size: 1.15rem; font-weight: 800;
  letter-spacing: -.05em; color: var(--ink);
  display: inline-flex; align-items: baseline; line-height: 1;
}
.logo::after { content: '·'; color: var(--coral); margin-left: 1.5px; font-size: 1.5em; line-height: 0; font-weight: 900; }

/* ═══ AVATAR ═══ */
.avatar {
  width: 30px; height: 30px; border-radius: 7px;
  object-fit: cover;
  background: linear-gradient(135deg, var(--coral-soft), var(--coral-deep));
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 800; color: #fff;
  flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.4);
}

/* ═══ MODALS ═══ */
#modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
:root[data-theme="light"] #modal-overlay { background: rgba(0,0,0,.28); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.modal-box {
  background: var(--surface-1); border: 1px solid var(--border-hi);
  border-radius: var(--radius-xl); padding: 28px 28px 24px;
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-xl); position: relative;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.modal-box::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(var(--fg-rgb),.08) 30%, rgba(var(--fg-rgb),.08) 70%, transparent 100%);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0; pointer-events: none;
}
.modal-box > * { position: relative; }
:root[data-theme="light"] .modal-box { background: #fff; border-color: var(--border); }

/* ═══ LOGIN ═══ */
#login-page {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background: var(--bg-0);
}
#login-page::before {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 60% 55% at 50% 50%, transparent 40%, rgba(0,0,0,.5) 100%);
}
.login-card {
  width: 100%; max-width: 400px;
  background: var(--surface-1); border: 1px solid var(--border-hi);
  border-radius: var(--radius-xl); padding: 40px 36px 36px;
  box-shadow: var(--shadow-xl); position: relative;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.login-card::before {
  content: '';
  position: absolute; top: -1px; left: 22%; right: 22%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--coral), transparent);
  border-radius: 0 0 4px 4px; pointer-events: none;
}
.login-card::after { display: none; }
.login-card > * { position: relative; }
:root[data-theme="light"] .login-card { background: #fff; border-color: var(--border); }

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--coral); }
* { scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent; }

/* ═══ ANIMATIONS ═══ */
@keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp .20s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fade-in { animation: fadeIn .16s ease forwards; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .7s linear infinite; }

.ai-hist-card { transition: background .14s, border-color .14s; cursor: default; }
.ai-hist-card:hover { background: rgba(var(--fg-rgb),.03) !important; border-color: var(--border-hi) !important; }

#discussion-messages::-webkit-scrollbar { width: 4px; }
#discussion-messages::-webkit-scrollbar-thumb { background: oklch(64% .175 35 / 25%); border-radius: 99px; }
#qa-messages::-webkit-scrollbar { width: 4px; }
#qa-messages::-webkit-scrollbar-thumb { background: oklch(68% .14 240 / 25%); border-radius: 99px; }

@keyframes qa-dot { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
@keyframes qa-cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }
.qa-cursor { animation: qa-cursor-blink .7s step-end infinite; color: var(--coral); }

.qa-suggestion {
  display: inline-flex; align-items: center; padding: 5px 11px; border-radius: var(--radius-sm);
  border: 1px solid oklch(68% .14 240 / 20%); background: oklch(68% .14 240 / 7%);
  color: var(--sky); font-size: .75rem; cursor: pointer; font-family: inherit;
  transition: all .12s; white-space: nowrap;
}
.qa-suggestion:hover { background: oklch(68% .14 240 / 14%); border-color: oklch(68% .14 240 / 35%); }
.qa-suggestion:active { transform: scale(.96); }

.qa-md p { margin: 0 0 8px; }
.qa-md p:last-child { margin: 0; }
.qa-md ul { padding-left: 18px; margin: 5px 0 8px; }
.qa-md li { margin-bottom: 3px; }
.qa-md strong { color: var(--ink); font-weight: 700; }
.qa-md em { font-style: italic; opacity: .85; }
.qa-md code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font-size: .82em; font-family: 'DM Mono', 'Geist Mono', ui-monospace, monospace; }
.qa-md h3 { font-size: .875rem; font-weight: 700; margin: 6px 0 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (display-mode: standalone) {
  body { padding-top: env(safe-area-inset-top, 0); }
  #sidebar { padding-top: calc(14px + env(safe-area-inset-top, 0)); padding-bottom: env(safe-area-inset-bottom, 0); }
  #mobile-tabbar { padding-bottom: env(safe-area-inset-bottom, 0); height: calc(60px + env(safe-area-inset-bottom, 0)); }
  #login-page { padding-top: env(safe-area-inset-top, 0); }
}

/* ═══ MISC ═══ */
.divider { height: 1px; background: var(--border); margin: 18px 0; border: none; }
.label { font-size: .65rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .10em; margin-bottom: 6px; display: block; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--ink-4); }

.mob-logout-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; min-height: 56px; padding: 6px 8px; cursor: pointer; border: none;
  background: transparent; color: rgba(248,113,113,.55);
  font-size: .6rem; font-family: inherit; font-weight: 500;
  transition: color .14s, transform .12s; flex-shrink: 0; width: 52px;
}
.mob-logout-btn:active { transform: scale(.88); color: var(--danger); }
.mob-logout-btn svg { width: 20px; height: 20px; }

/* ═══ MOBILE ═══ */
@media (max-width: 768px) {
  #sidebar { display: none !important; }
  #main { margin-left: 0; padding: 14px 14px 96px; }
  h1 { font-size: 1.25rem !important; }
  h2 { font-size: .9375rem !important; }
  [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
  .btn { min-height: 44px; }
  .btn-sm { min-height: 36px; }
  .glass-card { border-radius: 10px; margin-bottom: 10px !important; }
  .modal-box { max-width: 100% !important; border-radius: 16px 16px 0 0; margin-top: auto; align-self: flex-end; max-height: 92vh; }
  #toast-container { bottom: auto; top: 14px; right: 10px; left: 10px; }
  .toast { font-size: .8rem; }
  .label { font-size: .62rem; }
  .orb { opacity: .06; filter: blur(60px); }
}
@media (max-width: 480px) { .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; } }
@media (min-width: 769px) { #mobile-tabbar { display: none !important; } }

#mobile-tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--surface-1); border-top: 1px solid var(--border);
  display: flex; padding: 6px 0 env(safe-area-inset-bottom, 8px);
  box-shadow: 0 -8px 28px rgba(0,0,0,.4);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
:root[data-theme="light"] #mobile-tabbar { background: #fff; border-top-color: var(--border); box-shadow: 0 -4px 20px rgba(0,0,0,.06); }

.mob-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; min-height: 56px; padding: 6px 4px;
  cursor: pointer; border: none; background: transparent;
  color: var(--ink-4); font-size: .57rem; font-family: inherit; font-weight: 500;
  transition: color .14s; position: relative;
}
.mob-tab:active { transform: scale(.91); }
.mob-tab.active { color: var(--coral); }
.mob-tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 18px; height: 2px; background: var(--coral); border-radius: 2px 2px 0 0; }
.mob-tab svg { width: 20px; height: 20px; }
.mob-tab-badge { position: absolute; top: 4px; right: calc(50% - 14px); background: rgba(239,68,68,.92); border-radius: 999px; font-size: .57rem; padding: 1px 4px; color: #fff; min-width: 15px; text-align: center; line-height: 1.4; }
.mob-new-dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }

/* ═══ TOASTS ═══ */
#toast-container { position: fixed; bottom: 22px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: .8125rem; font-weight: 500; border: 1px solid;
  box-shadow: var(--shadow-lg); pointer-events: all;
  animation: toastIn .2s cubic-bezier(.2,.8,.3,1) forwards;
  backdrop-filter: none; -webkit-backdrop-filter: none; max-width: 320px;
}
.toast.hide { animation: toastOut .16s ease forwards; }
.toast-success { background: #091610; color: oklch(73% .18 145); border-color: oklch(73% .18 145 / 22%); }
.toast-error   { background: #160909; color: var(--danger); border-color: rgba(239,68,68,.2); }
.toast-info    { background: var(--surface-2); color: var(--ink-2); border-color: var(--border); }
@keyframes toastIn  { from { opacity: 0; transform: translateX(12px) scale(.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(12px); } }

/* ═══ SYNC DOT ═══ */
#sync-dot { position: fixed; top: 18px; right: 20px; z-index: 50; width: 6px; height: 6px; border-radius: 50%; background: oklch(73% .18 145 / 55%); transition: background .4s, box-shadow .4s; }
#sync-dot.syncing { background: var(--coral); box-shadow: 0 0 0 3px oklch(64% .175 35 / 18%); animation: syncPulse 1s ease-in-out infinite; }
#sync-dot.error { background: #f87171; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
@keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: .28; } }

.pdf-field { margin-bottom: 14px; }
.pdf-field label { display: block; font-size: .8rem; color: var(--ink-2); margin-bottom: 5px; }

.color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all .14s; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.color-dot:hover { transform: scale(1.18); }
.color-dot.selected { border-color: var(--ink); transform: scale(1.24); box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 4px var(--border-hi); }

@keyframes confetti-fall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(110vh) rotate(720deg); } }

/* ═══ CMD PALETTE ═══ */
#cmd-palette { display: none; position: fixed; inset: 0; z-index: 8000; background: rgba(0,0,0,.64); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: flex-start; justify-content: center; padding-top: 14vh; }
#cmd-palette.open { display: flex; }
#cmd-box { background: var(--surface-1); border: 1px solid var(--border-hi); border-radius: var(--radius-xl); width: min(560px, 92vw); overflow: hidden; box-shadow: var(--shadow-xl); }
:root[data-theme="light"] #cmd-box { background: #fff; }
#cmd-input { width: 100%; padding: 16px 20px; background: transparent; border: none; border-bottom: 1px solid var(--border); font-size: .9375rem; color: var(--ink); font-family: inherit; outline: none; letter-spacing: -.01em; }
#cmd-input::placeholder { color: var(--ink-4); }
.cmd-result, .cmd-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: .875rem; color: var(--ink-2); transition: background .1s, color .1s; }
.cmd-result:hover, .cmd-result.active-result, .cmd-item:hover, .cmd-item.cmd-active { background: var(--surface-3); color: var(--ink); }
#cmd-results { max-height: 340px; overflow-y: auto; padding: 6px; }

@media (max-width: 768px) {
  body { font-size: 13.5px; }
  #main { padding: 12px 12px 104px; }
  .glass-card { padding: 14px !important; }
  .stat-card { padding: 14px !important; }
  .kebab-menu { position: fixed; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 48vh; overflow-y: auto; border-radius: 14px; padding: 8px; }
  .kebab-item { min-height: 44px; font-size: .875rem; }
  .tl-step { gap: 12px; }
  .tl-dot { width: 30px; height: 30px; }
  #cmd-box { width: calc(100vw - 24px); margin-top: 8vh; }
  #cmd-results { max-height: 55vh; }
  .mob-tab span { max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (max-width: 420px) {
  .kpi-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  .mob-tab { font-size: .53rem; padding-left: 2px; padding-right: 2px; }
  .mob-tab svg { width: 18px; height: 18px; }
}

::selection { background: oklch(64% .175 35 / 28%); color: var(--ink); }

/* ═══════════════════════════════════════════════
   FLOW v5 — Couche Windows 11 Fluent
   (surcharge le style v4 ci-dessus)
   ═══════════════════════════════════════════════ */
body { font-family: var(--font-text); font-size: 14px; letter-spacing: 0; font-feature-settings: normal; background: var(--bg-0); }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.01em; font-weight: 600 !important; }
h1 { font-size: 1.75rem !important; line-height: 1.25; }
h2 { font-size: 1rem !important; letter-spacing: 0; }
h3 { font-size: .9375rem !important; }
#bg-canvas, #bg-canvas::before, #bg-canvas::after { background: var(--bg-0); background-image: none; mask-image: none; }
.orb { display: none; }

/* Icônes dessinées (remplacent les emojis) */
.fi { width: 1.15em; height: 1.15em; vertical-align: -.2em; flex-shrink: 0; display: inline-block; }
.fi-star-on { fill: currentColor; }

/* ── Barre du haut ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 45;
  display: flex; align-items: center; gap: 16px; padding: 0 12px 0 16px;
  background: var(--bg-0);
}
.tb-brand { display: flex; align-items: center; gap: 10px; width: 236px; flex-shrink: 0; background: none; border: 0; cursor: pointer; padding: 0; color: var(--ink); font: inherit; text-align: left; }
.tb-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--coral); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.tb-logo img { width: 100%; height: 100%; object-fit: cover; }
.tb-name { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.tb-ver { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(var(--fg-rgb),.06); color: var(--ink-3); }
.tb-new { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
.tb-search {
  flex: 1 1 280px; max-width: 560px; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--layer); border: 1px solid var(--border); border-bottom-color: rgba(var(--fg-rgb),.2); border-radius: 18px;
  color: var(--ink-3); cursor: text; font: inherit; text-align: left;
}
:root[data-theme="light"] .tb-search { background: rgba(255,255,255,.75); }
.tb-search:hover { background: var(--surface-1); }
.tb-search span.tb-ph { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-kbd { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-hi); white-space: nowrap; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.tb-pill {
  height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border);
  background: var(--layer); color: var(--ink); font: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer;
}
:root[data-theme="light"] .tb-pill { background: rgba(255,255,255,.75); }
.tb-pill:hover { background: var(--surface-1); }
.tb-pill svg { color: var(--coral); }
.tb-icon {
  width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--ink);
  display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
}
.tb-icon:hover { background: rgba(var(--fg-rgb),.06); }
.tb-icon.active { background: rgba(var(--fg-rgb),.08); }
.tb-badge {
  position: absolute; top: 7px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--coral); color: var(--on-coral); font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.tb-avatar .avatar { width: 32px; height: 32px; border-radius: 50%; box-shadow: none; font-size: 13px; }
.tb-avatar.active .avatar { box-shadow: 0 0 0 2px var(--coral); }

/* ── Menu de navigation ── */
#sidebar {
  top: 52px; width: 264px; padding: 4px 8px 16px 8px;
  background: transparent; border-right: 0; overflow-y: auto;
}
:root[data-theme="light"] #sidebar { background: transparent; }
.nav-section { padding: 16px 14px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.nav-item {
  height: 40px; padding: 0 14px; gap: 14px; border-radius: 6px; margin-bottom: 2px;
  font-size: 14px; font-weight: 400; color: var(--ink-2); flex-shrink: 0;
}
.nav-item:hover { background: rgba(var(--fg-rgb),.045); color: var(--ink); }
.nav-item.active, :root[data-theme="light"] .nav-item.active { background: rgba(var(--fg-rgb),.06); color: var(--ink); font-weight: 600; }
.nav-item.active::before { left: 0; height: 16px; width: 3px; border-radius: 2px; background: var(--coral); }
.nav-icon { width: 18px; height: 18px; opacity: 1; stroke-width: 1.6; }
.nav-item > span:not(.nav-badge) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  // ── Conversion automatique emoji → icône dessinée ──
  // Tout emoji affiché par l'application (même dans un texte généré par le code,
  // un toast ou une fenêtre) est remplacé à l'affichage par son dessin. Dans les
  // listes déroulantes et les infobulles, qui ne peuvent pas contenir de dessin,
  // l'emoji est simplement retiré.
  const EMOJI_ICONS = {
    '✕':'close','✓':'check','✨':'sparkle','✅':['checkc','var(--sage)'],'🗑':'trash','⚠':['alert','var(--peach)'],
    '📋':'clipboard','📄':'file','⚙':'gear','🌐':'globe','📊':'chart','💬':'chat','📤':'upload','➕':'plus',
    '👁':'eye','⬇':'download','📁':'folder','📝':'edit','🔗':'link','✉':'mail','📦':'box','⏳':'hourglass',
    '💰':'money','❌':['xc','var(--danger)'],'🔍':'search','🔴':['dot','var(--danger)'],'🎨':'palette',
    '⚪':['ring','var(--ink-4)'],'📅':'cal','✏':'edit','🔒':'lock','💾':'save','🎯':'target','🔔':'bell',
    '⭐':['starfill','var(--peach)'],'★':['starfill','var(--peach)'],'☆':['star','var(--ink-4)'],'💡':'bulb',
    '👤':'user','📭':'inbox','🔼':'arrowup','🚨':['alert','var(--danger)'],'🔵':['dot','var(--sky)'],'🎤':'mic',
    '📌':'pushpin','❓':'question','🧠':'brain','🧾':'receipt','👥':'users','🖼':'image','↩':'undo','🔐':'lock',
    '🗄':'archive','💶':'money','😟':'sad','🚫':['ban','var(--danger)'],'🤖':'bot','📬':'inbox','⏰':'clock',
    '🎉':'party','🔶':['diamond','var(--peach)'],'ℹ':'info','📱':'phone','🌙':'moon','😐':'neutral','🏷':'tag',
    '📜':'file','🏢':'building','☀':'sun','⏱':'clock','🧭':'compass','🔄':'refresh','📍':'pin','🔥':'flame',
    '📐':'ruler','🙁':'sad','💎':'rubis','🌡':'thermo','🙂':'happy','⌨':'keyboard','📂':'folder','📥':'download',
    '⬛':'columns','🗂':'folder','📉':'trenddown','⬆':'arrowup','📞':'call','☰':'list','📈':'trendup','⏸':'pause',
    '🏠':'home','👋':null,
  };
  const _emojiKeys = Object.keys(EMOJI_ICONS).sort((a,b)=>b.length-a.length);
  const EMOJI_RE = new RegExp('(?:'+_emojiKeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\uFE0F?','gu');
  function emojiIconHtml(raw){
    const key = raw.replace(/️/g,'');
    const def = EMOJI_ICONS[key];
    if(def===null || def===undefined) return '';
    const [name,color] = Array.isArray(def) ? def : [def,null];
    const svg = ic(name);
    return color ? svg.replace('<svg ', `<svg style="color:${color}" `) : svg;
  }
  function stripEmoji(str){
    return String(str).replace(EMOJI_RE,'').replace(/^\s+/,'').replace(/\s{2,}/g,' ');
  }
  const _ICON_SKIP = new Set(['SCRIPT','STYLE','TEXTAREA','TITLE','NOSCRIPT','INPUT','CODE','PRE']);
  const _ICON_STRIP = new Set(['OPTION','OPTGROUP','SELECT']);
  function iconizeText(node){
    const txt = node.nodeValue;
    if(!txt || !EMOJI_RE.test(txt)) { EMOJI_RE.lastIndex = 0; return; }
    EMOJI_RE.lastIndex = 0;
    const parent = node.parentNode;
    if(!parent || parent.namespaceURI==='http://www.w3.org/2000/svg') return;
    if(_ICON_SKIP.has(parent.nodeName) || (parent.closest && parent.closest('[contenteditable="true"],textarea'))) return;
    if(parent.closest && parent.closest('option,optgroup,select')){ node.nodeValue = stripEmoji(txt); return; }
    const tpl = document.createElement('template');
    tpl.innerHTML = txt.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(EMOJI_RE, m=>emojiIconHtml(m));
    parent.replaceChild(tpl.content, node);
  }
  function iconizeAttrs(el){
    for(const a of ['title','placeholder','aria-label','alt']){
      const v = el.getAttribute && el.getAttribute(a);
      if(v && EMOJI_RE.test(v)){ EMOJI_RE.lastIndex = 0; el.setAttribute(a, stripEmoji(v)); }
      EMOJI_RE.lastIndex = 0;
    }
  }
  function iconizeTree(root){
    if(!root) return;
    if(root.nodeType===3){ iconizeText(root); return; }
    if(root.nodeType!==1 && root.nodeType!==11) return;
    if(root.nodeType===1){
      if(_ICON_SKIP.has(root.nodeName)) return;
      iconizeAttrs(root);
      if(_ICON_STRIP.has(root.nodeName)){ root.querySelectorAll('option').forEach(o=>{ if(EMOJI_RE.test(o.textContent)){ EMOJI_RE.lastIndex=0; o.textContent = stripEmoji(o.textContent); } EMOJI_RE.lastIndex=0; }); return; }
    }
    const texts = [];
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n; while((n = w.nextNode())) texts.push(n);
    texts.forEach(iconizeText);
    if(root.querySelectorAll) root.querySelectorAll('[title],[placeholder],[aria-label],[alt]').forEach(iconizeAttrs);
  }
  function startEmojiIconizer(){
    iconizeTree(document.body);
    new MutationObserver(muts=>{
      for(const m of muts){
        if(m.type==='characterData') iconizeText(m.target);
        else if(m.type==='attributes') iconizeAttrs(m.target);
        else m.addedNodes.forEach(iconizeTree);
      }
    }).observe(document.body, { childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['title','placeholder','aria-label','alt'] });
    document.title = stripEmoji(document.title);
  }

  function loadLocalDB(){
    try{ const s=localStorage.getItem('flow_v3'); if(s) return JSON.parse(s); }catch(_){}
    return null;
  }
  function saveLocalDB(){ localStorage.setItem('flow_v3',JSON.stringify(db)); }
  let _saveTimer = null;
  let _refreshTimer = null;
  let _lastSavedJSON = null;
  function saveDB(){
    normalizeDB();
    saveLocalDB();
    const nextJSON = JSON.stringify(db);
    if(nextJSON === _lastSavedJSON){ setSyncState('ok'); return; }
    setSyncState('syncing');
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(()=>{
      if(!navigator.onLine){
        // ── File d'attente hors-ligne ──
        localStorage.setItem('flow_pending_sync', nextJSON);
        setSyncState('error');
        return;
      }
      const payload = JSON.parse(nextJSON);
      fbdb.ref('flow').set(payload)
        .then(()=>{ _lastSavedJSON = nextJSON; setSyncState('ok'); localStorage.removeItem('flow_pending_sync'); })
        .catch(()=>setSyncState('error'));
    }, 650);
  }
  // Rejoue toute modification mise en file pendant une période hors-ligne.
  // Appelée à la fois sur l'événement "online" ET au démarrage de l'app :
  // si la page a été fermée/rechargée hors-ligne puis rouverte alors que la

  // jamais — sans cet appel au boot, les changements resteraient bloqués
  // indéfiniment dans localStorage sans jamais remonter vers Firebase.
  function flushPendingSync(silent){
    const pending = localStorage.getItem('flow_pending_sync');
    if(!pending || !navigator.onLine) return;
    try{
      const payload = JSON.parse(pending);
      fbdb.ref('flow').set(payload).then(()=>{
        _lastSavedJSON = pending;
        setSyncState('ok');
        localStorage.removeItem('flow_pending_sync');
        if(!silent) toast('✅ Données synchronisées après reconnexion.','success');
      }).catch(()=>setSyncState('error'));
    }catch(_){}
  }

  // Revenu réel d'un projet : entrées financières manuelles liées au projet
  // + factures (type "Facture") payées du client associé à ce projet.
  function getProjectRealRevenue(projectId){
    const proj = db.projects.find(p=>p.id===projectId);
    const fromFinance = (db.finance||[]).filter(e=>e.projectId===projectId).reduce((s,e)=>s+Number(e.amount||0),0);
    const fromInvoices = proj && proj.clientId
      ? (db.invoices||[]).filter(i=>i.clientId===proj.clientId&&i.type==='Facture'&&i.paymentStatus==='paid').reduce((s,i)=>s+Number(i.ttc||0),0)
      : 0;
    return fromFinance + fromInvoices;
  }

  // Score de priorité de relance d'une facture impayée : combine montant,
  // ancienneté, et historique de paiement du client (un client qui a déjà
  // payé en retard plusieurs fois est plus risqué qu'un nouveau client).
  // Plus le score est élevé, plus la relance est urgente.
  function computeRelancePriority(inv){
    if(inv.type!=='Facture' || inv.paymentStatus!=='pending') return null;
    const daysSince = Math.floor((Date.now() - new Date(inv.createdAt).getTime()) / 86400000);
    const amountScore = Math.min(40, (inv.ttc||0) / 50);             // gros montants pèsent plus
    const ageScore = Math.min(40, daysSince * 1.5);                   // plus c'est vieux, plus c'est urgent
    const clientHistory = (db.invoices||[]).filter(i=>i.clientId===inv.clientId && i.type==='Facture' && i.id!==inv.id);
    const latePaidCount = clientHistory.filter(i=>{
      if(i.paymentStatus!=='paid') return false;
      const wasOverdue = Math.floor((new Date(i.signedAt||i.createdAt).getTime() - new Date(i.createdAt).getTime())/86400000) >= 30;
      return wasOverdue;
    }).length;
    const historyScore = Math.min(20, latePaidCount * 10);           // mauvais payeur récurrent
    return { score: Math.round(amountScore+ageScore+historyScore), daysSince, latePaidCount };
  }

  // ─── Auth & crypto ──────────────────────────────
  // Politique de robustesse minimale : 8+ caractères, au moins une majuscule,
  // une minuscule et un chiffre. Retourne null si valide, ou un message
  // d'erreur explicite sinon — à appeler avant toute création/changement de
  // mot de passe (création de compte, profil, édition admin, inscription).
  function validatePasswordStrength(pwd){
    if(!pwd || pwd.length < 8) return 'Le mot de passe doit faire au moins 8 caractères.';
    if(!/[a-z]/.test(pwd)) return 'Le mot de passe doit contenir au moins une lettre minuscule.';
    if(!/[A-Z]/.test(pwd)) return 'Le mot de passe doit contenir au moins une lettre majuscule.';
    if(!/[0-9]/.test(pwd)) return 'Le mot de passe doit contenir au moins un chiffre.';
    return null;
  }

  async function hashPwd(pwd){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
    return 'sha256:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  // Salted SHA-256 : format sha256s:SALT:HASH (résistant aux tables arc-en-ciel,
  // mais rapide à calculer donc faible face au brute-force hors-ligne — conservé
  // uniquement pour compatibilité ascendante, migré vers PBKDF2 à la connexion).
  async function hashPwdSalted(pwd){
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const salt = Array.from(saltBytes).map(b=>b.toString(16).padStart(2,'0')).join('');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+pwd));
    const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    return `sha256s:${salt}:${hash}`;
  }
  // PBKDF2-SHA256, 210 000 itérations (recommandation OWASP 2023) : standard
  // actuel. Volontairement lent pour rendre le brute-force hors-ligne coûteux,
  // même si la base venait à fuiter. Format : pbkdf2:ITER:SALT:HASH
  const PBKDF2_ITERATIONS = 210000;
  async function hashPwdStrong(pwd){
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const salt = Array.from(saltBytes).map(b=>b.toString(16).padStart(2,'0')).join('');
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash:'SHA-256' },
      keyMaterial, 256
    );
    const hash = Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
    return `pbkdf2:${PBKDF2_ITERATIONS}:${salt}:${hash}`;
  }
  async function verifyPwd(pwd, stored){
    if(!stored) return false;
    if(stored.startsWith('pbkdf2:')){
      const parts = stored.split(':');
      if(parts.length!==4) return false;
      const [, iterStr, salt, hash] = parts;
      const iterations = parseInt(iterStr,10)||PBKDF2_ITERATIONS;
      const saltBytes = new Uint8Array(salt.match(/.{2}/g).map(h=>parseInt(h,16)));
      const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits(
        { name:'PBKDF2', salt: saltBytes, iterations, hash:'SHA-256' },
        keyMaterial, 256
      );
      const h = Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
      return h===hash;
    }
    if(stored.startsWith('sha256s:')){
      const parts = stored.split(':');
      if(parts.length!==3) return false;
      const [, salt, hash] = parts;
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+pwd));
      const h = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      return h===hash;
    }
    // Rétrocompatibilité SHA-256 sans sel
    return (await hashPwd(pwd))===stored;
  }
  // Mots de passe d'origine du SEED (pour réparer une corruption éventuelle)
  const _SEED_PASSWORDS = {
    'u1':      'sha256:7f204f9d4c60db37b8307d493622894f6d20577a0a87ecb6d7b532bb58b9cee3',
    'u2':      'sha256:9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0',
    'u_teste1':'sha256:15bf532d22345576b4a51b96da4754c039ef3458494066d76828e893d69ebd1e'
  };

  async function migratePasswords(){
    let changed = false;
    for(const u of db.users){
      // ── Réparer la corruption : si un compte SEED a un sha256: différent du SEED d'origine
      //    c'est qu'il a été re-haché par erreur (sha256s: → sha256:) → restaurer le SEED
      if(_SEED_PASSWORDS[u.id] && u.password &&
         u.password.startsWith('sha256:') && u.password !== _SEED_PASSWORDS[u.id]){
        u.password = _SEED_PASSWORDS[u.id]; changed = true;
        console.info('[Flow] Mot de passe restauré pour', u.username);
      }
      // ── Ne migrer que les mots de passe en clair (pas hashés du tout)
      if(u.password && !u.password.startsWith('sha256:') && !u.password.startsWith('sha256s:') && !u.password.startsWith('pbkdf2:')){
        u.password = await hashPwd(u.password); changed = true;
      }
    }
    if(changed) saveDB();
  }
  async function loginAsync(username, password){
    const u = db.users.find(u=>u.username.toLowerCase()===username.toLowerCase());
    if(!u) return false;
    const ok = await verifyPwd(password, u.password);
    if(!ok) return false;
    // Upgrade automatique vers le hachage le plus fort disponible (PBKDF2) à
    // chaque connexion réussie tant que l'ancien format est encore en place.
    if(u.password && !u.password.startsWith('pbkdf2:')){
      u.password = await hashPwdStrong(password);
      saveDB();
    }
    me = u; sessionStorage.setItem('flow_uid', u.id);
    logActivity('login', 'Connexion de ' + u.username);
    return true;
  }

    renderCmdResults('');
    inp.oninput = ()=>renderCmdResults(inp.value);
    inp.onkeydown = (e)=>{
      const items = document.querySelectorAll('#cmd-results .cmd-item');
      const active = document.querySelector('#cmd-results .cmd-item.cmd-active');
      const idx = Array.from(items).indexOf(active);
      if(e.key==='ArrowDown'){ e.preventDefault(); const next=items[Math.min(idx+1,items.length-1)]; if(next){if(active)active.classList.remove('cmd-active');next.classList.add('cmd-active');next.scrollIntoView({block:'nearest'});} }
      if(e.key==='ArrowUp'){ e.preventDefault(); const prev=items[Math.max(idx-1,0)]; if(prev){if(active)active.classList.remove('cmd-active');prev.classList.add('cmd-active');prev.scrollIntoView({block:'nearest'});} }
      if(e.key==='Enter'){ const cur=document.querySelector('#cmd-results .cmd-item.cmd-active'); if(cur) cur.click(); }
    };
  }
  function closeCmdPalette(){
    const pal = document.getElementById('cmd-palette');
    if(pal) pal.classList.remove('open');

  function fuzzyScore(text, q) {
    if (!q) return 2;
    text = text.toLowerCase();
    if (text.includes(q)) return 3;
    // Fuzzy: tous les caractères de q apparaissent dans l'ordre dans text
    let tIdx = 0;
    for (let i = 0; i < q.length; i++) {
      tIdx = text.indexOf(q[i], tIdx);
      if (tIdx === -1) return 0;
      tIdx++;
    }
    // Bonus si les premiers caractères matchent
    return text.startsWith(q[0]) ? 2 : 1;
  }

  function renderCmdResults(q){
    const res = document.getElementById('cmd-results');
    if(!res) return;
    q = (q||'').toLowerCase().trim();
    const scored = [];

    function push(score, item){ if(score>0) scored.push({score, item}); }

    // Navigation
    const tabs = [{id:'home',label:'Accueil'},{id:'users',label:'Utilisateurs'},{id:'documents',label:'Suivi & Docs'},{id:'finance',label:'Finance'},{id:'requests',label:'Demandes'},{id:'history',label:'Historique'},{id:'profile',label:'Mon Profil'}];
    tabs.forEach(t=>push(fuzzyScore(t.label,q),{icon:'🧭',label:t.label,sub:'Navigation',action:()=>{activeTab=t.id;closeCmdPalette();refreshAdminTab();}}));

    // Clients/users
    db.users.slice(0,20).forEach(u=>{
      const hay = u.username+' '+(u.firstName||'')+' '+(u.lastName||'')+' '+u.email;
      const s = fuzzyScore(hay, q);
      if(s>0) push(s,{icon:'👤',label:u.username+(u.firstName?` (${u.firstName} ${u.lastName||''})`.trim():''),sub:'Utilisateur · '+u.role,action:()=>{ activeTab='users'; closeCmdPalette(); refreshAdminTab(); }});
    });

    // Projects
    db.projects.filter(p=>!p.archived).slice(0,30).forEach(p=>{
      const hay = p.name+' '+(p.tags||[]).join(' ')+' '+(p.description||'');
      const s = fuzzyScore(hay, q);
      if(s>0) push(s,{icon:'📁',label:p.name,sub:'Projet · '+(p.status==='done'?'Terminé':p.status==='in_progress'?'En cours':'En attente'),action:()=>{ activeTab='documents'; closeCmdPalette(); refreshAdminTab(); }});
    });

    // Finance
    (db.finance||[]).slice(0,30).forEach(e=>{
      const pname = db.projects.find(p=>p.id===e.projectId)?.name||e.label||'';
      const hay = pname+' '+(e.label||'')+' '+(e.date||'');
      const s = fuzzyScore(hay, q);
      if(s>0) push(s,{icon:'💰',label:(pname||e.label||'—')+' — '+(e.amount||0)+'€',sub:'Finance · '+(e.date||''),action:()=>{ activeTab='finance'; closeCmdPalette(); refreshAdminTab(); }});
    });

    // Actions fixes
    [
      {q:'nouveau projet',   icon:'➕',label:'Nouveau projet',   sub:'Action', fn:()=>{ closeCmdPalette(); activeTab='home'; refreshAdminTab(); setTimeout(openCreateProjectModal,100); }},
      {q:'ajouter finance',  icon:'💶',label:'Ajouter entrée finance',sub:'Action', fn:()=>{ closeCmdPalette(); activeTab='finance'; refreshAdminTab(); setTimeout(openAddRevenueModal,100); }},
      {q:'déconnexion',      icon:'🔐',label:'Se déconnecter',   sub:'Action', fn:()=>{ closeCmdPalette(); logout(); }},
      {q:'thème',            icon:'🎨',label:'Changer le thème', sub:'Action', fn:()=>{ const t=toggleTheme(); closeCmdPalette(); toast('Thème '+(t==='light'?'clair':'sombre')+' activé','info'); }},
    ].forEach(a=>push(fuzzyScore(a.q,q),{icon:a.icon,label:a.label,sub:a.sub,action:a.fn}));

    scored.sort((a,b)=>b.score-a.score);
    const items = scored.slice(0,12).map(x=>x.item);

    if(items.length===0){
      res.innerHTML=`<div style="padding:14px 16px;color:var(--ink-4);font-size:.85rem;" role="option">Aucun résultat pour "${esc(q)}"</div>`;
      return;
    }
    res.innerHTML = items.map((it,i)=>`
      <div class="cmd-item${i===0?' cmd-active':''}" role="option" aria-selected="${i===0}" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:9px;cursor:pointer;transition:background .12s;">
        <span style="font-size:1.1rem;flex-shrink:0;" aria-hidden="true">${it.icon}</span>
        <div style="flex:1;min-width:0;"><div style="font-size:.875rem;font-weight:500;color:var(--ink);">${esc(it.label)}</div><div style="font-size:.72rem;color:var(--ink-4);">${esc(it.sub)}</div></div>
      </div>`).join('');
    res.querySelectorAll('.cmd-item').forEach((el,i)=>{
      el.addEventListener('click',()=>items[i].action());
      el.addEventListener('mouseenter',()=>{ res.querySelectorAll('.cmd-item').forEach(x=>{ x.classList.remove('cmd-active'); x.setAttribute('aria-selected','false'); }); el.classList.add('cmd-active'); el.setAttribute('aria-selected','true'); });
    });
  }

  function bootApp(){
    // Rejoue immédiatement toute modification restée en file d'attente
    // d'une session précédente fermée hors-ligne (voir flushPendingSync).
    flushPendingSync(true);

    // Masquage de confidentialité : quand l'onglet passe en arrière-plan
    // (changement d'onglet, minimisation, verrouillage d'appareil), un
    // calque opaque recouvre l'écran pour empêcher la capture visuelle des
    // données sensibles dans l'aperçu du gestionnaire de tâches du système
    // ou par-dessus l'épaule. Réservé aux comptes admin/contrôleur, qui
    // voient des données financières et clients sur plusieurs projets — un
    // client ne voit que son propre projet, risque bien moindre. La session
    // applicative reste valide (pas de ré-authentification, juste un clic
    // pour révéler) : Flow n'a pas de clé cryptographique en mémoire à
    // purger comme une app zero-knowledge, donc une re-saisie du mot de
    // passe à chaque retour d'onglet serait une friction sans gain réel.
    function ensurePrivacyShield(){
      let shield = document.getElementById('privacy-shield');
      if(!shield){
        shield = document.createElement('div');
        shield.id = 'privacy-shield';
        shield.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#15100b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;';
        shield.innerHTML = '<div style="font-family:\'Instrument Serif\',serif;font-style:italic;font-size:1.8rem;color:#d97757;">flow</div><div style="font-size:.82rem;color:rgba(var(--ink-rgb),.5);">Contenu masqué — cliquez pour afficher</div>';
        shield.addEventListener('click', ()=>{ shield.style.display='none'; });
        document.body.appendChild(shield);
      }
      return shield;
    }
    document.addEventListener('visibilitychange', ()=>{
      if(!me || (me.role!=='admin' && me.role!=='controller')) return;
      if(document.hidden){
        ensurePrivacyShield().style.display = 'flex';
      }
    });

    // F1 — Idle timer setup
    ['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdleTimer,{passive:true}));
    setInterval(()=>{ if(me && Date.now()-lastActivity > 30*60*1000){ toast('Déconnexion automatique (inactivité).','info',4000); logout(); } }, 60000);

    // F4 — Keyboard shortcuts
    document.addEventListener('keydown', e=>{

      if(e.key==='Escape'){ closeModal(); closeCmdPalette(); }
      if((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey)&&me){ e.preventDefault(); openCmdPalette(); }
      const tag = document.activeElement?.tagName;
      if(e.key==='n' && tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT' && !e.ctrlKey && !e.metaKey){
        if(canManageProjects(me)){
          if(activeTab==='home') openCreateProjectModal();
          else if(activeTab==='users') openCreateUserModal();
        }
      }
    });

    // Affichage immédiat avec les données locales (localStorage/seed déjà
    // chargées dans `db`), sans attendre la réponse Firebase. Avant ce
    // correctif, tout le rendu initial était bloqué derrière
    // fbdb.ref('flow').once('value') : si le WebSocket Firebase est lent à
    // s'établir (réseau restrictif, proxy, latence) et que le SDK doit
    // retomber sur son fallback long-polling, l'utilisateur pouvait rester
    // plusieurs minutes devant un écran vide avant le premier rendu. La
    // synchronisation Firebase se fait maintenant en arrière-plan : dès
    // qu'elle se résout, les données distantes sont fusionnées et l'UI est
    // re-rendue, mais l'app est utilisable en mode local dès le départ.
    setSyncState('syncing');
    if(!renderPublicRouteIfAny()){
      migratePasswords().then(()=>{
        checkSession();
        render();
        if(me && (me.role==='admin'||me.role==='controller')) requestNotifPermission();
        checkVersion();
      });
    }

    fbdb.ref('flow').once('value')
      .then(snap=>{
        const remote = snap.val();
        if(remote && remote.users){
          db = remote;
          const preStr = JSON.stringify(db);
          normalizeDB();
          const postStr = JSON.stringify(db);
          saveLocalDB();
          if(postStr !== preStr){ fbdb.ref('flow').set(db).catch(()=>{}); }
          _lastSavedJSON = postStr;
        } else { fbdb.ref('flow').set(db); }
        setSyncState('ok');
        startRealtimeSync();
        // Les données distantes ont pu différer du seed/cache local affiché
        // au premier rendu : on rafraîchit l'UI avec l'état désormais à jour.
        if(!renderPublicRouteIfAny()){
          if(me){ me = db.users.find(u=>u.id===me.id)||me; }
          render();
        }
      })
      .catch(()=>{
        setSyncState('error');
        toast('Firebase hors ligne — mode local activé','error');
      });
  }
  function startRealtimeSync(){
    prevFilledDocIds = new Set(db.documents.filter(d=>d.status==='filled').map(d=>d.id));

    // F3 — Offline banner
    fbdb.ref('.info/connected').on('value', snap=>{
      let banner = document.getElementById('offline-banner');
      if(snap.val()===false){
        if(!banner){
          banner = document.createElement('div');
          banner.id='offline-banner';
          banner.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9000;background:rgba(200,70,70,.92);color:#fff;text-align:center;padding:8px 16px;font-size:.85rem;font-weight:500;letter-spacing:.01em;';
          banner.textContent='⚠️ Connexion perdue — modifications en attente de synchronisation';
          document.body.prepend(banner);
        }
      } else {
        if(banner) banner.remove();
      }
    });

    fbdb.ref('flow').on('value', snap=>{
      const remote = snap.val();
      if(!remote || !remote.users) return;
      db = remote;
      const preStr = JSON.stringify(db);
      normalizeDB();
      const postStr = JSON.stringify(db);
      saveLocalDB();
      if(postStr !== preStr){ fbdb.ref('flow').set(db).catch(()=>{}); }
      _lastSavedJSON = postStr;
      if(me && me.role !== 'client'){
        const nowFilled = db.documents.filter(d=>d.status==='filled');
        nowFilled.forEach(d=>{
          if(!prevFilledDocIds.has(d.id)){
            const client = db.users.find(u=>u.id===d.clientId);
            toast(`📋 ${client?client.username:'Client'} a rempli "${esc(d.name)}"`, 'info', 5000);
            sendBrowserNotif('Flow — Nouveau document', `${client?client.username:'Client'} a rempli "${d.name}"`);
            sendDiscordNotif('📋 Document rempli', '**'+(client?client.username:'Client')+'** a rempli le document **'+d.name+'**', 0x9bb8d8);
            notifBadge++; updateNotifBadge();
          }
        });
        prevFilledDocIds = new Set(nowFilled.map(d=>d.id));
      }
      if(me){ me = db.users.find(u=>u.id===me.id)||me; clearTimeout(_refreshTimer); _refreshTimer=setTimeout(()=>{ if(me.role==='client') refreshClientTab(); else refreshAdminTab(); },500); }
    });
  }

  let _loginClockTimer = null;
  function wireLogin(){
    const regBtn = document.getElementById('li-register');
    if(regBtn) regBtn.addEventListener('click', openRegisterModal);
    // Afficher / masquer le mot de passe
    const eye = document.getElementById('li-eye');
    if(eye) eye.addEventListener('click',()=>{
      const inp = document.getElementById('li-pass');
      const show = inp.type==='password';
      inp.type = show ? 'text' : 'password';
      eye.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
      eye.innerHTML = show
        ? '<svg class="fi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18 M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3 3.7 M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6 M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
        : ic('eye','',18);
    });
    // Thème clair / sombre
    const themeBtn = document.getElementById('li-theme');
    if(themeBtn) themeBtn.addEventListener('click',()=>{
      toggleTheme();
      themeBtn.innerHTML = ic(currentTheme()==='light'?'moon':'sun','',16);
    });
    // Horloge façon écran de verrouillage Windows
    clearInterval(_loginClockTimer);
    _loginClockTimer = setInterval(()=>{
      const t = document.getElementById('lg-time');
      if(!t){ clearInterval(_loginClockTimer); return; }
      const c = _loginClock();
      t.textContent = c.time;
      document.getElementById('lg-date').textContent = c.date;
    }, 15000);
    const doLogin = async ()=>{
      const u = document.getElementById('li-user').value.trim();
      const p = document.getElementById('li-pass').value;
      if(!u||!p) return;
      const btn = document.getElementById('li-btn');
      btn.disabled = true; btn.textContent = '…';

      // Anti-bruteforce par compte (stocké en base, donc valable peu importe
      // le navigateur/appareil utilisé pour l'attaque) — 5 tentatives puis
      // blocage de 5 min. Message unifié pour ne pas révéler si un compte existe.
      const GENERIC_FAIL = 'Identifiant ou mot de passe incorrect.';
      const target = db.users.find(x=>x.username.toLowerCase()===u.toLowerCase());

      if(target && target.lockUntil && Date.now() < target.lockUntil){
        const remaining = Math.ceil((target.lockUntil-Date.now())/60000);
        document.getElementById('app').innerHTML = renderLogin(`Trop de tentatives sur ce compte. Réessayez dans ${remaining} min.`);
        wireLogin(); return;
      }
      // Blocage générique par navigateur en complément, pour ralentir le
      // balayage d'identifiants inexistants (énumération de comptes).
      const attempts = parseInt(localStorage.getItem('flow_attempts')||'0');
      const lockUntil = parseInt(localStorage.getItem('flow_lock')||'0');
      if(Date.now() < lockUntil){
        const remaining = Math.ceil((lockUntil-Date.now())/60000);
        document.getElementById('app').innerHTML = renderLogin(`Trop de tentatives. Réessayez dans ${remaining} min.`);
        wireLogin(); return;
      }

      if(!target){
        const newAttempts = attempts+1;
        localStorage.setItem('flow_attempts', newAttempts);
        if(newAttempts>=5){ localStorage.setItem('flow_lock', Date.now()+5*60*1000); }
        document.getElementById('app').innerHTML = renderLogin(GENERIC_FAIL);
        wireLogin(); return;
      }
      const ok = await loginAsync(u,p);
      if(!ok){
        target.failedAttempts = (target.failedAttempts||0)+1;
        if(target.failedAttempts>=5){ target.lockUntil = Date.now()+5*60*1000; target.failedAttempts=0; }
        saveDB();
        const newAttempts = attempts+1;
        localStorage.setItem('flow_attempts', newAttempts);
        if(newAttempts>=5){ localStorage.setItem('flow_lock', Date.now()+5*60*1000); }
        document.getElementById('app').innerHTML = renderLogin(GENERIC_FAIL);
        wireLogin(); return;
      }
      target.failedAttempts = 0; target.lockUntil = 0;
      localStorage.removeItem('flow_attempts'); localStorage.removeItem('flow_lock');
      saveDB();
      render();
      checkVersion();
    };
    document.getElementById('li-btn').addEventListener('click',doLogin);
    document.getElementById('li-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
    document.getElementById('li-user').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('li-pass').focus(); });

  }

  function projectHealthScore(p) {
    let score = 100;
    const reasons = [];
    const today = new Date(); today.setHours(0,0,0,0);
    const tl = p.timeline||[];
    const doneCnt = tl.filter(s=>s.status==='done').length;
    const pct = tl.length>0 ? doneCnt/tl.length : 0;

    if (p.dueDate) {
      const due = new Date(p.dueDate);
      const diffDays = Math.ceil((due-today)/(1000*60*60*24));
      if (diffDays < 0) {
        score -= Math.min(45, Math.abs(diffDays)*5);
        reasons.push(`En retard de ${Math.abs(diffDays)}j`);
      } else if (diffDays <= 7 && pct < 0.85) {
        score -= 30;
        reasons.push(`Échéance dans ${diffDays}j, ${Math.round(pct*100)}% fait`);
      } else if (p.createdAt) {
        const start = new Date(p.createdAt);
        const total = due - start;
        const elapsed = Date.now() - start;
        const expPct = total>0 ? Math.min(1, elapsed/total) : 0;
        if (pct < expPct - 0.25) { score -= 20; reasons.push('Progression en retard sur planning'); }
      }
    }

    const docs = db.documents.filter(d=>d.projectId===p.id);
    docs.filter(d=>d.status==='pending').forEach(d=>{
      if (!d.sentAt) return;
      const days = Math.ceil((Date.now()-new Date(d.sentAt))/(1000*60*60*24));
      if (days > 14) { score -= 15; reasons.push(`"${(d.name||'Doc').slice(0,18)}" en attente ${days}j`); }
      else if (days > 7) { score -= 7; reasons.push(`Doc en attente ${days}j`); }
    });

    if (p.priority==='urgent') score -= 5;
    score = Math.max(0, Math.min(100, score));

    const label = score>=75 ? 'Bonne santé' : score>=45 ? 'Attention' : 'Critique';
    const color = score>=75 ? 'var(--sage)' : score>=45 ? 'var(--peach)' : '#f08a8a';
    return { score, label, color, reasons };
  }

  function detectFinanceAnomalies() {
    const entries = db.finance||[];
    if (entries.length < 4) return [];
    const monthMap = {};
    entries.forEach(e=>{ if(!e.date) return; const m=e.date.slice(0,7); monthMap[m]=(monthMap[m]||0)+Number(e.amount||0); });
    const months = Object.keys(monthMap).sort();
    if (months.length < 4) return [];
    const amounts = months.map(m=>monthMap[m]);
    const avg = amounts.reduce((s,v)=>s+v,0)/amounts.length;
    if (avg===0) return [];
    const anomalies = [];
    months.slice(-4).forEach(m=>{
      if (monthMap[m] < avg*0.45) {
        const lbl = new Date(m+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
        anomalies.push({ type:'low', message:`Revenus faibles en ${lbl} : ${monthMap[m].toLocaleString('fr-FR')}€ (moy. ${Math.round(avg).toLocaleString('fr-FR')}€)` });
      }
    });
    if (months.length >= 6) {
      const avgLast3 = amounts.slice(-3).reduce((s,v)=>s+v,0)/3;
      const avgPrev3 = amounts.slice(-6,-3).reduce((s,v)=>s+v,0)/3;
      if (avgPrev3>0 && avgLast3 < avgPrev3*0.55) {
        anomalies.push({ type:'trend', message:`Tendance baissière détectée : -${Math.round((1-avgLast3/avgPrev3)*100)}% sur les 3 derniers mois` });
      }
    }
    return anomalies;
  }

  function extractTasksFromText(text) {
    if (!text||text.trim().length<8) return [];
    const tasks = [];
    text.split(/[\n;]/).forEach(line=>{
      const t = line.trim();
      if (t.length<5||t.length>180) return;
      const m = t.match(/^[\-*•]\s+(.+)$/) ||
                t.match(/^(à faire|todo|faire|finir|terminer|envoyer|appeler|contacter|préparer|relancer|vérifier|corriger|ajouter|créer|modifier|penser à)[:\s]+(.+)/i);
      if (m) tasks.push((m[2]||m[1]).trim());
    });
    return [...new Set(tasks)].slice(0, 8);
  }

  function autoClassifyDoc(name) {
    const n = (name||'').toLowerCase();
    if (/brief|créatif|graphi|couleur|référen/.test(n)) return { icon:'🎨', label:'Brief créatif' };
    if (/contrat|accord|mission|prestation|sign/.test(n)) return { icon:'📝', label:'Contrat' };
    if (/devis|facture|prix|tarif|budget/.test(n)) return { icon:'💶', label:'Devis / Facture' };
    if (/retour|feedback|commentaire|correction|modif/.test(n)) return { icon:'💬', label:'Retour client' };
    if (/cahier|charge|fonctionnel|spec|exig/.test(n)) return { icon:'📋', label:'Cahier des charges' };
    if (/checklist|liste|valider|confirm/.test(n)) return { icon:'✅', label:'Checklist' };
    if (/rapport|compte.rendu|bilan|résumé/.test(n)) return { icon:'📊', label:'Rapport' };
    return null;
  }
