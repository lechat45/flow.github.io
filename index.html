      <div style="margin-bottom:14px;">
        <label class="label">Budget estimé (€)</label>
        <input id="tl-budget" class="glass-input" type="number" min="0" placeholder="Ex : 2500" value="${p.budgetEstimated||''}" />
        <div style="font-size:.72rem;color:var(--ink-4);margin-top:5px;">Comparé automatiquement aux montants encaissés liés à ce projet.</div>
      </div>
      <div style="margin-bottom:14px;">
        <label class="label">Géré par</label>
        <select id="tl-assigned" class="glass-input">
          <option value="">— Non assigné —</option>
          ${db.users.filter(u=>u.role==='admin'||u.role==='controller').map(u=>`<option value="${u.id}" ${p.assignedTo===u.id?'selected':''}>${esc(u.username)}</option>`).join('')}
        </select>
      </div>
      <div style="margin-bottom:14px;padding:12px 14px;background:rgba(var(--fg-rgb),.03);border-radius:10px;border:1px solid rgba(var(--fg-rgb),.07);">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:${p.portfolioPublic?'10px':'0'};">
          <input type="checkbox" id="tl-portfolio" ${p.portfolioPublic?'checked':''} style="width:16px;height:16px;accent-color:var(--coral);cursor:pointer;" />
          <span class="label" style="margin:0;">🌐 Afficher dans le portfolio public</span>
        </label>
        <div id="tl-portfolio-desc-wrap" style="display:${p.portfolioPublic?'block':'none'};">
          <textarea id="tl-portfolio-desc" class="glass-input" placeholder="Description courte pour le portfolio (visible publiquement)" style="width:100%;min-height:60px;">${esc(p.portfolioDescription||'')}</textarea>
          <div style="font-size:.7rem;color:var(--ink-4);margin-top:4px;">⚠️ Activez ceci uniquement avec l'accord du client — le nom du projet et cette description seront visibles publiquement, sans connexion.</div>
        </div>
      </div>
      <div style="margin-bottom:14px;">
        <label class="label">FAQ client (questions / réponses)</label>
        <div id="tl-faq-list">
          ${(p.faq||[]).map((f,i)=>`
            <div style="background:rgba(var(--fg-rgb),.03);border:1px solid rgba(var(--fg-rgb),.07);border-radius:8px;padding:10px;margin-bottom:8px;" data-fidx="${i}">
              <input class="glass-input faq-q" placeholder="Question…" value="${esc(f.q||'')}" style="margin-bottom:6px;font-size:.82rem;" />
              <textarea class="glass-input faq-a" placeholder="Réponse…" style="font-size:.82rem;min-height:50px;">${esc(f.a||'')}</textarea>
              <button class="btn btn-danger btn-sm faq-del" data-fidx="${i}" style="margin-top:6px;">🗑 Supprimer</button>
            </div>`).join('')}
        </div>
        <button id="tl-add-faq" class="btn btn-ghost btn-sm" style="margin-top:4px;">+ Ajouter Q&A</button>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
        <button id="tl-save" class="btn btn-primary" style="flex:1;justify-content:center;">💾 Enregistrer</button>
      </div>
      ${(()=>{
        const projLogs = (db.activityLog||[]).filter(e=>e.projectId===projectId||e.description&&e.description.includes(p.name)).slice(0,8);
        if(!projLogs.length) return '';
        return `<div style="margin-top:20px;border-top:1px solid rgba(var(--fg-rgb),.07);padding-top:16px;">
          <div style="font-size:.78rem;font-weight:600;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;">Historique du projet</div>
          ${projLogs.map(e=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(var(--fg-rgb),.04);">
            <span style="font-size:.8rem;color:var(--ink-3);flex:1;">${esc(e.description)}</span>
            <span style="font-size:.7rem;color:var(--ink-4);white-space:nowrap;">${e.at?new Date(e.at).toLocaleDateString('fr-FR'):'—'}</span>
          </div>`).join('')}
        </div>`;
      })()}`,
    ()=>{
      document.getElementById('tl-add').addEventListener('click',()=>{
        const container=document.getElementById('tl-steps');
        const newId=uid();
        const div=document.createElement('div');
        div.style.cssText='margin-bottom:8px;padding:10px;background:rgba(var(--fg-rgb),.03);border:1px solid rgba(var(--fg-rgb),.07);border-radius:10px;';
        div.dataset.sid=newId;
        div.innerHTML=`
          <div style="display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin-bottom:6px;">
            <input class="glass-input tl-label-input" value="" placeholder="Nouvelle étape" data-sid="${newId}" />
            <input type="date" class="glass-input tl-date-input" style="width:130px;" data-sid="${newId}" value="" />
            <select class="glass-input tl-status-select" style="width:120px;" data-sid="${newId}">
              <option value="done">✅ Fait</option>
              <option value="current">▶️ En cours</option>
              <option value="pending" selected>⏳ À faire</option>
            </select>
            <button class="btn btn-danger btn-sm tl-del" data-sid="${newId}" title="Supprimer">🗑</button>
          </div>
          <input class="glass-input tl-note-input" placeholder="Note sur cette étape (optionnel)…" value="" data-sid="${newId}" style="font-size:.8rem;" />`;
        container.appendChild(div);
        div.querySelector('.tl-del').addEventListener('click',()=>div.remove());
      });

      // Drag & drop reorder steps
      const tlSteps = document.getElementById('tl-steps');
      let dragSrc = null;
      tlSteps.querySelectorAll('[data-sid]').forEach(row=>{
        row.addEventListener('dragstart',e=>{ dragSrc=row; row.style.opacity='.4'; e.dataTransfer.effectAllowed='move'; });
        row.addEventListener('dragend',()=>{ row.style.opacity=''; dragSrc=null; });
        row.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
        row.addEventListener('drop',e=>{
          e.preventDefault();
          if(dragSrc&&dragSrc!==row){
            const rows=Array.from(tlSteps.querySelectorAll('[data-sid]'));
            const srcIdx=rows.indexOf(dragSrc), tgtIdx=rows.indexOf(row);
            if(srcIdx<tgtIdx) row.after(dragSrc); else row.before(dragSrc);
          }
        });
      });

      document.querySelectorAll('.tl-del').forEach(b=>{
        b.addEventListener('click',()=>b.closest('[data-sid]').remove());
      });

      document.getElementById('tl-portfolio')?.addEventListener('change',e=>{
        const wrap = document.getElementById('tl-portfolio-desc-wrap');
        if(wrap) wrap.style.display = e.target.checked ? 'block' : 'none';
      });

      document.getElementById('tl-add-faq')?.addEventListener('click',()=>{
        const list=document.getElementById('tl-faq-list');
        const idx=list.querySelectorAll('[data-fidx]').length;
        const div=document.createElement('div');
        div.style.cssText='background:rgba(var(--fg-rgb),.03);border:1px solid rgba(var(--fg-rgb),.07);border-radius:8px;padding:10px;margin-bottom:8px;';
        div.dataset.fidx=idx;
        div.innerHTML=`<input class="glass-input faq-q" placeholder="Question…" style="margin-bottom:6px;font-size:.82rem;" /><textarea class="glass-input faq-a" placeholder="Réponse…" style="font-size:.82rem;min-height:50px;"></textarea><button class="btn btn-danger btn-sm faq-del" data-fidx="${idx}" style="margin-top:6px;">🗑 Supprimer</button>`;
        div.querySelector('.faq-del').addEventListener('click',()=>div.remove());
        list.appendChild(div);
      });
      document.querySelectorAll('.faq-del').forEach(b=>b.addEventListener('click',()=>b.closest('[data-fidx]').remove()));

      // F11 — Color picker in edit modal
      document.querySelectorAll('#tl-colors .color-dot').forEach(dot=>{
        dot.addEventListener('click',()=>{
          document.querySelectorAll('#tl-colors .color-dot').forEach(d=>d.classList.remove('selected'));
          dot.classList.add('selected');
          document.getElementById('tl-color').value = dot.dataset.color;
        });
      });

      document.getElementById('tl-save').addEventListener('click',()=>{
        const steps=[];
        const prevById = {};
        (p.timeline||[]).forEach(s=>{ prevById[s.id]=s.status; });
        document.querySelectorAll('#tl-steps [data-sid]').forEach(row=>{
          const sid=row.dataset.sid;
          const labelEl=row.querySelector('.tl-label-input');
          const statusEl=row.querySelector('.tl-status-select');
          if(!labelEl||!statusEl) return;
          const label=labelEl.value.trim();
          const status=statusEl.value;
          const dueDate=row.querySelector('.tl-date-input')?.value||'';
          const note=row.querySelector('.tl-note-input')?.value||'';
          if(label) steps.push({id:sid,label,status,dueDate,date:null,note});
        });
        // Notifie le client pour chaque étape qui vient de passer à "terminée"
        // (il n'aurait sinon découvert l'avancement qu'en se reconnectant).
        steps.forEach(s=>{
          if(s.status==='done' && prevById[s.id] && prevById[s.id]!=='done'){
            pushNotification(p.clientId, '✅ Étape terminée', 'L\'étape "'+s.label+'" de votre projet "'+p.name+'" vient d\'être marquée comme terminée.', 'success');
          }
        });
        p.timeline=steps;
        p.description=document.getElementById('tl-desc').value.trim();
        p.dueDate=document.getElementById('tl-due').value||'';
        p.status=document.getElementById('tl-proj-status').value;
        p.priority=document.getElementById('tl-priority')?.value||'normal';
        p.budgetEstimated=parseFloat(document.getElementById('tl-budget')?.value)||0;
        p.assignedTo=document.getElementById('tl-assigned')?.value||null;
        p.portfolioPublic=document.getElementById('tl-portfolio')?.checked||false;
        p.portfolioDescription=document.getElementById('tl-portfolio-desc')?.value.trim()||'';
        p.welcomeMessage=document.getElementById('tl-welcome')?.value.trim()||'';
        p.color=document.getElementById('tl-color')?.value||'';
        p.tags=document.getElementById('tl-tags')?.value.split(',').map(t=>t.trim()).filter(Boolean)||[];
        const faqItems=[];
        document.querySelectorAll('#tl-faq-list [data-fidx]').forEach(row=>{
          const q=row.querySelector('.faq-q')?.value.trim();
          const a=row.querySelector('.faq-a')?.value.trim();
          if(q) faqItems.push({q,a:a||''});
        });
        p.faq=faqItems;
        if(p.status==='done') launchConfetti();
        saveDB(); closeModal(); refreshAdminTab();
      });
    });
  }

  // ── Send Document Modal ────────────────────────
  function openSendDocModal(clientId, projectId){
    if(!projectId){ alert('Associez d\'abord un projet à ce client.'); return; }
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <h2 style="font-size:1.1rem;font-weight:700;">Envoyer un document</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <div style="margin-bottom:14px;"><label class="label">Nom du document</label><input id="sd-name" class="glass-input" placeholder="Ex : Questionnaire Brief Client" /><div id="sd-classify-hint" style="margin-top:5px;font-size:.76rem;min-height:16px;transition:color .2s;"></div></div>
      ${(db.docTemplates||[]).length>0?`<div style="margin-bottom:14px;"><label class="label">Charger un modèle</label><div style="display:flex;gap:8px;"><select id="sd-tpl" class="glass-input" style="flex:1;"><option value="">— Choisir un modèle —</option>${(db.docTemplates||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button id="sd-load-tpl" class="btn btn-ghost btn-sm">Charger</button></div></div>`:''}
      <div id="sd-fields">
        <div class="label" style="margin-bottom:8px;">Champs du formulaire</div>
        <div id="sd-fields-list">
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <input class="glass-input sd-field-label" placeholder="Question ou champ" style="flex:1;" />
            <select class="glass-input sd-field-type" style="width:110px;">
              <option value="text">Texte</option>
              <option value="textarea">Paragraphe</option>
            </select>
            <input type="checkbox" class="sd-field-req" title="Champ requis" style="width:16px;height:16px;accent-color:var(--coral);cursor:pointer;" />
          </div>
        </div>
        <button id="sd-add-field" class="btn btn-ghost btn-sm" style="margin-bottom:16px;">+ Champ</button>
      </div>
      <div id="sd-msg" style="display:none;margin-bottom:14px;padding:10px 14px;border-radius:8px;font-size:.85rem;"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;min-width:100px;">Annuler</button>
        <button id="sd-preview" class="btn btn-ghost btn-sm" style="flex-shrink:0;" title="Voir comme le client verra le document">👁 Aperçu</button>
        <button id="sd-save-tpl" class="btn btn-ghost btn-sm" style="flex-shrink:0;" title="Sauvegarder comme modèle">💾 Modèle</button>
        <button id="sd-send" class="btn btn-primary" style="flex:1;justify-content:center;min-width:100px;">📤 Envoyer</button>
      </div>`,
    ()=>{
      document.getElementById('sd-name').addEventListener('input', ()=>{
        const hint = document.getElementById('sd-classify-hint');
        if (!hint) return;
        const cls = autoClassifyDoc(document.getElementById('sd-name').value);
        hint.textContent = cls ? `${cls.icon} Classifié comme : ${cls.label}` : '';
        hint.style.color = cls ? 'var(--coral-soft)' : '';
      });
      const tplLoadBtn = document.getElementById('sd-load-tpl');
      if(tplLoadBtn) tplLoadBtn.addEventListener('click',()=>{
        const tplId = document.getElementById('sd-tpl').value;
        const tpl = (db.docTemplates||[]).find(t=>t.id===tplId);
        if(!tpl) return;
        document.getElementById('sd-name').value = tpl.name;
        const list = document.getElementById('sd-fields-list');
        list.innerHTML = tpl.fields.map(f=>`<div style="display:flex;gap:8px;margin-bottom:8px;">
          <input class="glass-input sd-field-label" placeholder="Question ou champ" style="flex:1;" value="${esc(f.label)}" />
          <select class="glass-input sd-field-type" style="width:110px;"><option value="text"${f.type==='text'?' selected':''}>Texte</option><option value="textarea"${f.type==='textarea'?' selected':''}>Paragraphe</option></select>
          <input type="checkbox" class="sd-field-req" title="Champ requis" style="width:16px;height:16px;accent-color:var(--coral);cursor:pointer;"${f.required?' checked':''} />
          <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button></div>`).join('');
        toast('Modèle chargé.','success');
      });

      // Aperçu avant envoi
      document.getElementById('sd-preview').addEventListener('click',()=>{
        const name = document.getElementById('sd-name').value.trim()||'Aperçu document';
        const fields=[];
        document.querySelectorAll('#sd-fields-list > div').forEach(row=>{
          const label=row.querySelector('.sd-field-label')?.value.trim();
          const type=row.querySelector('.sd-field-type')?.value||'text';
          const req=row.querySelector('.sd-field-req')?.checked||false;
          if(label) fields.push({id:uid(),label,type,required:req,value:''});
        });
        if(!fields.length){ toast('Ajoutez des champs avant de prévisualiser.','error'); return; }
        showModal(`
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <h2 style="font-size:1rem;font-weight:700;">👁 Aperçu — vue client</h2>
            <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
          </div>
          <div style="background:rgba(var(--fg-rgb),.03);border:1px solid rgba(var(--fg-rgb),.08);border-radius:12px;padding:18px;">
            <h3 style="font-size:.95rem;font-weight:700;margin-bottom:16px;">${esc(name)}</h3>
            ${fields.map(f=>`
              <div style="margin-bottom:14px;">
                <label style="display:block;font-size:.78rem;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;">${esc(f.label)}${f.required?` <span style="color:var(--coral);">*</span>`:''}</label>
                ${f.type==='textarea'
                  ?`<textarea class="glass-input" placeholder="Votre réponse…" style="min-height:80px;opacity:.6;" disabled></textarea>`
                  :`<input class="glass-input" placeholder="Votre réponse…" style="opacity:.6;" disabled />`}
              </div>`).join('')}
            <button class="btn btn-primary" style="width:100%;justify-content:center;opacity:.5;" disabled>✅ Envoyer (désactivé — aperçu)</button>
          </div>`);
      });

      document.getElementById('sd-save-tpl').addEventListener('click',()=>{
        const name = document.getElementById('sd-name').value.trim();
        if(!name){ toast('Donnez un nom au document d\'abord.','error'); return; }
        const fields = [];
        document.querySelectorAll('#sd-fields-list > div').forEach(row=>{
          const label = row.querySelector('.sd-field-label')?.value.trim();
          const type  = row.querySelector('.sd-field-type')?.value||'text';
          const req   = row.querySelector('.sd-field-req')?.checked||false;
          if(label) fields.push({label,type,required:req});
        });
        if(!db.docTemplates) db.docTemplates=[];
        db.docTemplates.push({id:uid(),name,fields});
        saveDB(); toast('Modèle "'+name+'" sauvegardé !','success');
      });

      document.getElementById('sd-add-field').addEventListener('click',()=>{
        const list=document.getElementById('sd-fields-list');
        const row=document.createElement('div');
        row.style.cssText='display:flex;gap:8px;margin-bottom:8px;';
        row.innerHTML=`
          <input class="glass-input sd-field-label" placeholder="Question ou champ" style="flex:1;" />
          <select class="glass-input sd-field-type" style="width:110px;">
            <option value="text">Texte</option>
            <option value="textarea">Paragraphe</option>
          </select>
          <input type="checkbox" class="sd-field-req" title="Champ requis" style="width:16px;height:16px;accent-color:var(--coral);cursor:pointer;" />
          <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>`;
        list.appendChild(row);
      });

      document.getElementById('sd-send').addEventListener('click',()=>{
        const name=document.getElementById('sd-name').value.trim();
        const msg=document.getElementById('sd-msg');
        if(!name){ showMsg(msg,'Le nom du document est requis.','error'); return; }

        const fields=[];
        document.querySelectorAll('#sd-fields-list > div').forEach(row=>{
          const label=row.querySelector('.sd-field-label')?.value.trim();
          const type=row.querySelector('.sd-field-type')?.value||'text';
          const required=row.querySelector('.sd-field-req')?.checked||false;
          if(label) fields.push({id:uid(),label,type,required,value:''});
        });
        if(fields.length===0){ showMsg(msg,'Ajoutez au moins un champ.','error'); return; }

        const doc={ id:uid(), name, projectId, clientId,
          sentBy:me.id, sentAt:new Date().toISOString().slice(0,10),
          status:'pending', fields, filledAt:null };
        db.documents.push(doc);
        saveDB(); closeModal(); refreshAdminTab();
      });
    });
  }

  // ── Confirm Validate Document (F15) ───────────
  function confirmValidateDoc(docId){
    const doc=db.documents.find(d=>d.id===docId);
    if(!doc) return;
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <h2 style="font-size:1.1rem;font-weight:700;">✅ Valider le document</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <p style="color:var(--ink-2);font-size:.9rem;margin-bottom:16px;">Valider <strong>${esc(doc.name)}</strong> ?</p>
      <div style="margin-bottom:16px;">
        <label class="label">Commentaire pour le client (optionnel)</label>
        <textarea id="val-comment" class="glass-input" placeholder="Tout est validé, merci !" style="min-height:70px;"></textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
        <button id="val-confirm" class="btn btn-primary" style="flex:1;justify-content:center;">✅ Valider</button>
      </div>`,
    ()=>{
      document.getElementById('val-confirm').addEventListener('click',()=>{
        const comment = document.getElementById('val-comment').value.trim()||'';
        if(!Array.isArray(doc.history)) doc.history=[];
        doc.history.push({ v:doc.history.length+1, action:'validated', by:me.username, date:new Date().toISOString(), comment });
        doc.status='reviewed';
        doc.adminComment=comment;
        doc.reviewedAt=new Date().toISOString().slice(0,10);
        logActivity('doc_validated','Document validé : '+doc.name);
        const docProj = db.projects.find(p=>p.id===doc.projectId);
        if(docProj && docProj.clientId){
          pushNotification(docProj.clientId, '✅ Document validé', 'Votre document "'+doc.name+'" a été validé par votre équipe.'+(comment?' '+comment:''), 'success');
        }
        saveDB(); toast('Document validé !','success'); closeModal(); refreshAdminTab();
      });
    });
  }

  // ── View Document Modal (admin) ────────────────
  function openViewDocModal(docId, canValidate){
    const doc=db.documents.find(d=>d.id===docId);
    if(!doc) return;
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <h2 style="font-size:1.1rem;font-weight:700;">📄 ${esc(doc.name)}</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <div style="font-size:.8rem;color:rgba(var(--ink-rgb),.4);margin-bottom:20px;">
        Envoyé le ${esc(doc.sentAt||'—')} · Statut : <strong style="color:#d97757;">${{pending:'En attente',filled:'Rempli',reviewed:'Validé'}[doc.status]||doc.status}</strong>
      </div>
      ${doc.fields.map(f=>`
        <div class="pdf-field">
          <label>${esc(f.label)}</label>
          <div class="glass-input" style="opacity:.7;min-height:${f.type==='textarea'?'60px':'auto'};font-size:.85rem;cursor:default;">

        </div>`).join('')}
      ${(doc.history||[]).length>0?`
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid rgba(var(--fg-rgb),.07);">
        <div style="font-size:.8rem;font-weight:600;color:var(--ink-3);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase;">Historique des versions</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${[...(doc.history||[])].reverse().map(h=>`
            <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(var(--fg-rgb),.03);border-radius:8px;font-size:.78rem;">
              <span style="width:22px;height:22px;border-radius:50%;background:${h.action==='validated'?'rgba(147,181,148,.2)':'rgba(155,184,216,.15)'};display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;">${h.action==='validated'?'✓':'📝'}</span>
              <div style="flex:1;">
                <span style="color:${h.action==='validated'?'var(--sage)':'var(--sky)'};">${h.action==='validated'?'Validé':'Rempli'}</span>
                ${h.comment?` — <span style="color:var(--ink-3);font-style:italic;">${esc(h.comment.substring(0,60))}</span>`:''}
              </div>
              <span style="color:var(--ink-4);">${esc(h.by)} · v${h.v}</span>
              <span style="color:var(--ink-4);">${new Date(h.date).toLocaleDateString('fr-FR')}</span>
            </div>`).join('')}
        </div>
      </div>`:''}
      <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap;">
        ${canValidate&&doc.status==='filled'?`<button id="doc-validate" class="btn btn-success">✅ Valider</button>`:''}
        <button id="doc-export-pdf" class="btn btn-ghost">📥 Export PDF</button>
        <button onclick="closeModal()" class="btn btn-ghost">Fermer</button>
      </div>`,
    ()=>{
      const btn=document.getElementById('doc-validate');
      if(btn) btn.addEventListener('click',()=>confirmValidateDoc(docId));
      document.getElementById('doc-export-pdf').addEventListener('click',()=>{
        if(!window.jspdf){ toast('jsPDF non chargé','error'); return; }
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const statusLabels = {pending:'En attente',filled:'Rempli',reviewed:'Validé'};
        pdf.setFont('helvetica','bold'); pdf.setFontSize(18); pdf.setTextColor(217,119,87);
        pdf.text('Flow — Document', 20, 18);
        pdf.setTextColor(30,20,15); pdf.setFontSize(14);
        pdf.text(doc.name, 20, 28);
        pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(120,100,80);
        pdf.text('Envoyé le: '+(doc.sentAt||'—')+'  |  Statut: '+(statusLabels[doc.status]||doc.status), 20, 36);
        pdf.setDrawColor(217,119,87); pdf.setLineWidth(0.5); pdf.line(20, 40, 190, 40);
        let y = 50;
        doc.fields.forEach(f=>{
          pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(50,35,25);
          const labelLines = pdf.splitTextToSize(f.label, 170);
          pdf.text(labelLines, 20, y); y += labelLines.length*5+3;
          pdf.setFont('helvetica','normal'); pdf.setTextColor(80,60,45);
          const valLines = pdf.splitTextToSize(f.value||'(non rempli)', 165);
          pdf.text(valLines, 25, y); y += valLines.length*5+8;
          if(y>275){ pdf.addPage(); y=20; }
        });
        pdf.save(doc.name.replace(/[^a-z0-9]/gi,'_').toLowerCase()+'.pdf');
        toast('PDF exporté !','success');
      });
    });
  }

  // ── Fill Document Modal (client) ───────────────
  function openFillDocModal(docId){
    const doc=db.documents.find(d=>d.id===docId);
    if(!doc) return;
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <h2 style="font-size:1.1rem;font-weight:700;">✏️ ${esc(doc.name)}</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      ${doc.fields.map(f=>`
        <div class="pdf-field">
          <label>${esc(f.label)}${f.required?`<span style="color:var(--coral);margin-left:2px;">*</span>`:''}</label>
          ${f.type==='textarea'
            ?`<textarea class="glass-input doc-field" data-fid="${f.id}">${esc(f.value)}</textarea>`
            :`<input class="glass-input doc-field" type="text" data-fid="${f.id}" value="${esc(f.value)}" />`}
        </div>`).join('')}
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
        <button id="fill-submit" class="btn btn-primary" style="flex:1;justify-content:center;">📤 Envoyer à l'admin</button>
      </div>`,
    ()=>{
      document.getElementById('fill-submit').addEventListener('click',()=>{
        let hasError=false;
        document.querySelectorAll('.doc-field').forEach(inp=>{
          const f=doc.fields.find(x=>x.id===inp.dataset.fid);
          if(f&&f.required&&!inp.value.trim()){
            inp.style.borderColor='rgba(220,80,80,.6)';
            hasError=true;
          } else {
            inp.style.borderColor='';
          }
        });
        if(hasError){ toast('Certains champs obligatoires sont vides.','error'); return; }
        document.querySelectorAll('.doc-field').forEach(inp=>{
          const f=doc.fields.find(x=>x.id===inp.dataset.fid);
          if(f) f.value=inp.value;
        });
        // Sauvegarder une version dans l'historique
        if(!Array.isArray(doc.history)) doc.history=[];
        doc.history.push({ v:doc.history.length+1, action:'filled', by:me.username, date:new Date().toISOString(), fields:JSON.parse(JSON.stringify(doc.fields)) });
        doc.status='filled';
        doc.filledAt=new Date().toISOString().slice(0,10);
        saveDB(); closeModal();
        refreshClientTab();
      });
    });
  }

  function wireAdminRequests(){
    document.querySelectorAll('.btn-approve-req').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const req = (db.pendingUsers||[]).find(u=>u.id===btn.dataset.uid);
        if(!req) return;
        const roleEl = document.querySelector(`.req-role-select[data-uid="${req.id}"]`);
        const role = roleEl ? roleEl.value : 'client';
        if(!canCreateRole(me.role, role)){
          toast('Vous n\'avez pas la permission d\'attribuer ce rôle.','error'); return;
        }
        db.users.push({
          id: req.id,
          username: req.username,
          firstName: req.firstName||'',
          lastName: req.lastName||'',
          email: req.email||'',
          password: req.password,
          photo: null,
          role: role,
          internalNote: ''
        });
        db.pendingUsers = (db.pendingUsers||[]).filter(u=>u.id!==req.id);
        logActivity('user_created','Compte approuvé : @'+req.username+' ('+role+')');
        saveDB(); toast('Compte @'+req.username+' approuvé !','success'); refreshAdminTab();
      });
    });

    document.querySelectorAll('.btn-reject-req').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const req = (db.pendingUsers||[]).find(u=>u.id===btn.dataset.uid);
        if(!req) return;
        confirmAction('Refuser la demande de @'+req.username+' ?', ()=>{
          db.pendingUsers = (db.pendingUsers||[]).filter(u=>u.id!==req.id);
          logActivity('request_rejected','Demande refusée : @'+req.username);
          saveDB(); toast('Demande refusée.','info'); refreshAdminTab();
        }, {label:'Refuser', danger:true});
      });
    });

    document.querySelectorAll('.btn-block-req').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const req = (db.pendingUsers||[]).find(u=>u.id===btn.dataset.uid);
        if(!req) return;
        confirmAction('Bloquer @'+req.username+' ? Aucune future demande ne sera acceptée avec ce pseudo/email.', ()=>{
          if(!db.blockedAccounts) db.blockedAccounts = [];
          db.blockedAccounts.push({ username: req.username, email: req.email||'', blockedAt: new Date().toISOString(), blockedBy: me.username });
          db.pendingUsers = (db.pendingUsers||[]).filter(u=>u.id!==req.id);
          logActivity('request_blocked','Compte bloqué : @'+req.username);
          saveDB(); toast('Compte bloqué.','info'); refreshAdminTab();
        }, {label:'Bloquer', danger:true});
      });
    });

    document.querySelectorAll('.btn-unblock-req').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const uname = btn.dataset.username;
        confirmAction('Débloquer @'+uname+' ?', ()=>{
          db.blockedAccounts = (db.blockedAccounts||[]).filter(b=>b.username!==uname);
          logActivity('request_unblocked','Compte débloqué : @'+uname);
          saveDB(); toast('Compte débloqué.','success'); refreshAdminTab();
        }, {label:'Débloquer', danger:false});
      });
    });
  }

  // ─── Generate Client Report (PDF) ───────────────
  function generateClientReport(userId){
    const u = db.users.find(x=>x.id===userId);
    const p = getUserProject(userId);
    if(!u||!p) return;
    if(!window.jspdf){ toast('jsPDF non chargé','error'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const tl = p.timeline||[];
    const done = tl.filter(s=>s.status==='done');
    const pct = tl.length>0 ? Math.round(done.length/tl.length*100) : 0;
    const docs = getProjectDocs(p.id);
    const docsPending = docs.filter(d=>d.status==='pending').length;
    const docsFilled = docs.filter(d=>d.status==='filled').length;
    const docsReviewed = docs.filter(d=>d.status==='reviewed').length;

    // Header
    doc.setFillColor(217,119,87);
    doc.rect(0,0,210,28,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(22);
    doc.setFont('helvetica','bold');
    doc.text('flow', 14, 18);
    doc.setFontSize(11);
    doc.setFont('helvetica','normal');
    doc.text('Rapport de projet', 40, 18);
    doc.text(new Date().toLocaleDateString('fr-FR'), 170, 18);

    // Client & project
    doc.setTextColor(26,19,14);
    doc.setFontSize(16);
    doc.setFont('helvetica','bold');
    doc.text((u.firstName||'')+' '+(u.lastName||u.username), 14, 42);
    doc.setFontSize(11);
    doc.setFont('helvetica','normal');
    doc.setTextColor(100,80,60);
    doc.text('Projet : '+p.name, 14, 52);
    if(p.dueDate) doc.text('Livraison prévue : '+new Date(p.dueDate).toLocaleDateString('fr-FR'), 14, 60);

    // Progress bar
    const y1 = p.dueDate?70:62;
    doc.setTextColor(26,19,14);
    doc.setFontSize(12);
    doc.setFont('helvetica','bold');
    doc.text('Progression globale : '+pct+'%', 14, y1);
    doc.setDrawColor(220,200,180);
    doc.setFillColor(240,230,220);
    doc.roundedRect(14, y1+4, 182, 8, 2, 2, 'F');
    if(pct>0){
      doc.setFillColor(217,119,87);
      doc.roundedRect(14, y1+4, Math.round(182*pct/100), 8, 2, 2, 'F');
    }

    // Timeline
    let y = y1+22;
    doc.setFontSize(12);
    doc.setFont('helvetica','bold');
    doc.setTextColor(26,19,14);
    doc.text('Étapes du projet', 14, y); y+=8;
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    tl.forEach(s=>{
      const mark = s.status==='done'?'✓':s.status==='current'?'▶':'○';
      const col = s.status==='done'?[80,150,80]:s.status==='current'?[217,119,87]:[150,140,130];
      doc.setTextColor(...col);
      doc.text(mark+' '+s.label+(s.dueDate?' ('+new Date(s.dueDate).toLocaleDateString('fr-FR')+')':''), 18, y);
      y+=7;
      if(y>270){ doc.addPage(); y=20; }
    });

    // Documents
    y+=6;
    doc.setFontSize(12);
    doc.setFont('helvetica','bold');
    doc.setTextColor(26,19,14);
    doc.text('Documents', 14, y); y+=8;
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    doc.setTextColor(60,60,60);
    doc.text('En attente : '+docsPending, 18, y); y+=7;
    doc.text('Remplis : '+docsFilled, 18, y); y+=7;
    doc.text('Validés : '+docsReviewed, 18, y); y+=12;

    // Footer
    doc.setFontSize(8);
    doc.setTextColor(180,160,140);
    doc.text('Généré par Flow — '+new Date().toLocaleString('fr-FR'), 14, 285);

    doc.save('rapport_'+u.username+'_'+p.name.replace(/\s+/g,'_')+'.pdf');
    logActivity('report_generated','Rapport généré pour '+u.username);
    saveDB();
    toast('Rapport PDF généré !','success');
  }

  // ════════════════════════════════════════════════
  //  FINANCE
  // ════════════════════════════════════════════════
  function renderAdminFinance(){
    const entries = db.finance||[];
    const projects = db.projects.filter(p=>!p.archived);

    // KPIs
    const total = entries.reduce((s,e)=>s+Number(e.amount||0),0);
    const avgPerProject = entries.length ? Math.round(total/entries.length) : 0;
    const thisMonth = new Date().toISOString().slice(0,7);
    const monthTotal = entries.filter(e=>e.date&&e.date.slice(0,7)===thisMonth).reduce((s,e)=>s+Number(e.amount||0),0);

    // Finance goals
    const monthGoal = db.financeGoal?.monthly||0;
    const annualGoal = db.financeGoal?.annual||0;
    const monthPct = monthGoal>0?Math.min(100,Math.round(monthTotal/monthGoal*100)):0;
    const annualTotal = entries.reduce((s,e)=>{ return (e.date||'').startsWith(new Date().getFullYear().toString())?s+Number(e.amount||0):s; },0);
    const annualPct = annualGoal>0?Math.min(100,Math.round(annualTotal/annualGoal*100)):0;

    // Prévision de trésorerie sur 3 mois, basée sur les factures émises.
    // Deux composantes par mois, affichées séparément pour ne pas créer de
    // fausse certitude :
    // - "confirmé"  : factures déjà émises et en attente de paiement,
    //   réparties sur le mois où elles devraient être encaissées (hypothèse
    //   de délai de paiement de 30 jours après émission, cohérente avec le
    //   seuil "overdue" déjà utilisé ailleurs dans l'app).
    // - "estimé"    : nouvelles factures non encore émises, projetées à
    //   partir de la moyenne mensuelle de facturation des 6 derniers mois
    //   (Factures émises, tous statuts confondus) — un simple indicateur de
    //   tendance, pas une promesse de revenu.
    const cashflowForecast = (()=>{
      const allInvoices = db.invoices||[];
      const pendingInv = allInvoices.filter(i=>i.type==='Facture'&&i.paymentStatus==='pending');
      const now2 = new Date();
      const months = [0,1,2].map(offset=>{
        const d = new Date(now2.getFullYear(), now2.getMonth()+offset, 1);
        return { key:d.toISOString().slice(0,7), label:d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}) };
      });
      // Moyenne mensuelle de facturation sur les 6 derniers mois (toutes
      // factures émises, indépendamment du statut de paiement).
      const sixMonthsAgo = new Date(now2.getFullYear(), now2.getMonth()-6, 1);
      const recentInvoices = allInvoices.filter(i=>i.type==='Facture'&&new Date(i.createdAt)>=sixMonthsAgo);
      const monthsWithData = new Set(recentInvoices.map(i=>i.createdAt.slice(0,7))).size || 1;
      const avgMonthlyBilling = recentInvoices.reduce((s,i)=>s+Number(i.ttc||0),0) / monthsWithData;

      return months.map((m,idx)=>{
        const confirmed = pendingInv.filter(i=>{
          const expectedPaymentDate = new Date(i.createdAt);
          expectedPaymentDate.setDate(expectedPaymentDate.getDate()+30);
          return expectedPaymentDate.toISOString().slice(0,7)===m.key;
        }).reduce((s,i)=>s+Number(i.ttc||0),0);
        // Le mois courant (idx 0) est déjà partiellement engagé (factures
        // déjà émises ce mois) : on n'estime de nouvelles factures que pour
        // les mois encore entièrement à venir.
        const estimated = idx===0 ? 0 : avgMonthlyBilling;
        return { ...m, confirmed, estimated };
      });
    })();

    // Revenu moyen par type de prestation (tags projet) — PAS une marge
    // réelle : l'app ne suit aucun coût/dépense par projet, uniquement des
    // revenus. Ceci compare donc le revenu facturé moyen entre catégories de
    // projets (selon leurs tags libres existants), pour orienter quels
    // types de mission sont les plus rémunérateurs en pratique — un projet
    // avec plusieurs tags compte dans chacune de ses catégories.
    const revenueByTag = (()=>{
      const byTag = {}; // { tag: { total, projectIds:Set } }
      db.projects.forEach(p=>{
        if(!p.clientId || !p.tags || !p.tags.length) return;
        const paidTotal = (db.invoices||[])
          .filter(i=>i.clientId===p.clientId && i.type==='Facture' && i.paymentStatus==='paid')
          .reduce((s,i)=>s+Number(i.ttc||0),0);
        p.tags.forEach(tag=>{
          if(!byTag[tag]) byTag[tag] = { total:0, projectIds:new Set() };
          if(!byTag[tag].projectIds.has(p.id)){
            byTag[tag].total += paidTotal;
            byTag[tag].projectIds.add(p.id);
          }
        });
      });
      return Object.entries(byTag)
        .map(([tag,v])=>({ tag, avg: v.projectIds.size ? v.total/v.projectIds.size : 0, count: v.projectIds.size }))
        .filter(x=>x.count>0)
        .sort((a,b)=>b.avg-a.avg);
    })();

    // Revenue by project
    const byProject = {};
    entries.forEach(e=>{
      const proj = db.projects.find(p=>p.id===e.projectId);
      const key = proj ? proj.name : (e.label||'—');
      byProject[key] = (byProject[key]||0)+Number(e.amount||0);
    });
    const projectEntries = Object.entries(byProject).sort((a,b)=>b[1]-a[1]);
    const maxAmt = projectEntries.length ? projectEntries[0][1] : 1;

    // Revenue by month (last 12)
    const monthMap = {};
    entries.forEach(e=>{
      if(!e.date) return;
      const m = e.date.slice(0,7);
      monthMap[m] = (monthMap[m]||0)+Number(e.amount||0);
    });
    const months = Object.keys(monthMap).sort().slice(-12);
    const maxMonth = months.length ? Math.max(...months.map(m=>monthMap[m])) : 1;

    // Pie chart data (by project, conic-gradient)
    let cumulPct = 0;
    const COLORS = ['#d97757','#93b594','#9bb8d8','#c4a3d4','#f0c080','#e07080','#70b8b8','#b0b0b0'];
    const pieSegments = projectEntries.slice(0,8).map((e,i)=>{
      const pct = total>0 ? (e[1]/total*100) : (100/projectEntries.length);
      const start = cumulPct;
      cumulPct += pct;
      return {label:e[0], pct, start, color:COLORS[i%COLORS.length]};
    });
    const pieGradient = total===0 ? 'rgba(var(--fg-rgb),.1)' : pieSegments.map(s=>`${s.color} ${s.start.toFixed(1)}% ${(s.start+s.pct).toFixed(1)}%`).join(', ');

    const fmtAmt = n => n.toLocaleString('fr-FR')+'€';

    return `<div class="fade-up">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:12px;">
        <h1 style="font-size:1.4rem;font-weight:700;">Finance</h1>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="btn-export-finance-csv" class="btn btn-ghost btn-sm">📊 Exporter CSV</button>
          <button id="btn-export-accounting" class="btn btn-ghost btn-sm">🧾 Export comptable</button>
          <button id="btn-gen-devis" class="btn btn-ghost">📄 Devis / Facture</button>
          <button id="btn-quick-quote-ai" class="btn btn-ghost">✨ Devis express IA</button>
          <button id="btn-company-info" class="btn btn-ghost" title="Informations légales affichées sur vos devis et factures">⚙️ Mes informations</button>
          <button id="btn-add-revenue" class="btn btn-primary">${iconPlus()} Ajouter entrée</button>
        </div>
      </div>
      <p style="color:rgba(var(--ink-rgb),.45);font-size:.875rem;margin-bottom:24px;">Revenus par projet · Visible uniquement par admin et contrôleur</p>

      ${(()=>{
        const anomalies = detectFinanceAnomalies();
        if (!anomalies.length) return '';
        return `<div style="margin-bottom:20px;background:rgba(240,169,136,.08);border:1px solid rgba(240,169,136,.25);border-radius:14px;padding:16px 18px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <span style="font-size:1.1rem;">📉</span>
            <span style="font-size:.9rem;font-weight:600;color:var(--peach);">Analyse financière — points d'attention</span>
          </div>
          ${anomalies.map(a=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:.84rem;color:var(--ink-2);">
            <span style="color:var(--peach);flex-shrink:0;">${a.type==='trend'?'↘':'⚠'}</span>
            <span>${esc(a.message)}</span>
          </div>`).join('')}
        </div>`;
      })()}

      <!-- KPIs -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;">
        <div class="glass-card stat-card">
          <span style="font-size:1.5rem;">💰</span>
          <div style="font-size:1.8rem;font-weight:700;color:var(--sage);margin-top:8px;">${fmtAmt(total)}</div>
          <div style="font-size:.82rem;font-weight:600;color:var(--ink-2);margin-top:4px;">Revenu total</div>
          <div style="font-size:.72rem;color:var(--ink-4);">${entries.length} entrée(s)</div>
        </div>
        <div class="glass-card stat-card">
          <span style="font-size:1.5rem;">📅</span>
          <div style="font-size:1.8rem;font-weight:700;color:var(--sky);margin-top:8px;">${fmtAmt(monthTotal)}</div>
          <div style="font-size:.82rem;font-weight:600;color:var(--ink-2);margin-top:4px;">Ce mois</div>
          <div style="font-size:.72rem;color:var(--ink-4);">${thisMonth}</div>
        </div>
        <div class="glass-card stat-card">
          <span style="font-size:1.5rem;">📊</span>
          <div style="font-size:1.8rem;font-weight:700;color:var(--peach);margin-top:8px;">${fmtAmt(avgPerProject)}</div>
          <div style="font-size:.82rem;font-weight:600;color:var(--ink-2);margin-top:4px;">Moy. par entrée</div>
          <div style="font-size:.72rem;color:var(--ink-4);">${projectEntries.length} projet(s)</div>
        </div>
      </div>

      <!-- Goals -->
      <div class="glass-card" style="padding:20px;margin-bottom:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${(monthGoal>0||annualGoal>0)?'14':'0'}px;">
          <h2 style="font-size:.95rem;font-weight:600;color:var(--peach);">🎯 Objectifs</h2>
          <button id="btn-edit-goals" class="btn btn-ghost btn-sm">Modifier</button>
        </div>
        ${monthGoal<=0&&annualGoal<=0?`<div style="font-size:.82rem;color:var(--ink-4);">Aucun objectif défini. Cliquez sur "Modifier".</div>`:''}
        ${monthGoal>0?`
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px;"><span style="color:var(--ink-2);">Ce mois</span><span style="color:var(--peach);font-weight:600;">${fmtAmt(monthTotal)} / ${fmtAmt(monthGoal)} · ${monthPct}%</span></div>
          <div style="height:8px;background:rgba(var(--fg-rgb),.06);border-radius:6px;overflow:hidden;"><div style="height:100%;width:${monthPct}%;background:linear-gradient(90deg,var(--peach),var(--coral));border-radius:6px;"></div></div>
        </div>`:''}
        ${annualGoal>0?`
        <div>
          <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px;"><span style="color:var(--ink-2);">Cette année</span><span style="color:var(--sage);font-weight:600;">${fmtAmt(annualTotal)} / ${fmtAmt(annualGoal)} · ${annualPct}%</span></div>
          <div style="height:8px;background:rgba(var(--fg-rgb),.06);border-radius:6px;overflow:hidden;"><div style="height:100%;width:${annualPct}%;background:linear-gradient(90deg,var(--sage),var(--sky));border-radius:6px;"></div></div>
        </div>`:''}
      </div>

      <div class="glass-card" style="padding:22px;margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span style="font-size:1rem;">📊</span>
          <h2 style="font-size:.95rem;font-weight:700;">Prévision de trésorerie — 3 mois</h2>
        </div>
        <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:18px;">Confirmé = factures déjà émises, en attente de paiement (échéance estimée à 30j). Estimé = projection basée sur votre moyenne de facturation des 6 derniers mois — une tendance, pas une garantie.</p>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
          ${cashflowForecast.map((m,idx)=>{
            const totalMonth = m.confirmed + m.estimated;
            return `<div class="glass-card" style="padding:16px;background:rgba(var(--fg-rgb),.02);">
              <div style="font-size:.72rem;color:var(--ink-4);text-transform:capitalize;margin-bottom:8px;">${esc(m.label)}</div>
              <div style="font-size:1.3rem;font-weight:700;color:var(--coral);margin-bottom:8px;">${fmtAmt(totalMonth)}</div>
              <div style="font-size:.7rem;color:var(--sage);margin-bottom:2px;">✓ Confirmé : ${fmtAmt(m.confirmed)}</div>
              ${m.estimated>0?`<div style="font-size:.7rem;color:var(--ink-4);">~ Estimé : ${fmtAmt(m.estimated)}</div>`:idx===0?`<div style="font-size:.7rem;color:var(--ink-4);">Mois en cours</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>

      ${revenueByTag.length>0?`
      <div class="glass-card" style="padding:22px;margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span style="font-size:1rem;">🏷️</span>
          <h2 style="font-size:.95rem;font-weight:700;">Revenu moyen par type de prestation</h2>
        </div>
        <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:18px;">Basé sur les tags de vos projets et les factures payées. Pas une marge réelle (aucun coût de production suivi) — un comparatif pour orienter quels types de mission privilégier.</p>
        ${revenueByTag.slice(0,8).map(rt=>{
          const maxAvg = revenueByTag[0].avg || 1;
          const pct = Math.round(rt.avg/maxAvg*100);
          return `<div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px;">
              <span style="color:var(--ink-2);">${esc(rt.tag)} <span style="color:var(--ink-4);font-size:.72rem;">(${rt.count} projet${rt.count>1?'s':''})</span></span>
              <span style="color:var(--peach);font-weight:600;">${fmtAmt(Math.round(rt.avg))}</span>
            </div>
            <div style="height:8px;background:rgba(var(--fg-rgb),.06);border-radius:6px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--peach),var(--coral));border-radius:6px;"></div></div>
          </div>`;
        }).join('')}
      </div>`:''}

      <!-- Charts -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">

        <!-- Bar chart : revenus par projet -->
        <div class="glass-card" style="padding:20px;">
          <h2 style="font-size:.95rem;font-weight:600;margin-bottom:16px;color:var(--coral-soft);">Revenus par projet</h2>
          ${projectEntries.length===0
            ? '<div style="color:rgba(var(--ink-rgb),.35);font-size:.85rem;">Aucune donnée.</div>'
            : projectEntries.slice(0,8).map(([label,amt])=>`
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                <div style="font-size:.78rem;color:var(--ink-2);width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;" title="${esc(label)}">${esc(label)}</div>
                <div style="flex:1;height:10px;background:rgba(var(--fg-rgb),.06);border-radius:6px;overflow:hidden;">
                  <div style="height:100%;width:${Math.round(amt/maxAmt*100)}%;background:linear-gradient(90deg,var(--coral),var(--peach));border-radius:6px;transition:width .4s;"></div>
                </div>
                <div style="font-size:.78rem;font-weight:600;color:var(--coral-soft);flex-shrink:0;">${fmtAmt(amt)}</div>
              </div>`).join('')}
        </div>

        <!-- Pie chart : répartition -->
        <div class="glass-card" style="padding:20px;">
          <h2 style="font-size:.95rem;font-weight:600;margin-bottom:16px;color:var(--sky);">Répartition</h2>
          ${pieSegments.length===0
            ? '<div style="color:rgba(var(--ink-rgb),.35);font-size:.85rem;">Aucune donnée.</div>'
            : `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
                <div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${pieGradient});flex-shrink:0;"></div>
                <div style="flex:1;min-width:120px;">
                  ${pieSegments.map(s=>`
                    <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px;">
                      <div style="width:10px;height:10px;border-radius:2px;background:${s.color};flex-shrink:0;"></div>
                      <span style="font-size:.75rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(s.label)}</span>
                      <span style="font-size:.72rem;color:var(--ink-4);margin-left:auto;">${s.pct.toFixed(0)}%</span>
                    </div>`).join('')}
                </div>
              </div>`}
        </div>
      </div>

      <!-- Monthly bar chart -->
      ${months.length>0?`
      <div class="glass-card" style="padding:20px;margin-bottom:24px;">
        <h2 style="font-size:.95rem;font-weight:600;margin-bottom:16px;color:var(--sage);">Évolution mensuelle</h2>
        <div style="display:flex;align-items:flex-end;gap:8px;height:80px;overflow-x:auto;padding-bottom:4px;">
          ${months.map(m=>{

                  </div>

        })()}
      </div>

  function wireAdminFinance(){
    document.getElementById('btn-ai-relance-priority')?.addEventListener('click',async ()=>{
      const groqKey = db.aiConfig?.groqKey;
      const result = document.getElementById('ai-relance-result');
      if(!groqKey){ toast('Configurez une clé Groq dans l\'onglet Assistant IA.','error'); return; }
      const btn = document.getElementById('btn-ai-relance-priority');
      btn.disabled = true; btn.textContent = '⚙️ Analyse en cours…';
      try{
        const pending = (db.invoices||[]).filter(i=>i.type==='Facture'&&i.paymentStatus==='pending')
          .map(i=>{
            const cl = db.users.find(u=>u.id===i.clientId);
            const pr = computeRelancePriority(i);
            return { num:i.num, client:cl?cl.username:'Client libre', montant:i.ttc, jours:pr?.daysSince||0, retardsPasses:pr?.latePaidCount||0 };
          });
        if(!pending.length){ toast('Aucune facture en attente.','info'); btn.disabled=false; btn.textContent='🧠 Analyser les priorités de relance'; return; }
        const prompt = 'Voici des factures impayées (JSON) : '+JSON.stringify(pending)+'. Classe-les par priorité de relance (la plus urgente en premier) en tenant compte du montant, du nombre de jours sans paiement, et des retards passés du client. Réponds en français, en 3-5 lignes maximum, format liste avec le numéro de facture et une courte raison.';
        const json = await groqPost(groqKey, [{role:'user',content:prompt}], 350);
        const answer = json.choices?.[0]?.message?.content || 'Pas de réponse.';
        result.style.display='block';
        result.textContent = answer;
      }catch(e){
        toast('Erreur lors de l\'analyse : '+e.message,'error');
      }
      btn.disabled = false; btn.textContent = '🧠 Analyser les priorités de relance';
    });
    document.getElementById('btn-export-finance-csv')?.addEventListener('click',()=>{
      const rows = [['Projet','Montant','Date','Statut paiement','Note','Ajouté par']];
      (db.finance||[]).forEach(e=>{
        const pname = db.projects.find(p=>p.id===e.projectId)?.name||e.label||'—';
        rows.push([pname, e.amount||0, e.date||'', e.paymentStatus||'paid', e.note||e.label||'', e.addedBy||'']);
      });
      const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
      const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='flow_finance_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
      toast('CSV exporté !','success');

        navigator.clipboard?.writeText(msg).then(()=>toast('Message de relance copié dans le presse-papiers ✓','success')).catch(()=>{
          showModal(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><h2 style="font-size:1rem;font-weight:700;">✉ Message de relance</h2><button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button></div><textarea class="glass-input" style="width:100%;min-height:200px;" readonly>${esc(msg)}</textarea>`,()=>{});

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
        <div><label class="label">Objectif mensuel (€)</label><input id="goal-monthly" class="glass-input" type="number" min="0" value="${db.financeGoal?.monthly||0}" /></div>

      </div>
      <div style="display:flex;gap:10px;"><button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button><button id="goal-save" class="btn btn-primary" style="flex:1;justify-content:center;">Enregistrer</button></div>`,
      ()=>{ document.getElementById('goal-save').addEventListener('click',()=>{ if(!db.financeGoal) db.financeGoal={}; db.financeGoal.monthly=parseFloat(document.getElementById('goal-monthly').value)||0; db.financeGoal.annual=parseFloat(document.getElementById('goal-annual').value)||0; saveDB(); toast('Objectifs mis à jour !','success'); closeModal(); refreshAdminTab(); }); });
    });

    document.querySelectorAll('.btn-del-finance').forEach(b=>{
      b.addEventListener('click',()=>{
        const e = (db.finance||[]).find(x=>x.id===b.dataset.fid);
        if(!e) return;

          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <h2 style="font-size:1.05rem;font-weight:700;">🗑 Supprimer l'entrée</h2>
            <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
          </div>
          <p style="color:var(--ink-2);font-size:.9rem;margin-bottom:20px;">Supprimer <strong>${esc(e.label)}</strong> — <strong>${Number(e.amount).toLocaleString('fr-FR')}€</strong> ?</p>
          <div style="display:flex;gap:10px;">
            <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
            <button id="confirm-del-fin" class="btn btn-danger" style="flex:1;justify-content:center;">Supprimer</button>
          </div>`,
        ()=>{
          document.getElementById('confirm-del-fin').addEventListener('click',()=>{
            db.finance = db.finance.filter(x=>x.id!==e.id);
            saveDB(); toast('Entrée supprimée.','info'); closeModal(); refreshAdminTab();
          });

  function svgProgressCircle(pct, color='#d97757', size=52){
    const r=20; const circ=2*Math.PI*r;
    const dash=Math.round(pct/100*circ);
    return `<svg width="${size}" height="${size}" viewBox="0 0 52 52" style="flex-shrink:0;">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(var(--fg-rgb),.08)" stroke-width="5"/>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="5"
        stroke-dasharray="${dash} ${circ-dash}" stroke-linecap="round"
        transform="rotate(-90 26 26)"/>
      <text x="26" y="30" text-anchor="middle" fill="${color}" font-size="10" font-weight="700" font-family="Geist,sans-serif">${pct}%</text>
    </svg>`;
  }

  function launchConfetti(){
    const cols=['#d97757','#93b594','#9bb8d8','#c4a3d4','#f0c080','#e07080'];
    for(let i=0;i<70;i++){
      const el=document.createElement('div');
      const s=6+Math.random()*6;
      el.style.cssText=`position:fixed;z-index:9999;width:${s}px;height:${s}px;border-radius:${Math.random()>.5?'50%':'2px'};background:${cols[Math.floor(Math.random()*cols.length)]};left:${Math.random()*100}vw;top:-10px;animation:confetti-fall ${1.5+Math.random()*2}s ease-in ${Math.random()*.8}s forwards;pointer-events:none;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4000);
    }
  }

  // Commentaires threadés par étape de timeline, partagés admin/client.
  // authorRole permet de distinguer visuellement qui écrit quoi.
  function openStepCommentsModal(projectId, stepId){
    const p = db.projects.find(x=>x.id===projectId);
    if(!p) return;
    const step = (p.timeline||[]).find(s=>s.id===stepId);
    if(!step) return;
    if(!Array.isArray(step.comments)) step.comments=[];
    const isClientView = me.role==='client';

    const renderThread=()=>{
      const c=document.getElementById('sc-thread');
      if(!c) return;
      c.innerHTML = step.comments.map(cm=>{
        const mine = cm.authorId===me.id;
        return `<div style="display:flex;${mine?'justify-content:flex-end;':'justify-content:flex-start;'}margin-bottom:8px;">
          <div style="max-width:80%;padding:8px 12px;border-radius:12px;font-size:.84rem;line-height:1.4;${mine?'background:rgba(217,119,87,.18);color:var(--ink);':'background:rgba(var(--fg-rgb),.05);border:1px solid rgba(var(--fg-rgb),.08);color:var(--ink-2);'}">
            <div style="font-size:.7rem;color:var(--ink-4);margin-bottom:2px;font-weight:600;">${esc(cm.authorName)}${cm.authorRole==='client'?'':' (équipe)'}</div>
            <span class="sc-comment-text" data-cid="${cm.id}">${esc(cm.text)}</span>
            <div style="display:flex;align-items:center;gap:8px;margin-top:3px;">
              <span style="font-size:.65rem;color:var(--ink-4);">${new Date(cm.createdAt).toLocaleString('fr-FR')}</span>
              ${!mine?`<button class="sc-translate-btn" data-cid="${cm.id}" style="font-size:.65rem;color:var(--sky);background:none;border:none;cursor:pointer;padding:0;">🌐 Traduire</button>`:''}
            </div>
          </div>
        </div>`;
      }).join('') || `<div style="text-align:center;padding:20px 0;font-size:.82rem;color:var(--ink-4);">Aucun commentaire pour cette étape encore.</div>`;
      c.scrollTop = c.scrollHeight;
      c.querySelectorAll('.sc-translate-btn').forEach(btn=>{
        btn.addEventListener('click',async ()=>{
          const cid = btn.dataset.cid;
          const cm = step.comments.find(x=>x.id===cid);
          if(!cm) return;
          const groqKey = db.aiConfig?.groqKey;
          if(!groqKey){ toast('Traduction indisponible (clé Groq non configurée).','error'); return; }
          btn.textContent = '⚙️…';
          try{
            const prompt = 'Traduis ce texte en français s\'il n\'est pas déjà en français, sinon traduis-le en anglais. Réponds UNIQUEMENT avec la traduction, sans aucun commentaire ni guillemets : "'+cm.text.replace(/"/g,"'")+'"';
            const json = await groqPost(groqKey, [{role:'user',content:prompt}], 200);
            const translated = (json.choices?.[0]?.message?.content||'').trim();
            const textEl = c.querySelector(`.sc-comment-text[data-cid="${cid}"]`);
            if(textEl && translated) textEl.innerHTML = esc(translated) + ` <span style="font-size:.65rem;color:var(--ink-4);font-style:italic;">(traduit)</span>`;
            btn.remove();
          }catch(e){
            btn.textContent = '❌ Erreur';
          }
        });
      });
    };

    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <h2 style="font-size:1.05rem;font-weight:700;">💬 ${esc(step.label)}</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:14px;">${esc(p.name)} — échange visible par le client et votre équipe.</p>
      <div id="sc-thread" style="max-height:320px;overflow-y:auto;margin-bottom:12px;padding:4px;"></div>
      <div style="display:flex;gap:8px;">
        <input id="sc-input" class="glass-input" placeholder="Écrire un commentaire…" style="flex:1;" />
        <button id="sc-send" class="btn btn-primary btn-sm">Envoyer</button>
      </div>`,
    ()=>{
      renderThread();
      const send=()=>{
        const txt=document.getElementById('sc-input')?.value.trim();
        if(!txt) return;
        step.comments.push({ id:uid(), text:txt, authorId:me.id, authorName:me.username, authorRole:me.role, createdAt:new Date().toISOString() });
        saveDB();
        document.getElementById('sc-input').value='';
        renderThread();
        // Notifie l'autre partie : si c'est le client qui écrit, on notifie les
        // admins/contrôleurs ; si c'est l'équipe, on notifie le client.
        if(isClientView){
          pushNotification('admins', '💬 Commentaire client', '@'+me.username+' a commenté l\'étape "'+step.label+'" du projet "'+p.name+'".', 'info');
          analyzeCommentTone(txt, p, step);
        } else if(p.clientId){
          pushNotification(p.clientId, '💬 Nouveau commentaire', 'Votre équipe a répondu sur l\'étape "'+step.label+'" de votre projet.', 'info');
        }
        if(!isClientView) refreshAdminTab(); else refreshClientTab(true);
      };
      document.getElementById('sc-send')?.addEventListener('click',send);
      document.getElementById('sc-input')?.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
    });
  }

  // Détecte un ton frustré/inquiet dans un commentaire client et alerte
  // l'équipe avant que la situation n'escalade. Best-effort : échoue
  // silencieusement si pas de clé Groq configurée ou en cas d'erreur réseau.
  async function analyzeCommentTone(text, project, step){
    const groqKey = db.aiConfig?.groqKey;
    if(!groqKey || text.length<8) return;
    try{
      const prompt = 'Analyse le ton de ce commentaire client et note-le de 1 (très négatif/frustré) à 5 (très positif/satisfait), 3 étant neutre. Réponds UNIQUEMENT au format "SCORE: X" où X est le chiffre, suivi sur une nouvelle ligne de "ALERTE: raison" si et seulement si le ton est frustré, inquiet, mécontent ou impatient (sinon ne mets pas de ligne ALERTE). Commentaire : "'+text.replace(/"/g,"'")+'"';
      const json = await groqPost(groqKey, [{role:'user',content:prompt}], 80);
      const answer = (json.choices?.[0]?.message?.content||'').trim();
      const scoreMatch = /SCORE:\s*(\d)/i.exec(answer);
      if(scoreMatch){
        if(!Array.isArray(project.toneScores)) project.toneScores=[];
        project.toneScores.push({ score:parseInt(scoreMatch[1],10), at:new Date().toISOString() });
        if(project.toneScores.length>50) project.toneScores = project.toneScores.slice(-50);
        saveDB();
      }
      if(/ALERTE/i.test(answer)){
        const reason = answer.split(/ALERTE:?/i)[1]?.trim() || '';
        pushNotification('admins', '⚠️ Ton préoccupant détecté', 'Sur "'+step.label+'" ('+project.name+') : '+(reason||'le client semble frustré ou inquiet.'), 'warning');
      }
    }catch(_){ /* silencieux — ne bloque jamais l'envoi du commentaire */ }
  }

      return { user:u, total:projects.length, active:active.length, overdue:overdue.length, revenue };

  // Résumé IA des échanges Discussion d'un client, pour préparer une réunion
  // sans tout relire — utilise l'historique réel stocké dans db.aiRequests.
  function openSummarizeQAModal(clientId){
    const cl = db.users.find(u=>u.id===clientId);
    const history = (db.aiRequests||[]).filter(r=>r.clientId===clientId&&r.type==='qa'&&r.status==='answered')
      .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <h2 style="font-size:1.05rem;font-weight:700;">✨ Résumé des échanges — ${esc(cl?.username||'Client')}</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:14px;">${history.length} question(s)/réponse(s) avec l'Assistant IA.</p>
      <div id="qa-sum-loading" style="text-align:center;padding:30px 0;color:var(--ink-4);font-size:.85rem;">⚙️ Génération en cours…</div>
      <div id="qa-sum-result" style="display:none;font-size:.85rem;color:var(--ink-2);line-height:1.6;white-space:pre-line;background:rgba(var(--fg-rgb),.03);border:1px solid rgba(var(--fg-rgb),.07);border-radius:10px;padding:14px;"></div>`,
    async ()=>{
      const groqKey = db.aiConfig?.groqKey;
      const loading = document.getElementById('qa-sum-loading');
      const result = document.getElementById('qa-sum-result');
      if(!groqKey){ loading.textContent='Clé Groq non configurée (onglet Assistant IA).'; return; }
      if(!history.length){ loading.textContent='Aucun échange à résumer.'; return; }
      try{
        const transcript = history.slice(-30).map(r=>'Client: '+r.originalMessage+'\nAssistant: '+(r.groqAnswer||'').substring(0,300)).join('\n\n');
        const prompt = 'Voici un historique de conversation entre un client et un assistant IA d\'agence web. Résume en français, en 5-8 lignes maximum, les points clés à retenir avant une réunion avec ce client : ses préoccupations principales, questions récurrentes, et tout signal d\'insatisfaction ou de demande importante.\n\n'+transcript;
        const json = await groqPost(groqKey, [{role:'user',content:prompt}], 400);
        const text = json.choices?.[0]?.message?.content || 'Pas de réponse.';
        loading.style.display='none';
        result.style.display='block';
        result.textContent = text;
      }catch(e){
        loading.textContent = '❌ Erreur : '+e.message;
      }
    });
  }

    const years = [...new Set([
      ...(db.finance||[]).map(e=>(e.date||'').slice(0,4)),
      ...(db.invoices||[]).map(i=>(i.createdAt||'').slice(0,4)),
    ])].filter(Boolean).sort((a,b)=>b-a);
    if(!years.includes(String(now.getFullYear()))) years.unshift(String(now.getFullYear()));

    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">

      </div>
      <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:16px;">Génère un CSV détaillé (entrées financières + factures émises) avec ventilation TVA, pour votre comptable ou votre déclaration.</p>

      <button id="ae-generate" class="btn btn-primary" style="width:100%;justify-content:center;">Générer le CSV</button>`,
    ()=>{
      document.getElementById('ae-generate').addEventListener('click',()=>{
        const period = document.getElementById('ae-period').value;
        const year   = document.getElementById('ae-year').value;

        // Regroupe toutes les opérations (entrées finance + factures émises)
        const ops = [];
        (db.finance||[]).forEach(e=>{
          if(!(e.date||'').startsWith(year)) return;
          const proj = db.projects.find(p=>p.id===e.projectId);
          ops.push({ date:e.date, type:'Entrée manuelle', label:e.note||e.label||(proj?proj.name:'—'), montantHT:Number(e.amount||0), tva:0, montantTTC:Number(e.amount||0), statut:e.paymentStatus||'paid' });
        });
        (db.invoices||[]).forEach(inv=>{
          if(inv.type!=='Facture') return;
          const d = (inv.createdAt||'').slice(0,10);
          if(!d.startsWith(year)) return;
          ops.push({ date:d, type:'Facture N°'+inv.num, label:inv.title, montantHT:Number(inv.ht||0), tva:Number(inv.tva||0), montantTTC:Number(inv.ttc||0), statut:inv.paymentStatus||'pending' });
        });
        ops.sort((a,b)=>new Date(a.date)-new Date(b.date));

        function periodKey(dateStr){
          const m = Number(dateStr.slice(5,7));
          if(period==='year') return year;
          if(period==='quarter') return year+'-T'+(Math.ceil(m/3));
          return dateStr.slice(0,7);
        }

        const rows = [['Période','Date','Type','Libellé','Montant HT','TVA','Montant TTC','Statut']];
        ops.forEach(o=>rows.push([periodKey(o.date), o.date, o.type, o.label, o.montantHT.toFixed(2), o.tva.toFixed(2), o.montantTTC.toFixed(2), o.statut]));

        // Ligne de synthèse par période
        const byPeriod = {};
        ops.forEach(o=>{ const k=periodKey(o.date); if(!byPeriod[k]) byPeriod[k]={ht:0,tva:0,ttc:0}; byPeriod[k].ht+=o.montantHT; byPeriod[k].tva+=o.tva; byPeriod[k].ttc+=o.montantTTC; });
        rows.push([]);
        rows.push(['SYNTHÈSE PAR PÉRIODE']);
        rows.push(['Période','','','','Total HT','Total TVA','Total TTC','']);
        Object.entries(byPeriod).sort((a,b)=>a[0]<b[0]?-1:1).forEach(([k,v])=>rows.push([k,'','','',v.ht.toFixed(2),v.tva.toFixed(2),v.ttc.toFixed(2),'']));

        if(!ops.length){ toast('Aucune opération trouvée pour cette période.','error'); return; }

        const csv = rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
        const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download='flow_export_comptable_'+year+'_'+period+'.csv'; a.click();
        toast('Export comptable généré ✓','success'); closeModal();
      });
    });
  }

  // Devis express par IA : un brief en langage libre est envoyé à Groq, qui
  // retourne une structure de lignes de devis (description/quantité/prix HT
  // estimé). Le résultat n'est qu'une proposition de structure et de
  // fourchette de prix — il pré-remplit le formulaire de devis normal
  // (openDevisModal) pour que l'admin ajuste les montants avant génération
  // du PDF ; aucun PDF n'est créé directement depuis ce mini-modal.
  function openQuickQuoteAIModal(){
    const groqKey = db.aiConfig?.groqKey;
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <h2 style="font-size:1.05rem;font-weight:700;">✨ Devis express par IA</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <p style="font-size:.8rem;color:var(--ink-3);margin-bottom:14px;">Décrivez le besoin client en langage libre — l'IA propose une structure de devis avec postes et prix indicatifs, que vous pourrez ajuster avant de générer le PDF.</p>
      <textarea id="qq-brief" class="glass-input" rows="4" placeholder="Ex : Site vitrine 8 pages avec formulaire de contact, design responsive, délai 1 mois, client petit budget"></textarea>
      <div id="qq-error" style="display:none;margin-top:10px;font-size:.78rem;color:var(--danger);"></div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
        <button id="qq-generate" class="btn btn-primary" style="flex:1;justify-content:center;">✨ Générer la structure</button>
      </div>`,
    ()=>{
      document.getElementById('qq-generate').addEventListener('click', async()=>{
        const errEl = document.getElementById('qq-error');
        errEl.style.display = 'none';
        if(!groqKey){ errEl.textContent = 'Clé Groq non configurée (onglet Assistant IA).'; errEl.style.display = 'block'; return; }
        const brief = document.getElementById('qq-brief').value.trim();
        if(!brief){ errEl.textContent = 'Décrivez le besoin client avant de générer.'; errEl.style.display = 'block'; return; }

        const btn = document.getElementById('qq-generate');
        btn.disabled = true; btn.textContent = 'Génération…';
        try{
          const prompt = `Tu es un chef de projet dans une agence web qui prépare un devis pour un client, en euros, en français.

Brief du besoin client : ${brief}

Propose une structure de devis réaliste : décompose le besoin en postes de travail distincts (ex: conception graphique, développement, intégration, formulaire, hébergement/configuration, formation/livraison...), avec pour chacun une quantité (souvent 1) et un prix unitaire HT en euros, basé sur des tarifs d'agence web freelance/petite structure en France.

Règles :
- 3 à 8 postes, ni plus ni moins que nécessaire pour ce besoin précis.
- Prix réalistes pour le marché français (ni dérisoires, ni excessifs).
- Réponds UNIQUEMENT avec un objet JSON de la forme {"title":"Objet court du devis","lines":[{"desc":"...","qty":1,"price":000}],"notes":"conditions de paiement suggérées, courtes"}, sans texte avant ni après, sans balises markdown.`;

          const json = await groqPost(groqKey, [{role:'user', content:prompt}], 700);
          let raw = json.choices?.[0]?.message?.content || '';
          raw = raw.replace(/```json\n?/g,'').replace(/```/g,'').trim();
          let parsed;
          try{ parsed = JSON.parse(raw); }
          catch(_){ throw new Error('Format de réponse IA invalide.'); }
          const lines = Array.isArray(parsed.lines) ? parsed.lines.filter(l=>l&&typeof l.desc==='string'&&l.desc.trim()).map(l=>({
            desc: l.desc.trim(),
            qty: Number(l.qty)>0 ? Number(l.qty) : 1,
            price: Number(l.price)>=0 ? Number(l.price) : 0
          })) : [];
          if(!lines.length) throw new Error('Aucun poste généré.');

          closeModal();
          openDevisModal({ title: parsed.title||'', notes: parsed.notes||'', lines });
          toast('Structure de devis générée — vérifiez et ajustez les montants avant envoi.','success');
        }catch(e){
          errEl.textContent = 'Erreur lors de la génération : '+(e.message||'inconnue');
          errEl.style.display = 'block';
        }
        btn.disabled = false; btn.textContent = '✨ Générer la structure';
      });
    });
  }

      <div style="display:flex;justify-content:flex-end;gap:24px;margin-bottom:18px;padding:12px 16px;background:rgba(var(--fg-rgb),.03);border:1px solid rgba(var(--fg-rgb),.07);border-radius:10px;">
        <div style="text-align:right;font-size:.8rem;color:var(--ink-3);">
          <div>Total HT : <span id="dv-sum-ht" style="color:var(--ink-2);font-weight:600;">0,00 €</span></div>
          <div>TVA : <span id="dv-sum-tva" style="color:var(--ink-2);font-weight:600;">0,00 €</span></div>

      <div id="dv-check-result" style="display:none;font-size:.8rem;color:var(--ink-3);background:rgba(155,184,216,.06);border:1px solid rgba(155,184,216,.18);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.5;white-space:pre-line;"></div>

        <button id="dv-gen" class="btn btn-primary" style="flex:1;justify-content:center;">Générer le PDF</button>
      </div>`,
    ()=>{
      const fmtEUR = n => (n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
      function recalc(){
        const tvaRate=(parseFloat(document.getElementById('dv-tva').value)||0)/100;
        let ht=0;
        document.querySelectorAll('.dv-line').forEach(l=>{
          const qty=parseFloat(l.querySelector('.dv-qty')?.value)||0;
          const price=parseFloat(l.querySelector('.dv-price')?.value)||0;
          const lineTotal=qty*price;
          ht+=lineTotal;
          const totalEl=l.querySelector('.dv-line-total');
          if(totalEl) totalEl.textContent=fmtEUR(lineTotal);
        });
        const tva=ht*tvaRate, ttc=ht+tva;
        document.getElementById('dv-sum-ht').textContent=fmtEUR(ht);
        document.getElementById('dv-sum-tva').textContent=fmtEUR(tva);
        document.getElementById('dv-sum-ttc').textContent=fmtEUR(ttc);
