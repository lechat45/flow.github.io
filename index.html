      function wireLine(d){
        d.querySelector('.dv-dl').addEventListener('click',()=>{ d.remove(); recalc(); });
        d.querySelectorAll('.dv-qty,.dv-price').forEach(inp=>inp.addEventListener('input',recalc));
      }
      const addLine=()=>{
        const d=document.createElement('div');
        d.className='dv-line';
        d.style.cssText='display:grid;grid-template-columns:1fr 56px 92px 92px auto;gap:6px;margin-bottom:6px;align-items:center;';
        d.innerHTML=`<input class="glass-input dv-desc" placeholder="Description"/><input class="glass-input dv-qty" type="number" value="1" min="1" style="text-align:center;"/><input class="glass-input dv-price" type="number" placeholder="Prix HT €" style="text-align:right;"/><div class="dv-line-total" style="font-size:.8rem;color:var(--ink-3);text-align:right;padding-right:4px;">0,00 €</div><button class="btn btn-danger btn-sm dv-dl">🗑</button>`;
        document.getElementById('dv-lines').appendChild(d);
        wireLine(d);
      };
      document.getElementById('dv-add-line').addEventListener('click',addLine);
      document.querySelectorAll('.dv-line').forEach(wireLine);
      // Remplit les lignes (générées vides ou en nombre = prefill.lines.length
      // côté HTML ci-dessus) avec les valeurs du devis express IA, si fourni.
      if(prefill?.lines?.length){
        const lineEls = [...document.querySelectorAll('.dv-line')];
        prefill.lines.forEach((pl,i)=>{
          const el = lineEls[i];
          if(!el) return;
          const descEl = el.querySelector('.dv-desc'), qtyEl = el.querySelector('.dv-qty'), priceEl = el.querySelector('.dv-price');

          if(qtyEl) qtyEl.value = pl.qty||1;
          if(priceEl) priceEl.value = pl.price||0;
        });
      }
      document.getElementById('dv-tva').addEventListener('input',recalc);
      recalc();

      document.getElementById('dv-check')?.addEventListener('click',async ()=>{
        const groqKey = db.aiConfig?.groqKey;
        const result = document.getElementById('dv-check-result');
        const title   = document.getElementById('dv-title').value||'';
        const tvaRate = document.getElementById('dv-tva').value||'0';
        const lines   = [...document.querySelectorAll('.dv-line')]
          .map(l=>({desc:l.querySelector('.dv-desc')?.value||'',qty:l.querySelector('.dv-qty')?.value||'1',price:l.querySelector('.dv-price')?.value||'0'}))
          .filter(l=>l.desc);
        if(!groqKey){ result.style.display='block'; result.textContent='Clé Groq non configurée — vérification IA indisponible.'; return; }
        if(!lines.length){ result.style.display='block'; result.textContent='Ajoutez au moins une ligne avant de vérifier.'; return; }
        const btn = document.getElementById('dv-check');
        btn.disabled = true; btn.textContent = '⚙️…';

          const prompt = 'Relis ce devis/facture avant envoi au client et signale UNIQUEMENT les incohérences réelles (pas de remarques générales) : objet="'+title+'", TVA='+tvaRate+'%, lignes='+JSON.stringify(lines)+'. Vérifie : prix à 0 ou vide, description vague ou incohérente avec un prix élevé, TVA inhabituelle (ni 0 ni 20 ni 5.5 ni 10), doublons de lignes, fautes évidentes. Si tout est cohérent réponds UNIQUEMENT "OK". Sinon liste les problèmes en français, 1 ligne par problème, sois bref.';
          const json = await groqPost(groqKey, [{role:'user',content:prompt}], 250);
          const answer = (json.choices?.[0]?.message?.content||'').trim();
          result.style.display='block';
          result.textContent = /^OK\.?$/i.test(answer) ? '✓ Aucune incohérence détectée.' : '⚠️ '+answer;
        }catch(e){
          result.style.display='block'; result.textContent = 'Erreur de vérification : '+e.message;
        }
        btn.disabled = false; btn.textContent = '🔍 Vérifier';
      });
      document.getElementById('dv-gen').addEventListener('click',()=>{
        if(!window.jspdf){ toast('jsPDF non chargé','error'); return; }
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const PW=210, PH=297, MX=18;

        const docType = document.getElementById('dv-type').value||'Devis';
        const isFacture = docType==='Facture';
        const cid     = document.getElementById('dv-client').value;
        const client  = db.users.find(u=>u.id===cid);
        const num     = document.getElementById('dv-num').value||'001';
        const title   = document.getElementById('dv-title').value||docType;
        const notes   = document.getElementById('dv-notes').value||'';
        const tvaRate = (parseFloat(document.getElementById('dv-tva').value)||0)/100;
        const lines   = [...document.querySelectorAll('.dv-line')]
          .map(l=>({desc:l.querySelector('.dv-desc')?.value||'',qty:parseFloat(l.querySelector('.dv-qty')?.value)||0,price:parseFloat(l.querySelector('.dv-price')?.value)||0}))
          .filter(l=>l.desc);
        if(!lines.length){ toast('Ajoutez au moins une ligne avec une description.','error'); return; }
        const ht=lines.reduce((s,l)=>s+l.qty*l.price,0);
        const tva=ht*tvaRate, ttc=ht+tva;

        // Formatage monétaire SANS espace insécable Unicode : la police
        // Helvetica intégrée à jsPDF ne possède pas ce glyphe et l'affiche
        // comme un caractère cassé ("/"). On utilise une espace normale.
        const money = n => {
          const fixed = (n||0).toFixed(2).replace('.', ',');
          const [intPart, decPart] = fixed.split(',');
          return intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + decPart + ' €';
        };

        // Couleur du PDF : reprend la couleur du projet du client si définie,
        // sinon le corail Flow par défaut. Variante "deep" assombrie de 25%
        // pour les titres, afin de garder un bon contraste sur fond blanc.
        function hexToRgb(hex){
          const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
          return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : null;
        }
        const clientProject = client ? db.projects.find(p=>p.clientId===client.id && p.color) : null;
        const baseRgb = (clientProject && hexToRgb(clientProject.color)) || [217,119,87];
        const CORAL = baseRgb;
        const CORAL_DEEP = baseRgb.map(c=>Math.round(c*0.7));
        const INK=[26,19,14], INK_3=[120,103,90], INK_4=[165,150,138], PAPER=[250,247,243], LINE=[228,217,206];

        // ── En-tête : logo Flow (serif, fidèle à l'identité du site) ──────
        pdf.setTextColor(...CORAL);
        pdf.setFont('times','italic'); pdf.setFontSize(26);
        pdf.text('flow', MX, 26);
        pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(...INK_3);
        pdf.text('Agence web', MX, 32);

        // Bloc émetteur (mentions légales minimales)
        pdf.setFontSize(7.6); pdf.setTextColor(...INK_3);
        const issuerCfg = (db.companyInfo)||{};
        const issuer = [
          issuerCfg.legalName || 'Flow Agence',
          [issuerCfg.siret?('SIRET '+issuerCfg.siret):'', issuerCfg.vat?('TVA '+issuerCfg.vat):''].filter(Boolean).join(' · '),
          issuerCfg.address || '',
          issuerCfg.email || '',
        ].filter(Boolean);
        issuer.forEach((line,i)=> pdf.text(line, MX, 40 + i*4));

        // Bloc type/numéro/date, aligné à droite
        pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor(...INK);
        pdf.text(docType.toUpperCase(), PW-MX, 22, {align:'right'});
        pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(...INK_3);
        pdf.text('N° '+num, PW-MX, 28, {align:'right'});
        pdf.text('Date d\'émission : '+new Date().toLocaleDateString('fr-FR'), PW-MX, 33, {align:'right'});
        if(isFacture){
          const due = new Date(); due.setDate(due.getDate()+30);
          pdf.text('Échéance : '+due.toLocaleDateString('fr-FR'), PW-MX, 38, {align:'right'});
        } else {
          const valid = new Date(); valid.setDate(valid.getDate()+30);
          pdf.text('Valable jusqu\'au : '+valid.toLocaleDateString('fr-FR'), PW-MX, 38, {align:'right'});
        }

        pdf.setDrawColor(...CORAL); pdf.setLineWidth(.6);
        pdf.line(MX, 58, PW-MX, 58);

        // ── Bloc client ──────────────────────────────────────────
        let y = 68;
        pdf.setTextColor(...INK_4); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
        pdf.text(isFacture?'FACTURÉ À':'ADRESSÉ À', MX, y);
        y += 6;
        pdf.setTextColor(...INK); pdf.setFont('helvetica','bold'); pdf.setFontSize(11.5);
        pdf.text(client ? ((client.firstName||'')+' '+(client.lastName||'')).trim()||client.username : 'Client libre', MX, y);
        if(client){
          pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...INK_3);
          if(client.email){ y += 5.5; pdf.text(client.email, MX, y); }
        }

        // ── Objet ────────────────────────────────────────────────
        y += 12;
        pdf.setFont('helvetica','bold'); pdf.setFontSize(12.5); pdf.setTextColor(...CORAL_DEEP);
        pdf.splitTextToSize(title, PW-2*MX).forEach(l=>{ pdf.text(l, MX, y); y+=6; });

        // ── Tableau des lignes ───────────────────────────────────
        y += 6;
        const colDesc=MX+4, colQty=128, colPU=152, colTot=PW-MX-4;
        pdf.setFillColor(...INK); pdf.rect(MX, y-6.5, PW-2*MX, 9.5, 'F');
        pdf.setFont('helvetica','bold'); pdf.setFontSize(8); pdf.setTextColor(255,255,255);
        pdf.text('DESCRIPTION', colDesc, y);
        pdf.text('QTÉ', colQty, y, {align:'center'});
        pdf.text('PU HT', colPU, y, {align:'right'});
        pdf.text('TOTAL HT', colTot, y, {align:'right'});
        y += 9.5;

        pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
        lines.forEach((l,i)=>{
          if(y>250){ pdf.addPage(); y=28; }
          const rowH = 10;
          if(i%2===0){ pdf.setFillColor(...PAPER); pdf.rect(MX, y-6.5, PW-2*MX, rowH, 'F'); }
          pdf.setTextColor(...INK);
          const descLines = pdf.splitTextToSize(l.desc, colQty-colDesc-8);
          pdf.text(descLines[0]||'', colDesc, y);
          pdf.setTextColor(...INK_3);
          pdf.text(String(l.qty), colQty, y, {align:'center'});
          pdf.text(money(l.price), colPU, y, {align:'right'});
          pdf.setFont('helvetica','bold'); pdf.setTextColor(...INK);
          pdf.text(money(l.qty*l.price), colTot, y, {align:'right'});
          pdf.setFont('helvetica','normal');
          y += rowH;
        });
        pdf.setDrawColor(...LINE); pdf.setLineWidth(.3);
        pdf.line(MX, y-4, PW-MX, y-4);

        // ── Totaux ───────────────────────────────────────────────
        y += 6;
        pdf.setFontSize(9.5); pdf.setTextColor(...INK_3); pdf.setFont('helvetica','normal');
        pdf.text('Total HT', 150, y, {align:'right'}); pdf.text(money(ht), colTot, y, {align:'right'});
        y += 6.5;
        const tvaLabel = tvaRate>0 ? 'TVA ('+(tvaRate*100).toFixed(tvaRate*100%1===0?0:1)+' %)' : 'TVA non applicable — art. 293B du CGI';
        pdf.text(tvaLabel, 150, y, {align:'right'}); if(tvaRate>0) pdf.text(money(tva), colTot, y, {align:'right'});
        y += 10;
        pdf.setFillColor(...CORAL); pdf.roundedRect(112, y-7.5, PW-MX-112, 12, 1.5, 1.5, 'F');
        pdf.setFont('helvetica','bold'); pdf.setFontSize(11.5); pdf.setTextColor(255,255,255);
        pdf.text(isFacture?'TOTAL À PAYER':'TOTAL TTC', 150, y, {align:'right'});
        pdf.text(money(ttc), colTot, y, {align:'right'});

        // ── Notes ────────────────────────────────────────────────
        y += 16;
        if(y>260){ pdf.addPage(); y=28; }
        if(notes){
          pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5); pdf.setTextColor(...INK_4);
          pdf.text('NOTES', MX, y);
          y += 5;
          pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(...INK_3);
          pdf.splitTextToSize(notes, PW-2*MX).forEach(line=>{ pdf.text(line, MX, y); y+=4.6; });
          y += 4;
        }

        // ── Mentions légales (facture uniquement) ─────────────────
        if(isFacture){
          if(y>255){ pdf.addPage(); y=28; }
          pdf.setDrawColor(...LINE); pdf.line(MX, y, PW-MX, y);
          y += 6;
          pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5); pdf.setTextColor(...INK_4);
          pdf.text('CONDITIONS & MENTIONS LÉGALES', MX, y);
          y += 5;
          pdf.setFont('helvetica','normal'); pdf.setFontSize(7.6); pdf.setTextColor(...INK_4);
          [
            'Paiement à réception, sauf échéance indiquée ci-dessus. Tout retard de paiement entraîne, conformément à la loi,',
            'des pénalités au taux légal en vigueur ainsi qu\'une indemnité forfaitaire de 40 € pour frais de recouvrement.',
            'Aucun escompte n\'est accordé pour paiement anticipé.',
          ].forEach(l=>{ pdf.text(l, MX, y); y += 3.8; });
        }

        // ── Pied de page sur toutes les pages ─────────────────────
        const pageCount = pdf.internal.getNumberOfPages();
        for(let p=1;p<=pageCount;p++){
          pdf.setPage(p);
          pdf.setDrawColor(...LINE); pdf.line(MX, 280, PW-MX, 280);
          pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(...INK_4);
          pdf.text((issuerCfg.legalName||'Flow Agence')+' · '+num, MX, 286);
          pdf.text('Page '+p+'/'+pageCount, PW-MX, 286, {align:'right'});
        }

        // ── Sauvegarde dans l'historique Flow ───────────────────
        if(!Array.isArray(db.invoices)) db.invoices=[];
        db.invoices.unshift({ id:uid(), type:docType, num, title, clientId:cid||null, ht, tva, ttc, createdAt:new Date().toISOString(), createdBy:me.username, paymentStatus: isFacture?'pending':null, signedAt: null });
        saveDB();

        pdf.save((isFacture?'facture_':'devis_')+num+'_'+(client?.username||'client')+'.pdf');
        toast(docType+' généré ✓','success'); closeModal(); refreshAdminTab();
      });
    });
  }

      <div class="glass-card" style="padding:22px;margin-bottom:20px;">
        <h2 style="font-size:.95rem;font-weight:700;margin-bottom:14px;">📊 Vue d'ensemble</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;">
          ${[{label:'Projets actifs',val:db.projects.filter(p=>!p.archived).length,color:'var(--coral)'},{label:'En cours',val:db.projects.filter(p=>p.status==='in_progress').length,color:'var(--sky)'},{label:'Clients',val:db.users.filter(u=>u.role==='client').length,color:'var(--sage)'},{label:'Docs en attente',val:db.documents.filter(d=>d.status==='pending'||d.status==='filled').length,color:'var(--peach)'}].map(s=>`<div class="glass-card" style="padding:14px;"><div style="font-size:1.4rem;font-weight:700;color:${s.color};">${s.val}</div><div style="font-size:.72rem;color:var(--ink-4);margin-top:2px;">${s.label}</div></div>`).join('')}

        <div style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;">

        ${allReqs.length===0?`<div style="text-align:center;padding:36px 0;color:var(--ink-4);font-size:.875rem;">Aucune conversation pour l'instant</div>`:`

                  <span style="font-size:.62rem;">${sentimentIcon}</span>

              </div>

                <span style="font-size:.75rem;font-weight:600;color:var(--ink-3);">${esc(r.clientUsername||'—')}</span>
                <span style="font-size:.68rem;color:var(--ink-4);">${ts}</span>
              </div>
            </div>`;
          }).join('')}
        </div>`}
      </div>
    </div>`;
  }

  function wireAdminAIAutomation(){
    const saveBtn = document.getElementById('btn-save-ai-config');
    if(saveBtn) saveBtn.addEventListener('click',()=>{
      if(!db.aiConfig) db.aiConfig={};
      if(!Array.isArray(db.aiConfig.groqKeys)) db.aiConfig.groqKeys = [];
      const existing = db.aiConfig.groqKeys.slice(0,3);
      let changed = false;
      const next = [0,1,2].map(i=>{
        const input = document.getElementById('ai-groq-key-'+(i+1));
        const val = input ? input.value.trim() : '';
        if(val){ changed = true; return val; }
        return existing[i] || '';
      }).filter(k=>k);
      if(next.length===0){
        toast('Veuillez entrer au moins une clé API Groq.','error'); return;
      }
      db.aiConfig.groqKeys = next;
      db.aiConfig.groqKey = next[0]; // compat. ascendante (anciens champs lisant groqKey seul)
      if('claudeKey' in db.aiConfig) delete db.aiConfig.claudeKey;
      if('geminiKey' in db.aiConfig) delete db.aiConfig.geminiKey;
      saveDB();
      toast(changed?`${next.length} clé(s) Groq enregistrée(s) ✓`:'Aucune modification — clés existantes conservées.', changed?'success':'info');
    });

    // #6 — Rapport hebdomadaire IA
    const reportBtn = document.getElementById('btn-weekly-report');
    if(reportBtn) reportBtn.addEventListener('click', async()=>{
      const groqKey = db.aiConfig?.groqKey;
      if(!groqKey){ toast('Clé Groq non configurée.','error'); return; }
      const since7 = new Date(); since7.setDate(since7.getDate()-7);
      const weekReqs = (db.aiRequests||[]).filter(r=>r.status==='answered'&&new Date(r.createdAt)>since7);
      if(!weekReqs.length){ toast('Aucune conversation cette semaine.','info'); return; }
      reportBtn.disabled=true; reportBtn.textContent='Génération…';
      try{
        const lines = weekReqs.map(r=>`- @${r.clientUsername||'?'} : "${r.originalMessage}"`).join('\n');
        const prompt = `Voici les questions posées par des clients sur leur projet cette semaine :\n\n${lines}\n\nFais un résumé structuré en français :\n1. Les thèmes les plus fréquents\n2. Les points de blocage éventuels\n3. Les recommandations pour l'équipe\n\nSois concis (maximum 200 mots).`;
        const json = await groqPost(groqKey,[{role:'user',content:prompt}],400);
        const summary = json.choices?.[0]?.message?.content||'';
        showModal(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;"><h2 style="font-size:1rem;font-weight:700;">📊 Résumé IA — 7 derniers jours</h2><button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button></div><div style="font-size:.875rem;color:var(--ink-2);line-height:1.7;white-space:pre-wrap;background:rgba(var(--fg-rgb),.03);border-radius:10px;padding:16px;">${esc(summary)}</div>`);
      } catch(_){ toast('Erreur lors de la génération.','error'); }
      reportBtn.disabled=false; reportBtn.textContent='📊 Résumé IA — 7 derniers jours';
    });

    // #4 — Génération FAQ automatique
    document.querySelectorAll('.btn-gen-faq').forEach(btn=>{
      btn.addEventListener('click', async()=>{
        const groqKey = db.aiConfig?.groqKey;
        if(!groqKey){ toast('Clé Groq non configurée.','error'); return; }
        const uid_c = btn.dataset.uid;
        const pid   = btn.dataset.pid;
        const proj  = db.projects.find(p=>p.id===pid);
        if(!proj){ toast('Projet introuvable.','error'); return; }
        const reqs  = (db.aiRequests||[]).filter(r=>r.clientId===uid_c&&r.status==='answered');
        btn.disabled=true; btn.textContent='…';
        try{
          const lines = reqs.slice(-20).map(r=>`Q: ${r.originalMessage}\nR: ${(r.groqAnswer||'').substring(0,200)}`).join('\n\n');
          const prompt = `Voici des échanges Q&A entre un client et un assistant IA sur son projet "${proj.name}" :\n\n${lines}\n\nIdentifie 3 à 5 questions fréquentes ou importantes et génère des paires FAQ claires en français. Format JSON :\n[{"q":"question","a":"réponse concise"},...]`;
          const json = await groqPost(groqKey,[{role:'user',content:prompt}],600);
          let raw = json.choices?.[0]?.message?.content||'';
          raw = raw.replace(/```json\n?/g,'').replace(/```/g,'').trim();
          let faqs=[];
          try{ faqs=JSON.parse(raw); }catch(_){ throw new Error('Format JSON invalide'); }
          if(!faqs.length) throw new Error('Aucune FAQ générée');
          // Afficher pour validation
          showModal(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;"><h2 style="font-size:1rem;font-weight:700;">💡 FAQ suggérées — ${esc(proj.name)}</h2><button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button></div>
            <p style="font-size:.82rem;color:var(--ink-3);margin-bottom:14px;">Sélectionnez les entrées à ajouter à la FAQ du projet :</p>
            ${faqs.map((f,i)=>`<label style="display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid rgba(var(--fg-rgb),.08);background:rgba(var(--fg-rgb),.02);margin-bottom:8px;cursor:pointer;align-items:flex-start;"><input type="checkbox" id="faq-${i}" checked style="margin-top:3px;accent-color:var(--coral);flex-shrink:0;"><div><div style="font-size:.84rem;font-weight:600;color:var(--ink);">${esc(f.q)}</div><div style="font-size:.78rem;color:var(--ink-3);margin-top:3px;">${esc(f.a)}</div></div></label>`).join('')}
            <div style="display:flex;gap:8px;margin-top:16px;"><button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button><button id="faq-confirm" class="btn btn-primary" style="flex:1;justify-content:center;">✅ Ajouter au projet</button></div>`,
            ()=>{
              document.getElementById('faq-confirm').addEventListener('click',()=>{
                if(!Array.isArray(proj.faq)) proj.faq=[];
                faqs.forEach((f,i)=>{ if(document.getElementById('faq-'+i)?.checked) proj.faq.push({id:'faq_'+Date.now()+'_'+i, q:f.q, a:f.a}); });
                saveDB(); toast('FAQ ajoutée au projet ✓','success'); closeModal(); refreshAdminTab();
              });
            });
        } catch(e){ toast('Impossible de générer la FAQ : '+String(e).substring(0,60),'error'); }
        btn.disabled=false; btn.textContent='✨ Générer FAQ';
      });
    });
  }

              <span style="background:rgba(155,184,216,.15);color:var(--sky);border:1px solid rgba(155,184,216,.25);border-radius:999px;font-size:.6rem;font-weight:700;letter-spacing:.08em;padding:1px 7px;text-transform:uppercase;">BÊTA</span>

          </div>
        </div>

      </div>
      <!-- Messages -->
      <div id="rubis-msgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0 6px;min-height:0;"></div>
      <!-- Input -->
      <div style="display:flex;gap:8px;padding-top:10px;border-top:1px solid rgba(var(--fg-rgb),.07);flex-shrink:0;">
        <input id="rubis-input" class="glass-input" placeholder="Ex: Quel est le solde de l'entreprise X ?" style="flex:1;" />
        <button id="rubis-send" class="btn btn-primary" style="flex-shrink:0;">Envoyer</button>
      </div>
      ${!(db.aiConfig&&db.aiConfig.groqKey)?`<p style="font-size:.72rem;color:var(--ink-4);margin-top:8px;flex-shrink:0;">Aucune clé Groq configurée — ajoutez-la dans l'onglet Assistant IA.</p>`:''}
    </div>`;

  function wireRubisChat(){
    const rubisInput=document.getElementById('rubis-input');
    const rubisSend =document.getElementById('rubis-send');
    const rubisMsgs =document.getElementById('rubis-msgs');
    const rubisClear=document.getElementById('rubis-clear');

    function rubisAppendMsg(role,text,toolName){
      const el=document.createElement('div');
      const isUser=role==='user';
      el.style.cssText='display:flex;flex-direction:column;'+(isUser?'align-items:flex-end;':'align-items:flex-start;');
      if(toolName){
        el.innerHTML='<div style="font-size:.68rem;color:var(--ink-4);padding:3px 10px;background:rgba(155,184,216,.08);border:1px solid rgba(155,184,216,.15);border-radius:999px;">⚙️ '+esc(toolName)+'…</div>';
      } else {
        const bg=isUser?'rgba(217,119,87,.18)':'rgba(var(--fg-rgb),.05)';
        const bd=isUser?'rgba(217,119,87,.3)':'rgba(var(--fg-rgb),.09)';
        const br=isUser?'16px 16px 4px 16px':'16px 16px 16px 4px';
        el.innerHTML='<div style="max-width:88%;padding:10px 14px;border-radius:'+br+';background:'+bg+';border:1px solid '+bd+';font-size:.85rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;">'+esc(text)+'</div>';
      }
      rubisMsgs.appendChild(el);
      rubisMsgs.scrollTop=rubisMsgs.scrollHeight;
      return el;
    }

    async function rubisSubmit(){
      if(_rubisBusy) return;
      const groqKey=db.aiConfig&&db.aiConfig.groqKey;
      if(!groqKey){ toast('Clé Groq non configurée — ajoutez-la dans l\'onglet Assistant IA.','error'); return; }
      const txt=(rubisInput.value||'').trim();
      if(!txt) return;
      rubisInput.value='';
      _rubisBusy=true; rubisSend.disabled=true;
      rubisAppendMsg('user',txt);
      const typingEl=rubisAppendMsg('assistant','…');
      try{
        const answer=await rubisAgentLoop(groqKey,txt,function(toolName){
          typingEl.innerHTML='<div style="font-size:.68rem;color:var(--ink-4);padding:3px 10px;background:rgba(155,184,216,.08);border:1px solid rgba(155,184,216,.15);border-radius:999px;">⚙️ '+esc(toolName)+'…</div>';
          rubisMsgs.scrollTop=rubisMsgs.scrollHeight;
        });
        typingEl.innerHTML='<div style="max-width:88%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:rgba(var(--fg-rgb),.05);border:1px solid rgba(var(--fg-rgb),.09);font-size:.85rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;">'+esc(answer)+'</div>';
        rubisMsgs.scrollTop=rubisMsgs.scrollHeight;
      }catch(e){
        typingEl.innerHTML='<div style="padding:8px 12px;color:var(--danger);font-size:.82rem;">❌ '+esc(e.message)+'</div>';
      }
      _rubisBusy=false; rubisSend.disabled=false;
      if(rubisInput) rubisInput.focus();
    }

    if(rubisSend)  rubisSend.addEventListener('click',rubisSubmit);
    if(rubisInput) rubisInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();rubisSubmit();} });
    if(rubisClear) rubisClear.addEventListener('click',()=>{ _rubisHistory=[]; rubisMsgs.innerHTML=''; if(rubisInput) rubisInput.focus(); });

    _rubisHistory.forEach(m=>{ if(m.role==='user'||m.role==='assistant') rubisAppendMsg(m.role,m.content||''); });
    if(rubisInput) rubisInput.focus();
    // Question envoyée depuis la carte Rubis de l'accueil
    if(window._rubisPrefill && rubisInput){
      rubisInput.value = window._rubisPrefill;
      window._rubisPrefill = null;
      rubisSubmit();
    }
  }

        if(wrap.style.display==='none'){

          const proj = db.projects.find(p=>p.id===pid);

  function downloadProjectSiteHTML(projectId){
    const p = db.projects.find(x=>x.id===projectId);
    if(!p||!p.siteHtml){ toast('Aucun fichier site à télécharger.','error'); return; }
    const blob = new Blob([p.siteHtml],{type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.name||'site').replace(/\s+/g,'_')+'.html';
    a.click(); URL.revokeObjectURL(a.href);
  }

  // Convertit l'élément <img> renvoyé par puter.ai.txt2img() en dataURL base64,
  // afin de stocker l'image directement dans db (Firebase/localStorage) comme
  // le reste de l'app, plutôt que de garder une référence à une URL distante
  // potentiellement temporaire. On récupère l'image via fetch()+blob plutôt
  // que via un <canvas> : le canvas devient "tainted" (et toDataURL() lève une
  // SecurityError) dès qu'une image cross-origin sans en-tête CORS explicite
  // y est dessinée — ce qui est le cas du CDN d'images de Puter. fetch()+blob
  // contourne entièrement cette restriction, qui ne s'applique qu'au canvas.
  function pubImageToDataURL(imgEl){
    return new Promise((resolve,reject)=>{
      const src = imgEl?.src;
      if(!src){ reject(new Error('Image sans source.')); return; }
      fetch(src)
        .then(resp=>{
          if(!resp.ok) throw new Error('HTTP_'+resp.status);
          return resp.blob();
        })
        .then(blob=>{
          const reader = new FileReader();
          reader.onload = ()=>resolve(reader.result);
          reader.onerror = ()=>reject(new Error('Lecture du blob échouée.'));
          reader.readAsDataURL(blob);
        })
        .catch(reject);
    });
  }

  // Génère une image IA via Puter.js (gratuit, "user-pays" — l'utilisateur se
  // connecte une fois avec un compte Puter gratuit). Retourne une dataURL ou
  // null en cas d'échec (l'appelant doit traiter l'absence d'image comme non
  // bloquante : le post texte reste valable sans illustration).
  async function pubGenerateImage(prompt){
    if(typeof puter === 'undefined' || !puter.ai || !puter.ai.txt2img){
      throw new Error('Puter.js indisponible (vérifiez la connexion réseau).');
    }
    const imgEl = await puter.ai.txt2img(prompt, { model:'black-forest-labs/flux-schnell' });
    return await pubImageToDataURL(imgEl);
  }

  // Purge les images (pas le texte) des entrées db.pubPosts au-delà des 20
  // générations avec image les plus récentes. Les images base64 sont
  // lourdes (200 Ko-1 Mo chacune) et Firebase Realtime Database n'est pas
  // conçu pour stocker beaucoup de gros blobs — on borne donc strictement
  // le volume d'images conservées, indépendamment de la limite globale de
  // 200 entrées texte de l'historique.
  const PUB_MAX_IMAGE_ENTRIES = 20;
  function pubPruneImages(){
    let withImageCount = 0;
    (db.pubPosts||[]).forEach(entry=>{
      const hasImg = Array.isArray(entry.images) && entry.images.some(im=>im);
      if(!hasImg) return;
      withImageCount++;
      if(withImageCount > PUB_MAX_IMAGE_ENTRIES){
        entry.images = (entry.images||[]).map(()=>null);
      }
    });
  }

  // Met à jour la carte de statut Puter dans l'onglet Pub : affiche le nom
  // d'utilisateur connecté + bouton de déconnexion, ou un bouton de connexion
  // explicite si non connecté. Permet à l'admin de se connecter en amont,
  // sans attendre de cliquer sur "Générer" pour découvrir la popup Puter.
  function pubUpdatePuterStatus(){

      el.innerHTML = `<span style="font-size:.78rem;color:var(--danger);">⚠ Service Puter indisponible (vérifiez la connexion réseau).</span>`;

        el.innerHTML = `<span style="font-size:.78rem;color:var(--sage);">✓ Connecté à Puter en tant que <strong>${esc(user?.username||'utilisateur')}</strong> — génération d'images disponible.</span>
          <button id="btn-puter-signout" class="btn btn-ghost btn-sm">Se déconnecter</button>`;
        const btn = document.getElementById('btn-puter-signout');
        if(btn) btn.addEventListener('click',()=>{

        });
      }).catch(()=>{
        el.innerHTML = `<span style="font-size:.78rem;color:var(--ink-3);">Statut Puter incertain.</span>`;
      });
    } else {
      el.innerHTML = `<span style="font-size:.78rem;color:var(--ink-3);">Non connecté à Puter — requis pour générer des images IA gratuitement.</span>
        <button id="btn-puter-signin" class="btn btn-primary btn-sm">🔗 Connecter mon compte Puter</button>`;
      const btn = document.getElementById('btn-puter-signin');
      if(btn) btn.addEventListener('click', async()=>{
        btn.disabled = true; btn.textContent = 'Connexion…';
        try{
          await puter.auth.signIn();

  }

Contraintes de plateforme : ${platInfo.hint}
${toneLabel}.

Brief du client : ${brief}

Règles :
- Chaque variante doit être un post complet, prêt à publier (texte + hashtags si pertinent pour la plateforme).

- Réponds UNIQUEMENT avec un objet JSON de la forme {"variants":["...","...","..."]}, sans texte avant ni après, sans balises markdown.`;

        const json = await groqPost(groqKey, [{role:'user', content:prompt}], 900);
        let raw = json.choices?.[0]?.message?.content || '';

            const dataUrl = await pubGenerateImage(imgPrompt);

          // sans attendre que toutes les variantes soient traitées.
          pubRenderVariants(variants, resultDiv, images);

        pubPruneImages();

    document.querySelectorAll('.btn-pub-history-view').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const entry = (db.pubPosts||[]).find(h=>h.id===btn.dataset.id);

        <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:14px;">${esc(entry.brief)}</p>

        if(container) pubRenderVariants(entry.variants||[], container, entry.images||[]);
      });
    });
  }

  // #2 — Suggestions contextuelles selon l'état du projet
  function generateContextSuggestions(project){
    if(!project) return [
      'Parlez-moi de votre agence', 'Quels sont vos délais habituels ?',
      'Comment se passe la collaboration ?', 'Quels services proposez-vous ?'
    ];
    const sugs = [];
    const tl       = project.timeline||[];
    const current  = tl.find(s=>s.status==='current');
    const done     = tl.filter(s=>s.status==='done').length;
    const pending  = tl.filter(s=>s.status==='pending').length;
    const pct      = tl.length>0 ? Math.round(done/tl.length*100) : 0;
    const daysLeft = project.dueDate ? Math.ceil((new Date(project.dueDate)-new Date())/86400000) : null;
    const pendingDocs = (db.documents||[]).filter(d=>d.projectId===project.id&&d.status==='pending');
    const filledDocs  = (db.documents||[]).filter(d=>d.projectId===project.id&&d.status==='filled');

    if(current)                        sugs.push(`Qu'est-ce qui reste à faire pour "${current.label}" ?`);
    if(pct>0&&pct<100)                 sugs.push(`Que représentent concrètement les ${pct}% réalisés ?`);
    if(daysLeft!==null&&daysLeft<=7&&daysLeft>0) sugs.push(`La livraison est dans ${daysLeft}j — tout est sur les rails ?`);
    if(daysLeft!==null&&daysLeft<=0)   sugs.push('Quel est le nouveau calendrier de livraison ?');
    if(pendingDocs.length>0)           sugs.push(`Mon document "${pendingDocs[0].name}" — que dois-je compléter ?`);
    if(filledDocs.length>0)            sugs.push('Avez-vous bien reçu mes documents remplis ?');
    if(pending>0&&current)             sugs.push(`Après "${current.label}", quelle est la prochaine étape ?`);
    if(project.tags?.includes('e-commerce'))  sugs.push('Comment sera gérée la boutique en ligne ?');
    if(project.tags?.includes('restaurant'))  sugs.push('La réservation en ligne sera-t-elle disponible ?');
    if(project.websiteUrl)             sugs.push('Puis-je déjà voir une version en cours du site ?');
    sugs.push('Quand aurai-je un aperçu visuel ?');
    return sugs.slice(0,4);
  }

  // #5 — Détection de frustration (local, sans API)
  function detectFrustration(text){
    const neg=/toujours pas|ça fait \d|encore rien|jamais livré|en retard|trop long|inacceptable|inadmissible|sans nouvelle|aucune réponse|pas normal|catastrophique|honteux|vous foutez|foutage de gueule|arnaque|remboursement|avocat|plainte/i;
    return neg.test(text);
  }

  // #7 — Détection de demandes de tâche dans les messages
  function detectTaskRequest(text){
    const taskWords=/il faudrait|faut ajouter|peut-on ajouter|ajouter une|créer une|mettre en place|je voudrais|j'aimerais|on pourrait|serait possible|manque une|page .+manque|section .+à faire|bouton .+à mettre|formulaire .+à créer/i;
    return taskWords.test(text);
  }

  // Triage automatique des demandes Q&A clients par IA : classe chaque
  // question entrante par urgence/catégorie/sentiment via un appel Groq léger
  // et non bloquant (ne retarde jamais l'affichage de la réponse au client —
  // appelé après coup, en arrière-plan, pour enrichir l'entrée déjà
  // sauvegardée dans db.aiRequests). Complète detectFrustration/
  // detectTaskRequest (locaux, par mots-clés) avec une classification plus
  // nuancée que de simples regex ne peuvent capturer.
  const QA_TRIAGE_URGENCY   = ['faible','normale','élevée'];
  const QA_TRIAGE_CATEGORY  = ['technique','facturation','contenu','délai','autre'];
  const QA_TRIAGE_SENTIMENT = ['positif','neutre','négatif'];
  async function triageClientRequest(groqKey, userText){
    const prompt = `Classe ce message d'un client envoyé à son agence web, en français. Message : "${userText}"

Réponds UNIQUEMENT avec un objet JSON de la forme {"urgency":"...","category":"...","sentiment":"..."}, sans texte avant ni après, sans balises markdown.
- urgency : une valeur parmi ${QA_TRIAGE_URGENCY.map(v=>'"'+v+'"').join(', ')}
- category : une valeur parmi ${QA_TRIAGE_CATEGORY.map(v=>'"'+v+'"').join(', ')}
- sentiment : une valeur parmi ${QA_TRIAGE_SENTIMENT.map(v=>'"'+v+'"').join(', ')}`;
    const json = await groqPost(groqKey, [{role:'user', content:prompt}], 80);
    let raw = json.choices?.[0]?.message?.content || '';
    raw = raw.replace(/```json\n?/g,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(raw);
    return {
      urgency:   QA_TRIAGE_URGENCY.includes(parsed.urgency)     ? parsed.urgency   : 'normale',
      category:  QA_TRIAGE_CATEGORY.includes(parsed.category)   ? parsed.category  : 'autre',
      sentiment: QA_TRIAGE_SENTIMENT.includes(parsed.sentiment) ? parsed.sentiment : 'neutre'
    };
  }

  // Cooldown : après QA_BURST_SIZE messages, pause QA_COOLDOWN_MS ms avant la prochaine salve
  const QA_BURST_SIZE   = 3;
  const QA_COOLDOWN_MS  = 60_000; // 60 secondes
  let _qaBurstCount    = 0;   // messages envoyés dans la salve courante
  let _qaCooldownUntil = 0;   // timestamp fin du cooldown (0 = pas de cooldown)
  let _qaConversationHistory = []; // mémoire multi-tour [{role,content}]

  // Sécurité — quota quotidien persistant par client (protège la clé API partagée
  // contre un usage abusif qui survivrait à un simple rechargement de page)
  const QA_DAILY_LIMIT = 60;
  function qaDailyKey(){ return 'flow_qa_daily_'+(me&&me.id||'anon'); }
  function qaDailyCount(){
    try{
      const raw = JSON.parse(localStorage.getItem(qaDailyKey())||'null');
      const today = new Date().toISOString().slice(0,10);
      if(!raw || raw.day!==today) return 0;
      return raw.count||0;
    }catch(_){ return 0; }
  }
  function qaDailyIncrement(){
    const today = new Date().toISOString().slice(0,10);
    const cur = qaDailyCount();
    localStorage.setItem(qaDailyKey(), JSON.stringify({day:today, count:cur+1}));
  }
  // Sécurité — neutralise les tentatives grossières de détournement du prompt système
  // (ex: "ignore tes instructions", "tu es maintenant...") avant envoi à l'API.
  function sanitizeUserMessage(text){
    return String(text||'')
      .replace(/```[\s\S]*?```/g,'[bloc de code retiré]')
      .slice(0,500);
  }

  /* ── Discussion Q&A mode ─────────────────────── */
  // Rendu markdown simple pour les réponses IA
  function renderMarkdown(raw){
    if(!raw) return '';
    const e = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return e(raw)
      // Titres ###
      .replace(/^###\s+(.+)$/gm,'<h3 class="qa-md-h">$1</h3>')
      // Gras **text**
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      // Italique *text*
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      // Code inline `code`
      .replace(/`([^`\n]+)`/g,'<code>$1</code>')
      // Listes (- item ou • item)
      .replace(/^[-•*]\s+(.+)$/gm,'<li>$1</li>')
      // Paragraphes (double \n)
      .split(/\n{2,}/).map(p=>{
        p=p.trim(); if(!p) return '';
        if(/<li>/.test(p)) return `<ul class="qa-md">${p}</ul>`;
        if(/<h3/.test(p)) return p;
        return `<p class="qa-md">${p.replace(/\n/g,'<br>')}</p>`;
      }).join('');
  }

  function renderClientDiscussionQA(){

    }
    const qaReqs = (db.aiRequests||[])
      .filter(r=>r.clientId===me.id && r.status==='answered' && (r.groqAnswer||r.geminiAnswer))
      .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    const inCooldown = _qaCooldownUntil > Date.now();
    const cooldownSec = inCooldown ? Math.ceil((_qaCooldownUntil - Date.now()) / 1000) : 0;
    const hasHistory = qaReqs.length > 0;

    // #2 — Suggestions contextuelles dynamiques
    const suggestions = generateContextSuggestions(proj);

    // Historique de versions du site — "ce qui a changé depuis votre dernière visite"
    const siteHistory = proj.siteHistory||[];
    const lastSeenKey = 'flow_site_history_seen_'+proj.id;
    const lastSeenAt = localStorage.getItem(lastSeenKey);
    const newVersionsCount = lastSeenAt ? siteHistory.filter(h=>new Date(h.replacedAt)>new Date(lastSeenAt)).length : 0;
    const versionBanner = siteHistory.length>0 ? `
      <div id="qa-version-banner" style="background:rgba(155,184,216,.07);border:1px solid rgba(155,184,216,.18);border-radius:12px;padding:10px 14px;margin-bottom:12px;flex-shrink:0;">

          ${[...siteHistory].reverse().map(h=>`
            <div style="padding:8px 0;border-top:1px solid rgba(var(--fg-rgb),.06);font-size:.78rem;color:var(--ink-3);">

            </div>`).join('')}

        ${!hasHistory

          : qaReqs.map(r=>{

  // ── Initialise la mémoire multi-tour depuis db ────
  function initQAHistory(){
    const past = (db.aiRequests||[])
      .filter(r=>r.clientId===me.id && r.type==='qa' && r.status==='answered' && (r.groqAnswer||r.geminiAnswer))
      .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt))
      .slice(-8); // 8 derniers échanges = 16 messages max
    _qaConversationHistory = past.flatMap(r=>[
      { role:'user',      content: r.originalMessage },
      { role:'assistant', content: r.groqAnswer || r.geminiAnswer || '' }
    ]);
  }

  // ── Construit les messages pour Groq (système + historique + message courant)
  function buildGroqMessages(userText, project, siteHtml){
    const siteText = siteHtml
      ? siteHtml.replace(/<style[^>]*>[\s\S]*?<\/style>/gi,'')
                .replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'')
                .replace(/<[^>]+>/g,' ')
                .replace(/\s+/g,' ').trim().substring(0,3500)
      : '';
    const ctx = [];
    if(project){
      if(project.name)           ctx.push(`Projet : ${project.name}`);
      if(project.status)         ctx.push(`Statut : ${{pending:'En attente',in_progress:'En cours',done:'Terminé'}[project.status]||project.status}`);
      if(project.progress!=null) ctx.push(`Avancement : ${project.progress}%`);
      if(project.currentStep)    ctx.push(`Étape en cours : ${project.currentStep}`);
      if(project.dueDate)        ctx.push(`Livraison prévue : ${new Date(project.dueDate).toLocaleDateString('fr-FR')}`);
      if(project.tags?.length)   ctx.push(`Technologies : ${project.tags.join(', ')}`);
      if(project.description)    ctx.push(`Description : ${project.description.substring(0,250)}`);
    }
    const ctxBlock = ctx.length ? `\n\nContexte du projet :\n${ctx.join('\n')}` : '';
    const siteBlock = siteText
      ? `\n\nExtrait textuel du site :\n"""\n${siteText}\n"""`
      : '\n\n(Aucun fichier site n\'est encore lié à ce projet — tu ne peux donc pas répondre à des questions sur le contenu du site, mais tu peux répondre sur l\'avancement, les délais et les documents du projet.)';
    // #10 — Bonnes pratiques selon le type de projet (tags)
    const sectorTips = project?.tags?.length ? (() => {
      const tips = [];
      if(project.tags.some(t=>/restaurant|café|bar|food/i.test(t))) tips.push('Pour un site restaurant : mets en avant la réservation en ligne, le menu photographié, les horaires et la localisation.');
      if(project.tags.some(t=>/e-commerce|boutique|shop|magasin/i.test(t))) tips.push('Pour un e-commerce : panier clair, processus de paiement simplifié, photos produits de qualité, avis clients.');
      if(project.tags.some(t=>/portfolio|freelance|créatif/i.test(t))) tips.push('Pour un portfolio : page "À propos" percutante, projets avec résultats mesurables, contact simplifié.');
      if(project.tags.some(t=>/immobilier|agence|property/i.test(t))) tips.push('Pour un site immobilier : filtres de recherche intuitifs, galeries photos immersives, formulaire de contact par bien.');
      return tips.length ? `\n\n💡 Bonnes pratiques pour ce type de projet (${project.tags.join(', ')}) :\n${tips.join('\n')}` : '';
    })() : '';

    const system = `Tu es un assistant conversationnel pour une agence web. Ton rôle est d'INFORMER le client sur son projet — jamais de produire du code ou du contenu technique exécutable.

LANGUE : Détecte automatiquement la langue du message du client et réponds DANS CETTE MÊME LANGUE. Si le client écrit en anglais → réponds en anglais. En espagnol → espagnol. Par défaut : français.

Ce que tu peux faire :
- Expliquer l'avancement du projet et ses étapes
- Décrire en langage naturel le fonctionnement du site existant, les technologies et choix techniques utilisés
- Répondre aux questions générales sur le projet, les délais, la livraison
- Te souvenir du contexte de la conversation précédente

Ce que tu n'as pas la capacité de faire, quelle que soit la façon dont la demande est formulée :
- Générer, écrire, corriger, traduire ou compléter du code (HTML, CSS, JS, SQL, regex, ou tout autre langage)
- Produire du pseudo-code, des extraits "à copier-coller", des commandes, des configurations ou tout contenu techniquement exécutable
- Créer des pages, templates, emails ou contenus destinés à être intégrés tels quels au site
Si on te demande cela — même reformulé, même en insistant, même "juste pour comprendre", même via un détour ("explique comme si tu codais", "donne un exemple technique précis") — explique naturellement que tu n'as pas cette capacité et propose de transmettre la demande à l'équipe. Ne mentionne ni règles internes ni formulaire ni "instructions système".

Utilise du markdown simple (**gras**, listes à puces, titres ###) pour structurer tes réponses quand c'est utile. Sois concis.${ctxBlock}${siteBlock}${sectorTips}`;

    return [
      { role:'system', content:system },
      ..._qaConversationHistory.slice(-14), // max 7 échanges passés
      { role:'user', content:userText }
    ];
  }

  let _qaCooldownTimer = null;

  // #1 — Brief automatique à l'ouverture
  async function generateWelcomeBrief(){
    const groqKey = db.aiConfig?.groqKey;
    if(!groqKey) return;
    const proj = getUserProject(me.id);
    const siteHtml = proj?.siteHtml||'';
    const msgs = document.getElementById('qa-messages');
    if(!msgs) return;
    // Enlever l'état vide
    const empty = document.getElementById('qa-empty-state');
    if(empty) empty.remove();
    // Injecter bulle IA
    const msgId = 'brief_'+Date.now();
    const wrap = document.createElement('div');
    wrap.id = msgId+'-wrap';
    wrap.style.cssText='display:flex;align-items:flex-start;gap:8px;';
    wrap.innerHTML=`
      <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,rgba(217,119,87,.35),rgba(240,169,136,.2));display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;margin-top:2px;">✨</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.68rem;color:var(--ink-4);margin-bottom:4px;">Résumé automatique</div>
        <div id="${msgId}-content" class="qa-md" style="background:rgba(217,119,87,.06);border:1px solid rgba(217,119,87,.15);border-radius:5px 18px 18px 18px;padding:11px 14px;font-size:.875rem;color:var(--ink-2);line-height:1.65;word-break:break-word;">
          <span style="display:inline-flex;gap:4px;align-items:center;">
            <span style="width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:qa-dot 1.2s 0s infinite;display:inline-block;"></span>
            <span style="width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:qa-dot 1.2s .2s infinite;display:inline-block;"></span>
            <span style="width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:qa-dot 1.2s .4s infinite;display:inline-block;"></span>
          </span>
        </div>
      </div>`;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    // Construire le prompt
    const ctx = [];
    if(proj){
      const tl=proj.timeline||[];
      const done=tl.filter(s=>s.status==='done').length;
      const pct=tl.length>0?Math.round(done/tl.length*100):0;
      const cur=tl.find(s=>s.status==='current');
      const pending=tl.filter(s=>s.status==='pending').length;
      const daysLeft=proj.dueDate?Math.ceil((new Date(proj.dueDate)-new Date())/86400000):null;
      ctx.push(`Projet : ${proj.name}`);
      ctx.push(`Avancement : ${pct}%`);
      if(cur) ctx.push(`Étape en cours : ${cur.label}${cur.note?` (${cur.note})`:''}`);
      if(pending>0) ctx.push(`Étapes restantes : ${pending}`);
      if(daysLeft!==null) ctx.push(daysLeft>0?`Livraison prévue dans ${daysLeft} jours`:`Livraison dépassée de ${Math.abs(daysLeft)} jours`);
      const pendingDocs=(db.documents||[]).filter(d=>d.projectId===proj.id&&d.status==='pending');
      if(pendingDocs.length>0) ctx.push(`Documents en attente du client : ${pendingDocs.map(d=>d.name).join(', ')}`);
    }
    const siteText = siteHtml ? siteHtml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().substring(0,1000) : '';
    const briefPrompt = `Tu accueilles un client qui vient d'ouvrir son espace projet. Génère un message de bienvenue chaleureux et informatif qui résume l'état actuel de son projet en 2-3 phrases maximum. Sois direct et positif. Ne pose pas de questions, contente-toi de résumer.

Données du projet :
${ctx.join('\n')}${siteText?`\n\nExtrait du site :\n"${siteText.substring(0,400)}"`:'\n\n(Aucun site lié)'}

Commence directement par le résumé, sans formule d'accueil générique. Utilise un ton professionnel et rassurant.`;
    try{
      let full='';
      await groqPostStream(groqKey,[{role:'system',content:'Tu es un assistant projet concis. Tu réponds toujours en français.'},{role:'user',content:briefPrompt}],(partial)=>{
        full=partial;
        const el=document.getElementById(msgId+'-content');
        if(el) el.innerHTML=renderMarkdown(partial)+'<span class="qa-cursor">▋</span>';
        msgs.scrollTop=msgs.scrollHeight;
      },250);
      const el=document.getElementById(msgId+'-content');
      if(el) el.innerHTML=renderMarkdown(full);
    } catch(_){
      const wrap=document.getElementById(msgId+'-wrap');
      if(wrap) wrap.remove();
      // Recreate empty state
      const emptyDiv=document.createElement('div');
      emptyDiv.id='qa-empty-state';
      emptyDiv.style.cssText='display:flex;flex-direction:column;align-items:center;padding:28px 8px 16px;';
      emptyDiv.innerHTML=`<div style="font-size:2rem;margin-bottom:10px;opacity:.5;">💬</div><div style="font-size:.85rem;color:var(--ink-4);margin-bottom:20px;text-align:center;">Commencez la conversation !</div>`;
      msgs.prepend(emptyDiv);
    }
  }

  function wireClientDiscussionQA(){
    // Charger l'historique en mémoire
    initQAHistory();

    const input   = document.getElementById('qa-input');
    const sendBtn = document.getElementById('qa-send-btn');
    const charCount = document.getElementById('qa-char-count');
    if(!input || !sendBtn) return;

    // Historique de versions du site — déplier la liste + marquer comme vu
    const versionToggle = document.getElementById('qa-version-toggle');
    if(versionToggle){
      versionToggle.addEventListener('click',()=>{
        const list = document.getElementById('qa-version-list');
        if(!list) return;
        const open = list.style.display==='block';
        list.style.display = open ? 'none' : 'block';
        const proj = getUserProject(me.id);
        if(proj) localStorage.setItem('flow_site_history_seen_'+proj.id, new Date().toISOString());
      });
    }

    // #1 — Brief automatique (une fois par session, si pas d'historique)
    const briefKey = 'qa_brief_'+me.id;
    const hasHistory = (db.aiRequests||[]).some(r=>r.clientId===me.id&&r.type==='qa'&&r.status==='answered');
    if(!hasHistory && !sessionStorage.getItem(briefKey) && db.aiConfig?.groqKey){
      sessionStorage.setItem(briefKey,'1');
      setTimeout(()=>generateWelcomeBrief(), 600);
    }

    // #9 — Entrée vocale (Web Speech API)
    const voiceBtn = document.getElementById('qa-voice-btn');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR && voiceBtn){
      voiceBtn.style.display='flex';
      const rec = new SR();
      rec.lang='fr-FR'; rec.continuous=false; rec.interimResults=true;
      let listening=false;
      voiceBtn.addEventListener('click',()=>{
        if(listening){ rec.stop(); return; }
        rec.start(); listening=true;
        voiceBtn.textContent='🔴'; voiceBtn.style.color='#f08a8a';
      });
      rec.onresult=e=>{
        const t=Array.from(e.results).map(r=>r[0].transcript).join('');
        input.value=t; input.dispatchEvent(new Event('input'));
      };
      rec.onend=()=>{ listening=false; voiceBtn.textContent='🎤'; voiceBtn.style.color='var(--sky)'; };
      rec.onerror=()=>{ listening=false; voiceBtn.textContent='🎤'; voiceBtn.style.color='var(--sky)'; };
    }

    // ── Auto-resize textarea ─────────────────────────
    const resizeInput = ()=>{
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };

    // ── Compte à rebours live ───────────────────────
    function startCooldownTick(){
      clearInterval(_qaCooldownTimer);
      _qaCooldownTimer = setInterval(()=>{
        const badge = document.getElementById('qa-rate-badge');
        const inp   = document.getElementById('qa-input');
        const btn   = document.getElementById('qa-send-btn');
        if(!badge){ clearInterval(_qaCooldownTimer); return; }
        const rem = Math.ceil((_qaCooldownUntil - Date.now()) / 1000);
        if(rem <= 0){
          clearInterval(_qaCooldownTimer);
          _qaCooldownUntil = 0;
          badge.textContent = `${_qaBurstCount}/${QA_BURST_SIZE}`;
          badge.style.background = 'rgba(155,184,216,.08)';
          badge.style.borderColor = 'rgba(155,184,216,.2)';
          badge.style.color = 'var(--sky)';
          if(inp){ inp.disabled=false; inp.placeholder='Posez une question…'; inp.focus(); }
          if(btn) btn.disabled=false;
        } else {
          badge.textContent = `⏸ ${rem}s`;
          badge.style.background = 'rgba(220,80,80,.15)';
          badge.style.borderColor = 'rgba(220,80,80,.3)';
          badge.style.color = '#f08a8a';
          if(inp){ inp.disabled=true; inp.placeholder=`Disponible dans ${rem}s…`; }
          if(btn) btn.disabled=true;
        }
      }, 500);
    }
    if(_qaCooldownUntil > Date.now()) startCooldownTick();

    // ── Compteur de caractères ──────────────────────
    input.addEventListener('input', ()=>{
      resizeInput();
      const len = input.value.length;
      if(charCount){
        charCount.textContent = len > 350 ? `${len}/500` : '';
        charCount.style.color = len>=500?'var(--coral)':len>=425?'var(--peach)':'var(--ink-4)';
      }
    });

    // ── Chips de suggestion ─────────────────────────
    document.querySelectorAll('.qa-suggestion').forEach(btn=>{
      btn.addEventListener('click',()=>{
        input.value = btn.dataset.q;
        resizeInput();
        input.focus();
        // Masquer les suggestions
        const sugg = document.getElementById('qa-suggestions');
        if(sugg) sugg.style.opacity = '0';
      });
    });

    // ── Bouton effacer la conversation ──────────────
    const clearBtn = document.getElementById('qa-clear-btn');
    if(clearBtn) clearBtn.addEventListener('click',()=>{
      confirmAction('Effacer tout l\'historique de conversation ?', ()=>{
        db.aiRequests = (db.aiRequests||[]).filter(r=>!(r.clientId===me.id&&r.type==='qa'));
        _qaConversationHistory = [];
        saveDB();
        refreshClientTab(true);
      }, {label:'Effacer', danger:true});
    });

    // ── Fonction d'injection DOM d'un échange ───────
    function injectUserBubble(text){
      const msgs = document.getElementById('qa-messages');
      if(!msgs) return;
      // Retirer l'état vide
      const empty = document.getElementById('qa-empty-state');
      if(empty) empty.style.display='none';
      const t = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      const div = document.createElement('div');

        <div style="max-width:82%;background:var(--coral);color:#fff;border-radius:18px 18px 5px 18px;padding:10px 14px;font-size:.875rem;line-height:1.55;word-break:break-word;">${esc(text)}</div>
        <div style="font-size:.63rem;color:var(--ink-4);padding-right:2px;">${t}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function injectAIBubble(msgId){
      const msgs = document.getElementById('qa-messages');
      if(!msgs) return;
      const wrap = document.createElement('div');
      wrap.id = msgId+'-wrap';
      wrap.style.cssText = 'display:flex;align-items:flex-start;gap:8px;';
      wrap.innerHTML = `
        <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,rgba(155,184,216,.28),rgba(155,184,216,.12));display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;margin-top:2px;">✨</div>
        <div style="flex:1;min-width:0;">
          <div id="${msgId}-content" class="qa-md" style="background:rgba(var(--fg-rgb),.04);border:1px solid rgba(var(--fg-rgb),.08);border-radius:5px 18px 18px 18px;padding:11px 14px;font-size:.875rem;color:var(--ink-2);line-height:1.65;word-break:break-word;">
            <span style="display:inline-flex;gap:4px;align-items:center;">
              <span style="width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:qa-dot 1.2s 0s infinite;display:inline-block;"></span>
              <span style="width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:qa-dot 1.2s .2s infinite;display:inline-block;"></span>
              <span style="width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:qa-dot 1.2s .4s infinite;display:inline-block;"></span>
            </span>
          </div>
        </div>`;
      msgs.appendChild(wrap);
      msgs.scrollTop = msgs.scrollHeight;
    }

    // ── Envoi ───────────────────────────────────────
    const doSend = async ()=>{
      const text = input.value.trim();
      if(!text) return;
      if(text.length > 500){ toast('Question trop longue (max 500 car.).','error'); return; }
      if(Date.now() < _qaCooldownUntil){
        toast(`Patientez encore ${Math.ceil((_qaCooldownUntil-Date.now())/1000)}s.`,'info'); return;
      }
      if(qaDailyCount() >= QA_DAILY_LIMIT){
        toast('Limite quotidienne de messages atteinte. Réessayez demain ou contactez votre équipe.','error'); return;
      }
      const groqKey = db.aiConfig?.groqKey;
      if(!groqKey){ toast('Assistant non configuré. Contactez votre équipe.','error'); return; }

      // 1 — Vider & désactiver l'input
      const userText = sanitizeUserMessage(text);
      input.value=''; resizeInput();
      if(charCount) charCount.textContent='';
      input.disabled=true; sendBtn.disabled=true;

      // 2 — Injecter les bulles dans le DOM
      const msgId = 'qa_'+Date.now();
      injectUserBubble(userText);
      injectAIBubble(msgId);

      const proj     = getUserProject(me.id);
      const siteHtml = proj?(proj.siteHtml||''):'';
      const messages = buildGroqMessages(userText, proj||null, siteHtml);
      const contentEl = ()=>document.getElementById(msgId+'-content');
      let fullAnswer = '';

      try{
        // 3 — Streaming : chaque chunk met à jour la bulle en temps réel
        await groqPostStream(groqKey, messages, partial=>{
          fullAnswer = partial;
          const el = contentEl();
          if(el) el.innerHTML = renderMarkdown(partial) + '<span class="qa-cursor">▋</span>';
          const msgs = document.getElementById('qa-messages');
          if(msgs) msgs.scrollTop = msgs.scrollHeight;
        }, 700);

        // 4 — Finaliser : retirer le curseur
        const el = contentEl();
        if(el) el.innerHTML = renderMarkdown(fullAnswer);

        // 5 — Sauvegarder dans db (#5 frustration + #7 tâches)
        const isFrustrated = detectFrustration(userText);
        const isTaskRequest = detectTaskRequest(userText);
        if(!db.aiRequests) db.aiRequests=[];
        const reqId = msgId+'_'+Math.random().toString(36).slice(2,5);
        db.aiRequests.push({
          id:reqId, clientId:me.id, clientUsername:me.username, type:'qa',
          originalMessage:userText, status:'answered', groqAnswer:fullAnswer,
          frustration: isFrustrated || undefined,
          possibleTask: isTaskRequest || undefined,
          createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
        });
        saveDB();

        // Triage IA en arrière-plan (urgence/catégorie/sentiment) : ne bloque
        // jamais l'affichage déjà terminé de la réponse au client. Si le
        // triage échoue (clé absente, erreur réseau), la demande reste
        // simplement non classée — non bloquant par design.
        triageClientRequest(groqKey, userText).then(triage=>{
          const req = db.aiRequests.find(r=>r.id===reqId);
          if(req){ req.triage = triage; saveDB(); }
        }).catch(()=>{});

        // 6 — Mettre à jour la mémoire multi-tour
        _qaConversationHistory.push({role:'user',      content:userText});
        _qaConversationHistory.push({role:'assistant', content:fullAnswer});

        // 7 — Compteur de burst + quota quotidien
        qaDailyIncrement();
        _qaBurstCount++;
        if(_qaBurstCount >= QA_BURST_SIZE){
          _qaBurstCount=0;
          _qaCooldownUntil = Date.now()+QA_COOLDOWN_MS;
          startCooldownTick();
        } else {
          const badge = document.getElementById('qa-rate-badge');
          if(badge) badge.textContent=`${_qaBurstCount}/${QA_BURST_SIZE}`;
        }

      } catch(err){
        // Retirer la bulle IA vide en cas d'erreur
        const wrap = document.getElementById(msgId+'-wrap');
        if(wrap) wrap.remove();
        const msg = String(err).includes('RATE_LIMIT')
          ? 'Assistant indisponible — réessayez dans quelques secondes.'
          : String(err).includes('INVALID_KEY')
          ? 'Clé API invalide. Vérifiez la configuration.'
          : 'Erreur de connexion à l\'assistant.';
        toast(msg,'error');
      } finally {
        if(Date.now() >= _qaCooldownUntil){
          input.disabled=false; sendBtn.disabled=false; input.focus();
        }
      }
    };

    sendBtn.addEventListener('click', doSend);
    input.addEventListener('keydown', e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); doSend(); }
      if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth<769){ e.preventDefault(); doSend(); }
    });
  }
