  function localModerate(text){
    const banned = /haine|violence|meurtre|terroris|pornograph|racist|sexist|illégal|drogue|arnaque/i;
    if(banned.test(text)) return { passed:false, reason:'Contenu non conforme détecté localement.' };
    if(text.length<3) return { passed:false, reason:'Message trop court.' };
    return { passed:true, reason:'' };
  }

  async function submitDiscussionMessage(text, photoBase64, opts={}){
    const reqId = 'air_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const _proj = getUserProject(me.id)||getUserProjects(me.id)[0]||null;
    let projectContext = null;
    if(_proj){
      const tl=_proj.timeline||[];
      const doneCnt=tl.filter(s=>s.status==='done').length;
      projectContext={
        name:_proj.name, description:_proj.description||'',
        status:_proj.status, websiteUrl:_proj.websiteUrl||'',
        progress:tl.length>0?Math.round(doneCnt/tl.length*100):0,
        currentStep:tl.find(s=>s.status==='current')?.label||'',
        dueDate:_proj.dueDate||'', tags:(_proj.tags||[]).join(', '),
        priority:_proj.priority||''
      };
    }
    const req = {
      id: reqId, clientId: me.id, clientUsername: me.username,
      originalMessage: text, originalPhoto: photoBase64||null,
      projectContext, requestType: _discType||'site',
      isRevision: opts.isRevision||false, revisedFromId: opts.revisedFromId||null,
      moderationPassed: null, moderationReason: '',
      reformulatedPrompt: '', adminAction: null, adminModifiedPrompt: '',
      claudeResponse: '', comments: [], status: 'pending_moderation',
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    db.aiRequests.push(req);
    saveDB();
    refreshClientTab();
    toast('Votre demande est enregistrée.','success');
    const groqKey = db.aiConfig&&(db.aiConfig.groqKey||'');
    if(!groqKey){
      // Modération locale sans clé IA
      const localMod = localModerate(text);
      const r=db.aiRequests.find(x=>x.id===reqId);
      if(!r) return;
      if(!localMod.passed){
        r.status='moderation_failed'; r.moderationPassed=false; r.moderationReason=localMod.reason; r.updatedAt=new Date().toISOString();
        saveDB(); refreshClientTab(); return;
      }
      r.moderationPassed=true; r.reformulatedPrompt=text; r.status='pending_admin'; r.updatedAt=new Date().toISOString();
      saveDB(); refreshClientTab();
      toast('Demande transmise à l\'équipe (mode sans Groq).','info'); return;
    }
    try{
      // Appel unique : modération + classification d'intention combinées
      const lastCompleted = [...(db.aiRequests||[])].reverse().find(x=>x.clientId===me.id&&x.status==='completed'&&x.claudeResponse);
      const siteHtml = (!opts.isRevision && lastCompleted) ? lastCompleted.claudeResponse : null;
      const combined = await callGeminiModerateAndClassify(text, photoBase64, siteHtml, groqKey);
      const r=db.aiRequests.find(x=>x.id===reqId);
      if(!r) return;
      if(!combined.moderation.passed){
        r.status='moderation_failed'; r.moderationPassed=false; r.moderationReason=combined.moderation.reason; r.updatedAt=new Date().toISOString();
        saveDB(); refreshClientTab(); return;
      }
      r.moderationPassed=true;
      // Brancher selon l'intention détectée
      if(siteHtml && combined.intent==='question'){
        toast('Réponse IA en cours…','info');
        const answer = await callGeminiAnswer(text, siteHtml, r.projectContext, groqKey);
        r.status='answered'; r.geminiAnswer=answer; r.updatedAt=new Date().toISOString();
        saveDB(); refreshClientTab();
        toast('Réponse IA reçue !','success');
        return;
      }
      const reformulated = await callGeminiReformulate(text, groqKey, r.projectContext||null, r.requestType||'site');
      r.reformulatedPrompt=reformulated; r.status='pending_admin'; r.updatedAt=new Date().toISOString();
      saveDB(); refreshClientTab();
      logActivity('ai_request','Demande IA soumise par '+me.username);
    } catch(err){
      const r=db.aiRequests.find(x=>x.id===reqId);
      const isRateLimit = String(err).includes('RATE_LIMIT')||String(err).includes('429')||String(err).includes('rate limit');
      if(r){
        if(isRateLimit){
          // Rate limit persistant : fallback modération locale → pending_admin
          const localMod = localModerate(text);
          if(!localMod.passed){
            r.status='moderation_failed'; r.moderationPassed=false; r.moderationReason=localMod.reason; r.updatedAt=new Date().toISOString();
            saveDB(); refreshClientTab(); return;
          }
          r.moderationPassed=true; r.reformulatedPrompt=text; r.status='pending_admin'; r.updatedAt=new Date().toISOString();
          saveDB(); refreshClientTab();
          toast('Gemini temporairement indisponible — demande transmise sans reformulation.','info');
        } else {
          r.status='error'; r.moderationReason=String(err); r.updatedAt=new Date().toISOString();
          saveDB(); refreshClientTab();
          toast('Erreur IA : '+String(err).substring(0,80),'error');
        }
      }
    }
  }

  // ─── Groq fetch : throttle par clé (free tier 30 RPM = 1 req/2s/clé) ──
  // Pool de 1 à 3 clés Groq partagées (db.aiConfig.groqKeys). Chaque clé a
  // son propre quota Groq, donc son propre throttle indépendant : on choisit
  // à chaque appel la clé la moins récemment utilisée et disponible
  // immédiatement (ou la plus proche de l'être). En cas d'erreur quota/clé
  // invalide sur la clé choisie, on bascule automatiquement sur la clé
  // suivante du pool et on retente, jusqu'à épuisement du pool — l'appelant
  // ne voit qu'un seul échec final si vraiment aucune clé ne fonctionne.
  const _groqDelay = ms => new Promise(r=>setTimeout(r,ms));
  const GROQ_MIN_GAP = 2100; // ms entre appels, par clé (free tier 30 RPM)
  let _groqKeyLastCall = {}; // { [clé]: timestamp du dernier appel }
  let _groqKeyCooldownUntil = {}; // { [clé]: timestamp jusqu'où la clé est en cooldown 429 }
  let _groqRotationIdx = 0;

  function getGroqKeyPool(){
    const keys = (db.aiConfig && Array.isArray(db.aiConfig.groqKeys)) ? db.aiConfig.groqKeys : [];
    return keys.filter(k=>typeof k==='string' && k.trim());
  }

  // Choisit l'ordre dans lequel essayer les clés du pool pour cet appel :
  // on part de la clé suivante en rotation (round-robin), puis on part des
  // clés les moins récemment utilisées en cas de besoin de fallback.
  function _orderedGroqKeys(){
    const pool = getGroqKeyPool();
    if(pool.length===0) return [];
    _groqRotationIdx = (_groqRotationIdx+1) % pool.length;
    const rest = pool.filter((_,i)=>i!==_groqRotationIdx);
    return [pool[_groqRotationIdx], ...rest];
  }

  async function _waitGroqSlot(key){
    const now = Date.now();
    const cooldown = _groqKeyCooldownUntil[key]||0;
    const lastCall = _groqKeyLastCall[key]||0;
    const readyAt = Math.max(cooldown, lastCall+GROQ_MIN_GAP);
    if(readyAt > now) await _groqDelay(readyAt-now);
    _groqKeyLastCall[key] = Date.now();
  }

  function _isGroqFailoverError(e){
    return e && /^(RATE_LIMIT_429|RATE_LIMIT_503|INVALID_KEY|GROQ_AUTH_401)$/.test(e.message);
  }

  // Exécute `attempt(key)` sur chaque clé du pool jusqu'à succès. `fallbackKey`
  // est utilisé si le pool est vide (compat. ascendante avec l'ancien champ
  // db.aiConfig.groqKey unique, ou une clé passée explicitement par l'appelant).
  async function _withGroqFailover(fallbackKey, attempt){
    const keys = _orderedGroqKeys();
    const tryList = keys.length ? keys : (fallbackKey ? [fallbackKey] : []);
    if(tryList.length===0) throw new Error('NO_GROQ_KEY');
    let lastErr;
    for(const key of tryList){
      await _waitGroqSlot(key);
      try{
        return await attempt(key);
      }catch(e){
        lastErr = e;
        if(_isGroqFailoverError(e)){
          if(e.message==='RATE_LIMIT_429' || e.message==='RATE_LIMIT_503'){
            _groqKeyCooldownUntil[key] = Date.now()+10000; // évite de retaper la même clé tout de suite
          }
          continue; // essaie la clé suivante du pool
        }
        throw e; // erreur non liée au quota/clé : on ne retente pas
      }
    }
    throw lastErr;
  }

  async function groqPost(apiKey, messages, maxTokens=500){
    return _withGroqFailover(apiKey, key => _groqPostOnce(key, messages, maxTokens));
  }

  async function _groqPostOnce(apiKey, messages, maxTokens=500){
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages,
        max_tokens: maxTokens,
        temperature: 0.65
      })
    });
    if(resp.status===429) throw new Error('RATE_LIMIT_429');
    if(resp.status===401) throw new Error('INVALID_KEY');
    if(resp.status===503) throw new Error('RATE_LIMIT_503');
    if(!resp.ok) throw new Error('HTTP_'+resp.status);
    return await resp.json();
  }

  // Legacy stub — geminiPost() replaced by groqPost().
  async function geminiPost(){ throw new Error('geminiPost is deprecated — use groqPost()'); }

  // ── Groq streaming : reçoit les chunks via callback onChunk(partialText) ──
  async function groqPostStream(apiKey, messages, onChunk, maxTokens=700){
    return _withGroqFailover(apiKey, key => _groqPostStreamOnce(key, messages, onChunk, maxTokens));
  }

  async function _groqPostStreamOnce(apiKey, messages, onChunk, maxTokens=700){
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        messages, max_tokens:maxTokens, temperature:0.65, stream:true
      })
    });
    if(resp.status===429) throw new Error('RATE_LIMIT_429');
    if(resp.status===401) throw new Error('INVALID_KEY');
    if(resp.status===503) throw new Error('RATE_LIMIT_503');
    if(!resp.ok) throw new Error('HTTP_'+resp.status);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    let buf  = '';

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      // Traiter toutes les lignes complètes du buffer
      const lines = buf.split('\n');
      buf = lines.pop(); // la dernière ligne peut être incomplète
      for(const line of lines){
        const l = line.trim();
        if(!l || l==='data: [DONE]') continue;
        if(!l.startsWith('data: ')) continue;
        try{
          const d = JSON.parse(l.slice(6));
          const chunk = d.choices?.[0]?.delta?.content || '';
          if(chunk){ full += chunk; onChunk(full); }
        }catch(_){}
      }
    }
    return full;
  }


  // ════════════════════════════════════════════════
  //  RUBIS — Assistant IA Finance & Projets (admin/contrôleur)
  //  Accès volontairement restreint : noms de projets, noms d'entreprises
  //  clientes, statuts et montants/agrégats financiers uniquement.
  //  AUCUN accès aux emails, mots de passe, clés API, contenu des sites
  //  liés ou toute autre donnée sensible.
  // ════════════════════════════════════════════════

  let _rubisHistory = [];
  let _rubisBusy    = false;

  function rubisCompanyName(p){
    const cl=(db.users||[]).find(u=>u.id===p.clientId);
    return (cl&&cl.username)||'Sans entreprise';
  }

  function rubisSystemPrompt(){
    const now = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const projs = (db.projects||[]).filter(p=>!p.archived);
    const projLines = projs.map(p=>{
      const done=(p.timeline||[]).filter(s=>s.status==='done').length;
      const tot=(p.timeline||[]).length;
      return '- '+p.name+' — entreprise:'+rubisCompanyName(p)+' — statut:'+p.status+' — avancement:'+(tot>0?Math.round(done/tot*100):0)+'%'+(p.dueDate?' — échéance:'+p.dueDate:'');
    }).join('\n');
    return 'Tu es Rubis, assistant IA Finance & Projets de l\'équipe Flow (admin/contrôleur uniquement).\n'
      + 'Date : '+now+'.\n'
      + 'RÈGLE ABSOLUE : tu n\'as accès qu\'aux noms de projets, noms d\'entreprises/clients, statuts et montants/agrégats financiers.\n'
      + 'Tu n\'as JAMAIS accès aux emails, mots de passe, clés API, identifiants de connexion, contenu des sites liés ou toute coordonnée bancaire — ces données ne te sont pas fournies et tu ne dois jamais prétendre les connaître.\n'
      + 'PROJETS ('+projs.length+') :\n'+projLines+'\n'
      + 'Utilise tes outils pour les détails financiers. Sois concis, précis, professionnel.';
  }

  const RUBIS_TOOLS_WEB = [
    {type:'function',function:{name:'calcul',
      description:'Evalue une expression mathématique simple.',
      parameters:{type:'object',properties:{expression:{type:'string'}},required:['expression']}}},
    {type:'function',function:{name:'flow_projets',
      description:'Liste les projets avec le nom de l\'entreprise cliente, le statut et l\'avancement (aucune donnée sensible).',
      parameters:{type:'object',properties:{filtre:{type:'string',enum:['tous','en_cours','termines','en_attente']}},required:[]}}},
    {type:'function',function:{name:'flow_chercher_entreprise',
      description:'Recherche un projet ou une entreprise cliente par nom.',
      parameters:{type:'object',properties:{terme:{type:'string'}},required:['terme']}}},
    {type:'function',function:{name:'flow_finance',
      description:'Données financières agrégées : total, par projet/entreprise, par mois, ou objectifs. Jamais de coordonnées bancaires.',
      parameters:{type:'object',properties:{vue:{type:'string',enum:['total','par_projet','par_mois','objectifs']}},required:['vue']}}},
  ];

  async function rubisToolDispatch(name, args){
    try{
      if(name==='calcul'){
        const expr=(args.expression||'').replace(/[^0-9+\-*/().\s%]/g,'').trim();
        if(!expr) return 'Expression vide.';
        try{ return 'Résultat : '+Function('"use strict";return ('+expr+')')(); }catch(_){ return 'Expression invalide.'; }
      }
      if(name==='flow_projets'){
        const f=args.filtre||'tous';
        let projs=(db.projects||[]).filter(p=>!p.archived);
        if(f==='en_cours')   projs=projs.filter(p=>p.status==='in_progress');
        if(f==='termines')   projs=projs.filter(p=>p.status==='done');
        if(f==='en_attente') projs=projs.filter(p=>p.status==='pending');
        return projs.map(p=>{
          const cl=db.users.find(u=>u.id===p.clientId);
          const done=(p.timeline||[]).filter(s=>s.status==='done').length;
          const tot=(p.timeline||[]).length;
          return '• '+p.name+' ['+p.status+'] — client: '+(cl?cl.username:'aucun')+' — avancement: '+(tot>0?Math.round(done/tot*100):0)+'%'+(p.dueDate?' — échéance: '+p.dueDate:'');
        }).join('\n')||'Aucun projet.';
      }
      if(name==='flow_chercher_entreprise'){
        const t=(args.terme||'').toLowerCase();
        const pr=(db.projects||[]).filter(p=>p.name.toLowerCase().includes(t)||rubisCompanyName(p).toLowerCase().includes(t));
        return pr.length ? pr.map(p=>'• '+p.name+' — entreprise: '+rubisCompanyName(p)+' — ['+p.status+']').join('\n') : 'Aucun résultat pour "'+args.terme+'".';
      }
      if(name==='flow_finance'){
        const fi=db.finance||[];
        const vue=args.vue||'total';
        if(vue==='total'){
          const total=fi.reduce((s,e)=>s+Number(e.amount||0),0);
          const thisMonth=new Date().toISOString().slice(0,7);
          const monthTotal=fi.filter(e=>e.date&&e.date.slice(0,7)===thisMonth).reduce((s,e)=>s+Number(e.amount||0),0);
          return 'Revenus totaux : '+total.toLocaleString('fr-FR')+'€ ('+fi.length+' entrée(s)) — dont '+monthTotal.toLocaleString('fr-FR')+'€ ce mois-ci.';
        }
        if(vue==='par_projet'){
          const byProject={};
          fi.forEach(e=>{ const proj=db.projects.find(p=>p.id===e.projectId); const key=proj?(proj.name+' ('+rubisCompanyName(proj)+')'):(e.label||'—'); byProject[key]=(byProject[key]||0)+Number(e.amount||0); });
          const lines=Object.entries(byProject).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'• '+k+' : '+v.toLocaleString('fr-FR')+'€');
          return lines.length?lines.join('\n'):'Aucune entrée financière.';
        }
        if(vue==='par_mois'){
          const byMonth={};
          fi.forEach(e=>{ if(!e.date) return; const m=e.date.slice(0,7); byMonth[m]=(byMonth[m]||0)+Number(e.amount||0); });
          const months=Object.keys(byMonth).sort().slice(-12);
          return months.length ? months.map(m=>'• '+m+' : '+byMonth[m].toLocaleString('fr-FR')+'€').join('\n') : 'Aucune entrée financière.';
        }
        if(vue==='objectifs'){
          const mg=db.financeGoal?.monthly||0, ag=db.financeGoal?.annual||0;
          const thisMonth=new Date().toISOString().slice(0,7);
          const monthTotal=fi.filter(e=>e.date&&e.date.slice(0,7)===thisMonth).reduce((s,e)=>s+Number(e.amount||0),0);
          const yearTotal=fi.filter(e=>(e.date||'').startsWith(String(new Date().getFullYear()))).reduce((s,e)=>s+Number(e.amount||0),0);
          return [
            mg>0?'Objectif mensuel : '+monthTotal.toLocaleString('fr-FR')+'€ / '+mg.toLocaleString('fr-FR')+'€ ('+Math.round(monthTotal/mg*100)+'%)':'Aucun objectif mensuel défini.',
            ag>0?'Objectif annuel : '+yearTotal.toLocaleString('fr-FR')+'€ / '+ag.toLocaleString('fr-FR')+'€ ('+Math.round(yearTotal/ag*100)+'%)':'Aucun objectif annuel défini.'
          ].join('\n');
        }
        return 'Vue finance non reconnue.';
      }
      return 'Outil "'+name+'" non reconnu.';
    }catch(e){ return 'Erreur outil '+name+' : '+e.message; }
  }

  async function groqPostWithTools(apiKey, messages){
    return _withGroqFailover(apiKey, key => _groqPostWithToolsOnce(key, messages));
  }

  async function _groqPostWithToolsOnce(apiKey, messages){
    const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',messages,tools:RUBIS_TOOLS_WEB,tool_choice:'auto',max_tokens:1200,temperature:0.3})
    });
    if(resp.status===429||resp.status===503) throw new Error('RATE_LIMIT_429');
    if(resp.status===401) throw new Error('GROQ_AUTH_401');
    if(!resp.ok) throw new Error('HTTP_'+resp.status);
    return resp.json();
  }

  async function rubisAgentLoop(groqKey, userMsg, onToolCall){
    _rubisHistory.push({role:'user',content:userMsg});
    const msgs=[{role:'system',content:rubisSystemPrompt()},..._rubisHistory.slice(-24)];
    for(let tour=0;tour<5;tour++){
      const data=await groqPostWithTools(groqKey,msgs);
      const msg=data.choices[0].message;
      if(!msg.tool_calls||!msg.tool_calls.length){
        const text=msg.content||'';
        _rubisHistory.push({role:'assistant',content:text});
        return text;
      }
      msgs.push(msg);
      _rubisHistory.push({role:'assistant',content:msg.content||'',tool_calls:msg.tool_calls});
      for(const tc of msg.tool_calls){
        const args=JSON.parse(tc.function.arguments);
        if(onToolCall) onToolCall(tc.function.name);
        const result=await rubisToolDispatch(tc.function.name,args);
        const tm={role:'tool',tool_call_id:tc.id,name:tc.function.name,content:String(result)};
        msgs.push(tm); _rubisHistory.push(tm);
      }
    }
    return 'Limite de tours atteinte.';
  }

  // ─── Appel combiné : modération + classification intention (1 seul call) ──
  async function callGeminiModerateAndClassify(text, photoBase64, existingSiteHtml, apiKey){
    const siteCtx = existingSiteHtml
      ? `\nSite existant du client (extrait) : "${existingSiteHtml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().substring(0,500).replace(/"/g,"'")}"`
      : '';
    const intentField = existingSiteHtml
      ? `\n- "intent" : "question" si c'est une question/demande d'info sur le site existant, "generation" si c'est une demande de création ou modification`
      : `\n- "intent" : "generation"`;
    const promptText = `Tu es l'assistant IA d'une agence web. Analyse ce message et réponds UNIQUEMENT avec un JSON valide contenant :
- "passed" : true si le message est acceptable, false s'il contient du contenu haineux, violent, illégal ou contraire à l'éthique
- "reason" : courte explication de la décision de modération${intentField}${siteCtx}

Message : "${text.replace(/"/g,"'")}"

Réponds UNIQUEMENT avec le JSON, sans markdown ni explication supplémentaire.`;
    const parts = [{ text: promptText }];
    if(photoBase64&&photoBase64.startsWith('data:image')){
      const [meta,data]=photoBase64.split(',');
      parts.push({ inlineData:{ mimeType:meta.match(/data:(.*);/)?.[1]||'image/jpeg', data } });
    }
    try{
      const json = await groqPost(apiKey,[{role:'user',content:promptText}],300);
      const raw = (json.choices?.[0]?.message?.content||'').replace(/```json\n?/g,'').replace(/```/g,'').trim();
      try{
        const parsed = JSON.parse(raw);
        return {
          moderation: { passed: !!parsed.passed, reason: parsed.reason||'' },
          intent: parsed.intent||'generation'
        };
      }catch(_){
        return { moderation:{ passed:true, reason:'Non parseable — approuvé.' }, intent:'generation' };
      }
    }catch(e){
      if(String(e).includes('RATE_LIMIT')){
        toast('Groq indisponible — modération locale activée.','info');
        const loc = localModerate(text);
        return { moderation: loc, intent:'generation' };
      }
      throw e;
    }
  }

  async function callGeminiReformulate(text, apiKey, projectContext=null, requestType='site'){
    let ctxBlock='';
    if(projectContext){
      const lines=[
        projectContext.name        && `- Nom du projet : ${projectContext.name}`,
        projectContext.description && `- Description : ${projectContext.description}`,
        projectContext.websiteUrl  && `- URL actuelle : ${projectContext.websiteUrl}`,
        projectContext.status      && `- Statut : ${{pending:'En attente',in_progress:'En cours',done:'Terminé'}[projectContext.status]||projectContext.status}`,
        projectContext.progress!=null && `- Avancement timeline : ${projectContext.progress}%`,
        projectContext.currentStep && `- Étape en cours : ${projectContext.currentStep}`,
        projectContext.tags        && `- Secteur / tags : ${projectContext.tags}`,
        projectContext.priority    && `- Priorité : ${projectContext.priority}`,
        projectContext.dueDate     && `- Livraison prévue : ${projectContext.dueDate}`
      ].filter(Boolean).join('\n');
      if(lines) ctxBlock=`\n\nContexte du projet client :\n${lines}`;
    }
    const clientUser = db.users.find(u=>u.username===(projectContext?.clientUsername)||false) || null;
    const aiInstr = clientUser?.aiInstructions || '';
    const instrBlock = aiInstr ? `\n\nInstructions spéciales pour ce client :\n${aiInstr}` : '';
    const baseByType = {
      site:    'Reformule et optimise la demande suivante pour générer un site web HTML complet, esthétique et fonctionnel.',
      text:    'Reformule et optimise la demande suivante pour générer un texte professionnel, structuré et convaincant (article, page About, description, etc.).',
      email:   'Reformule et optimise la demande suivante pour générer un email client professionnel, clair et impactant.',
      resume:  'Reformule et optimise la demande suivante pour générer un résumé structuré du projet, concis et factuel.',
      analyse: 'Reformule et optimise la demande suivante pour générer une analyse détaillée du brief fourni, avec recommandations.'
    };
    const base = baseByType[requestType]||baseByType.site;
    const prompt = `Tu es un expert en prompt engineering pour des modèles IA génératifs (Claude). ${base} Réponds UNIQUEMENT avec le prompt reformulé, sans commentaire ni explication.${ctxBlock}${instrBlock}\n\nDemande originale du client : "${text.replace(/"/g,'\\"')}"`;
    try{
      const json = await groqPost(apiKey,[{role:'user',content:prompt}],600);
      return json.choices?.[0]?.message?.content||text;
    }catch(e){
      if(String(e).includes('RATE_LIMIT')){
        toast('Groq indisponible — prompt original utilisé.','info');
        return text; // fallback : prompt non reformulé
      }
      throw e;
    }
  }

  async function callGeminiAnswer(question, existingSiteHtml, projectContext, apiKey){
    const siteText = existingSiteHtml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().substring(0,2000);
    let ctxBlock = '';
    if(projectContext){
      const parts = [
        projectContext.name        && `Projet : ${projectContext.name}`,
        projectContext.status      && `Statut : ${projectContext.status}`,
        projectContext.progress!=null && `Avancement : ${projectContext.progress}%`,
        projectContext.currentStep && `Étape en cours : ${projectContext.currentStep}`,
        projectContext.tags        && `Tags : ${projectContext.tags}`
      ].filter(Boolean);
      if(parts.length) ctxBlock = `\nContexte projet — ${parts.join(' · ')}`;
    }
    const prompt = `Tu es l'assistant IA d'une agence web. Un client te pose une question sur son site web existant. Réponds de façon claire, concise et utile en français.${ctxBlock}

Contenu textuel du site actuel :
"${siteText.replace(/"/g,"'")}"

Question du client : "${question.replace(/"/g,"'")}"

Réponds directement en français, sans préambule ni répétition de la question.`;
    try{
      const json = await groqPost(apiKey,[{role:'user',content:prompt}],600);
      return json.choices?.[0]?.message?.content||'Désolé, je ne peux pas répondre pour le moment.';
    }catch(e){
      if(String(e).includes('RATE_LIMIT')) throw new Error('Groq rate limit — impossible de répondre pour le moment. Réessayez dans quelques secondes.');
      throw e;
    }
  }
