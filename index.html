    const hasNewVersion = localStorage.getItem('flow_seen_version') !== APP_VERSION;
    bar.innerHTML = tabs.map((t,idx)=>`
      <button class="mob-tab ${activeTab===t.id?'active':''}" data-mob-tab="${t.id}">
        ${t.icon}<span>${t.label}</span>
        ${t.id==='documents'&&shell==='admin'?`<span id="mob-notif-badge" class="mob-tab-badge" style="display:${notifBadge>0?'inline':'none'};">${notifBadge>9?'9+':notifBadge}</span>`:''}

        ${idx===0&&hasNewVersion?`<span class="mob-new-dot" id="mob-version-dot"></span>`:''}
      </button>`).join('')
    + `<button class="mob-tab" id="mob-search-btn" title="Rechercher" style="color:var(--ink-4);">
        ${iconSearch()}<span>Recherche</span>
      </button>`
    + `<button class="mob-logout-btn" id="mob-logout-btn" title="Déconnexion">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Quitter</span>
      </button>`;
    bar.querySelectorAll('[data-mob-tab]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        activeTab=btn.dataset.mobTab;
        if(activeTab==='documents'){ notifBadge=0; updateNotifBadge(); }
        if(shell==='admin') refreshAdminTab(); else refreshClientTab();
      });
    });
    const mobSearch = document.getElementById('mob-search-btn');
    if(mobSearch) mobSearch.addEventListener('click', ()=>{ if(typeof openCmdPalette==='function') openCmdPalette(); });
    const mobLogout = document.getElementById('mob-logout-btn');
    if(mobLogout) mobLogout.addEventListener('click', logout);
  }

  // ─── Tab: Admin Home ────────────────────────────
  function renderAdminHome(){
    const today = new Date(); today.setHours(0,0,0,0);
    const nowMs = Date.now();
    const in30 = nowMs + 30*86400000;
    const fmtDate = d => new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    const clientName = p => { const c = db.users.find(u=>u.id===p.clientId); return c ? (c.firstName||c.username) : 'Sans client'; };
    const pctOf = p => { const tl=p.timeline||[]; return tl.length ? Math.round(tl.filter(s=>s.status==='done').length/tl.length*100) : 0; };
    const isKanban = window._adminView !== 'list';

    // ── Projets par statut ──
    const live = db.projects.filter(p=>!p.archived);
    const cols = [
      { id:'pending',     label:'En attente', color:'var(--sky)',   tint:'rgba(43,108,176,.12)', ps: live.filter(p=>p.status==='pending') },
      { id:'in_progress', label:'En cours',   color:'var(--coral)', tint:'var(--coral-tint)',    ps: live.filter(p=>p.status==='in_progress') },
      { id:'done',        label:'Terminés',   color:'var(--sage)',  tint:'rgba(47,125,79,.12)',  ps: live.filter(p=>p.status==='done') },
    ];
    const totalLive = Math.max(1, live.length);

    // ── Charge de travail ──
    const activeP = live.filter(p=>p.status!=='done');
    const in7 = nowMs + 7*86400000;
    const dueSoon7 = activeP.filter(p=>p.dueDate && new Date(p.dueDate).getTime()<=in7 && new Date(p.dueDate).getTime()>=nowMs).length;
    const noDate = activeP.filter(p=>!p.dueDate).length;
    const WORKLOAD_COMFORT = 6, WORKLOAD_HIGH = 10;
    const loadLabel = activeP.length<=WORKLOAD_COMFORT?'Confortable':activeP.length<=WORKLOAD_HIGH?'Soutenue':'Élevée';
    const loadColor = activeP.length<=WORKLOAD_COMFORT?'var(--sage)':activeP.length<=WORKLOAD_HIGH?'var(--peach)':'var(--danger)';

    // ── Échéances (30 jours) ──
    const upcoming = live
      .filter(p=>p.dueDate && p.status!=='done')
      .map(p=>({p, ms:new Date(p.dueDate).getTime()}))
      .filter(x=>x.ms>=nowMs && x.ms<=in30)
      .sort((a,b)=>a.ms-b.ms);

    // ── Alertes (retards, projets à surveiller, documents, inactivité, périmètre) ──
    const alerts = [];
    live.filter(p=>p.dueDate && p.status!=='done' && new Date(p.dueDate)<today).forEach(p=>{
      alerts.push({ dot:'var(--danger)', title:'Échéance dépassée', sub:`${esc(p.name)} · ${esc(clientName(p))}`, tab:null });
    });
    activeP.map(p=>({p, h:projectHealthScore(p)})).filter(x=>x.h.score<55).sort((a,b)=>a.h.score-b.h.score).slice(0,4).forEach(({p,h})=>{
      alerts.push({ dot:h.color, title:`À surveiller · santé ${h.score}`, sub:`${esc(p.name)} · ${esc(h.reasons[0]||h.label)}`, tab:null });
    });
    db.documents.filter(d=>d.status==='pending').forEach(d=>{
      const days = d.sentAt ? Math.floor((nowMs-new Date(d.sentAt))/86400000) : 0;
      if(days>=7){
        const proj=db.projects.find(p=>p.id===d.projectId);
        const client=proj?db.users.find(u=>u.id===proj.clientId):null;
        alerts.push({ dot:'var(--peach)', title:'Document en attente', sub:`${esc(d.name)}${client?' · @'+esc(client.username):''} · ${days} j`, tab:'documents' });
      }
    });
    live.filter(p=>p.status==='in_progress').forEach(p=>{
      const last = (db.activityLog||[]).filter(e=>e.description?.includes(p.name)).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      if(last){
        const days = Math.floor((nowMs-new Date(last.date))/86400000);
        if(days>=14) alerts.push({ dot:'var(--sky)', title:'Aucune activité', sub:`${esc(p.name)} · depuis ${days} j`, tab:null });
      }
    });
    // Détecteur de dépassement de périmètre : 3 demandes de tâches ou plus
    // depuis le dernier devis/facture du client.
    live.filter(p=>p.status!=='done'&&p.clientId).forEach(p=>{
      const inv = (db.invoices||[]).filter(i=>i.clientId===p.clientId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const since = inv[0]?.createdAt || p.createdAt || null;
      if(!since) return;
      const n = (db.aiRequests||[]).filter(r=>r.clientId===p.clientId && r.possibleTask && new Date(r.createdAt)>new Date(since)).length;
      if(n>=3) alerts.push({ dot:'var(--coral)', title:'Périmètre potentiellement dépassé', sub:`${esc(p.name)} · ${n} demandes depuis le dernier devis`, tab:'ai-automation' });
    });

    // ── Avis clients ──
    const reviews = db.reviews||[];
    const avg = reviews.length ? reviews.reduce((s,r)=>s+r.rating,0)/reviews.length : 0;
    const recentReviews = [...reviews].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,3);

    // ── Finance (6 derniers mois) ──
    const showFinance = canAccessFinance();
    const months = [];
    for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push({ y:d.getFullYear(), m:d.getMonth(), label:d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''), sum:0 }); }
    (db.finance||[]).forEach(e=>{
      if(!e.date) return;
      const d = new Date(e.date);
      const slot = months.find(x=>x.y===d.getFullYear() && x.m===d.getMonth());
      if(slot) slot.sum += Number(e.amount||0);
    });
    const maxSum = Math.max(1, ...months.map(x=>x.sum));
    const euro = v => v.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});

    // ── Activité récente & archives ──
    const recentDocs = [...db.documents].sort((a,b)=>((b.filledAt||b.sentAt||'').localeCompare(a.filledAt||a.sentAt||''))).slice(0,5);
    const archivedProjects = db.projects.filter(p=>p.archived);

    // ── Rendu d'une carte projet (glissable en vue Kanban) ──
    const projItem = (p, col, colIdx) => {
      const pct = pctOf(p);
      const sub = col.id==='done' ? `${esc(clientName(p))} · terminé` : p.dueDate ? `${esc(clientName(p))} · échéance ${fmtDate(p.dueDate)}` : esc(clientName(p));
      const attrs = isKanban
        ? `draggable="true" tabindex="0" role="listitem button" data-pid="${p.id}" data-colindex="${colIdx}" aria-label="${esc(p.name)}, ${pct}% complété, colonne ${esc(col.label)}"`
        : '';
      return `<div class="pipe-item ${isKanban?'kanban-card':''}" ${attrs}>
        <span class="ic" style="background:${col.tint};color:${p.color||col.color};">${ic('folder','',16)}</span>
        <div style="flex:1;min-width:0;">
          <div class="t">${esc(p.name)}</div>
          <div class="s">${sub}</div>
          ${col.id!=='done'?`<div class="bar"><i style="width:${pct}%;"></i></div>`:''}
        </div>
      </div>`;
    };

    const greet = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

    return `<div class="fade-up">
      <div class="home-head">
        <div>
          <p class="home-date">${greet.charAt(0).toUpperCase()+greet.slice(1)}</p>
          <h1>Bonjour ${esc(me.firstName||me.username)}</h1>
        </div>
        <div class="home-actions">
          <button id="btn-weekly-report" class="btn btn-ghost" title="Envoyer le rapport hebdomadaire maintenant">${ic('chart')} Rapport hebdo</button>
          ${me.role==='admin'?`<button id="btn-workload" class="btn btn-ghost" title="Charge de travail par membre de l'équipe">${ic('users')} Charge de travail</button>`:''}
          ${showFinance?`<button id="btn-home-finance" class="btn btn-ghost">${ic('money')} Entrée finance</button>`:''}
          ${canManageProjects(me)?`<button id="btn-new-project" class="btn btn-primary">${ic('plus')} Nouveau projet</button>`:''}
        </div>
      </div>

      <section class="fl-card" style="margin-bottom:20px;">
        <div class="fl-card-head" style="flex-wrap:wrap;">
          <h2>Projets</h2>
          <span class="load-pill" style="background:rgba(var(--fg-rgb),.05);color:${loadColor};" title="Repère : confortable jusqu'à ${WORKLOAD_COMFORT} projets actifs, soutenue jusqu'à ${WORKLOAD_HIGH}.">Charge ${loadLabel.toLowerCase()}</span>
          <span class="fl-meta">${activeP.length} actif(s) · ${dueSoon7} échéance(s) sous 7 j · ${noDate} sans date</span>
          <button id="btn-view-toggle" class="fl-link" title="${isKanban?'Afficher la liste détaillée':'Afficher les colonnes Kanban'}">${ic(isKanban?'list':'columns','',14)} ${isKanban?'Vue liste':'Vue Kanban'}</button>
        </div>
        <div class="pipe-bar" role="img" aria-label="${cols.map(c=>c.ps.length+' '+c.label.toLowerCase()).join(', ')}">
          ${cols.map(c=>c.ps.length?`<div style="flex:${c.ps.length};background:${c.color};"></div>`:'').join('')}
        </div>
        ${isKanban ? `
        <div class="pipe-cols" id="kanban-board" role="application" aria-label="Projets par statut — glissez une carte, ou flèches gauche/droite au clavier">
          ${cols.map((col,colIdx)=>`
            <div>
              <div class="pipe-col-head"><span class="fl-dot" style="background:${col.color};"></span>${col.label} <span class="n">${col.ps.length}</span></div>
              <div class="kanban-col pipe-drop" data-status="${col.id}" data-colindex="${colIdx}" role="list" aria-label="${esc(col.label)}">
                ${col.ps.length ? col.ps.map(p=>projItem(p,col,colIdx)).join('') : '<div class="fl-empty">Aucun projet</div>'}
              </div>
            </div>`).join('')}
        </div>
        <p class="fl-meta" style="margin-top:4px;">Glissez une carte d'une colonne à l'autre pour changer son statut (ou flèches gauche/droite au clavier).</p>`
        : (()=>{
          const clients = db.users.filter(u=>u.role==='client'||u.role==='controller');
          const PRIO = {urgent:0,normal:1,low:2};
          const pending = clients.filter(u=>{ const p=getUserProject(u.id); return p && p.status!=='done'; })
            .sort((a,b)=>{ const pa=getUserProject(a.id), pb=getUserProject(b.id); return (pb?.pinned?1:0)-(pa?.pinned?1:0) || (PRIO[pa?.priority||'normal']||1)-(PRIO[pb?.priority||'normal']||1); });
          const done = clients.filter(u=>{ const p=getUserProject(u.id); return p && p.status==='done'; });
          return `<div class="fl-grid" style="margin-bottom:0;">
            <div>
              <div class="pipe-col-head"><span class="fl-dot" style="background:var(--coral);"></span>En cours <span class="n">${pending.length}</span></div>
              ${pending.length ? pending.map(u=>renderClientRow(u,getUserProject(u.id))).join('') : '<div class="fl-empty">Aucun projet en cours</div>'}
            </div>
            <div>
              <div class="pipe-col-head"><span class="fl-dot" style="background:var(--sage);"></span>Terminés <span class="n">${done.length}</span></div>
              ${done.length ? done.map(u=>renderClientRow(u,getUserProject(u.id))).join('') : '<div class="fl-empty">Aucun projet terminé</div>'}
            </div>
          </div>`;
        })()}
      </section>

      <div class="fl-grid">
        <section class="fl-card">
          <div class="fl-card-head">${ic('cal','',18)}<h2>Échéances</h2><span class="fl-meta">30 jours</span></div>
          ${upcoming.length ? upcoming.slice(0,6).map(({p,ms})=>{
            const days = Math.ceil((ms-nowMs)/86400000);
            const col = days<=3?'var(--danger)':days<=7?'var(--peach)':'var(--sky)';
            return `<div class="fl-row"><span class="fl-dot" style="background:${col};"></span>
              <div style="flex:1;min-width:0;"><div>${esc(p.name)}</div><div class="fl-meta">${esc(clientName(p))} · ${fmtDate(p.dueDate)}</div></div>
              <span style="font-size:12px;font-weight:600;color:${col};">J-${days}</span></div>`;
          }).join('') : '<div class="fl-empty">Aucune échéance à venir.</div>'}
        </section>

        <section class="fl-card">
          <div class="fl-card-head">${ic('alert','',18)}<h2>Alertes</h2><span class="fl-meta">${alerts.length}</span></div>
          ${alerts.length ? alerts.slice(0,6).map(a=>`
            <div class="fl-row" ${a.tab?`style="cursor:pointer;" onclick="goTab('${a.tab}')"`:''}><span class="fl-dot" style="background:${a.dot};"></span>
              <div style="flex:1;min-width:0;"><div>${a.title}</div><div class="fl-meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.sub}</div></div></div>`).join('')
            : '<div class="fl-empty">Rien à signaler.</div>'}
        </section>

        <section class="fl-card">
          <div class="fl-card-head">${ic('star','',18)}<h2>Avis clients</h2><span class="fl-meta">${reviews.length?avg.toFixed(1)+' / 5 · '+reviews.length+' avis':''}</span></div>
          ${recentReviews.length ? recentReviews.map(r=>`
            <div class="fl-row"><span class="fl-dot" style="background:var(--sage);"></span>
              <div style="flex:1;min-width:0;">
                <div style="display:flex;justify-content:space-between;gap:8px;"><span>@${esc(r.clientUsername)}</span><span style="color:var(--peach);white-space:nowrap;">${ic('starfill','',13).repeat(r.rating)}${ic('star','',13).repeat(5-r.rating)}</span></div>
                ${r.comment?`<div class="fl-meta">« ${esc(r.comment)} »</div>`:''}
              </div></div>`).join('') : '<div class="fl-empty">Aucun avis pour le moment.</div>'}
        </section>
      </div>

      ${showFinance ? `
      <div style="display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px;">
        <section class="fl-card" style="flex:2 1 420px;min-width:0;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;">
            <div>
              <h2>Finance</h2>
              <div style="margin-top:4px;font-family:var(--font-display);font-size:28px;font-weight:600;">${euro(months[5].sum)}</div>
              <div class="fl-meta">Encaissé ce mois-ci</div>
            </div>
            <button class="fl-link" onclick="goTab('finance')">Ouvrir Finance ${ic('chevright','',14)}</button>
          </div>
          <div class="fin-chart" role="img" aria-label="Revenus des 6 derniers mois">
            ${months.map((x,i)=>`<div class="${i===5?'cur':''}" title="${x.label} : ${euro(x.sum)}"><i style="height:${Math.round(x.sum/maxSum*100)}%;"></i></div>`).join('')}
          </div>
          <div class="fin-labels">${months.map(x=>`<span>${x.label}</span>`).join('')}</div>
        </section>

        <section class="rubis-card" style="flex:1 1 300px;min-width:0;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="rubis-gem">${ic('rubis','',18)}</span>
            <div><h2>Rubis</h2><div class="sub">Votre assistant de projet</div></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${[
              ['edit','Résumé d’avancement','Fais-moi un résumé d’avancement de tous les projets en cours.'],
              ['mail','Message de relance','Rédige un message de relance pour les clients dont un document est en attente.'],
              ['sparkle','Newsletter de fin de projet','Prépare une newsletter de fin de projet pour le dernier projet terminé.'],
            ].map(([i,l,q])=>`<button class="rubis-prompt" data-rubis-q="${esc(q)}">${ic(i,'',16)} ${l}</button>`).join('')}
          </div>
          <form class="rubis-ask" id="home-rubis-form" onsubmit="return false;">
            <input id="home-rubis-input" placeholder="Posez une question à Rubis" aria-label="Question pour Rubis" />
            <button type="submit" aria-label="Envoyer à Rubis">${ic('arrowright','',14)}</button>
          </form>
        </section>
      </div>` : ''}

      <div class="fl-grid">
        <section class="fl-card">
          <div class="fl-card-head">${ic('history','',18)}<h2>Activité récente</h2></div>
          ${recentDocs.length ? recentDocs.map(d=>{
            const client = db.users.find(u=>u.id===d.clientId)||null;
            const col = {pending:'var(--peach)',filled:'var(--sage)',reviewed:'var(--sky)'}[d.status]||'var(--ink-4)';
            const lab = {pending:'En attente',filled:'Rempli',reviewed:'Validé'}[d.status]||d.status;
            return `<div class="fl-row"><span class="fl-dot" style="background:${col};"></span>
              <div style="flex:1;min-width:0;"><div>${esc(d.name)}</div><div class="fl-meta">${client?esc(client.username):'—'} · ${esc(d.filledAt||d.sentAt||'—')}</div></div>
              <span style="font-size:12px;font-weight:600;color:${col};white-space:nowrap;">${lab}</span></div>`;
          }).join('') : '<div class="fl-empty">Aucune activité.</div>'}
        </section>
        ${(()=>{
          const now = new Date(), year = now.getFullYear(), month = now.getMonth();
          const byDay = {};
          live.filter(p=>p.dueDate).forEach(p=>{ const d=new Date(p.dueDate); if(d.getFullYear()===year&&d.getMonth()===month){ (byDay[d.getDate()]=byDay[d.getDate()]||[]).push(p); } });
          if(!Object.keys(byDay).length) return '';
          const days = new Date(year,month+1,0).getDate();
          const offset = (new Date(year,month,1).getDay()+6)%7;
          let cells = '';
          for(let i=0;i<offset;i++) cells+='<div></div>';
          for(let d=1;d<=days;d++){
            const isToday = d===now.getDate(), ps = byDay[d]||[];
            cells+=`<div style="min-height:40px;padding:4px;border-radius:6px;background:${isToday?'var(--coral-tint)':ps.length?'rgba(43,108,176,.08)':'transparent'};" ${ps.length?`title="${esc(ps.map(p=>p.name).join(', '))}"`:''}>
              <div style="font-size:12px;font-weight:${isToday?'700':'400'};color:${isToday?'var(--coral)':'var(--ink-3)'};">${d}</div>
              ${ps.slice(0,2).map(p=>`<div style="font-size:10px;background:var(--coral-tint);color:var(--coral-soft);padding:1px 4px;border-radius:3px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.name)}</div>`).join('')}
            </div>`;
          }
          return `<section class="fl-card">
            <div class="fl-card-head">${ic('cal','',18)}<h2>Calendrier</h2><span class="fl-meta">${now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</span></div>
            <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px;">${['L','M','M','J','V','S','D'].map(d=>`<div style="font-size:11px;color:var(--ink-3);text-align:center;font-weight:600;">${d}</div>`).join('')}</div>
            <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;">${cells}</div>
          </section>`;
        })()}
      </div>

      ${archivedProjects.length ? `
      <details class="fl-card">
        <summary style="display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;">${ic('archive','',18)}<h2 style="flex:1;">Archives</h2><span class="fl-meta">${archivedProjects.length} projet(s)</span>${ic('chevdown','',16)}</summary>
        <div style="margin-top:12px;">
          ${archivedProjects.map(p=>`
            <div class="fl-row">
              <span style="flex:1;color:var(--ink-3);">${esc(p.name)}</span>
              <button class="btn btn-ghost btn-sm btn-unarchive" data-pid="${p.id}">${ic('undo','',14)} Restaurer</button>
              <button class="btn btn-danger btn-sm btn-del-archived" data-pid="${p.id}" aria-label="Supprimer définitivement">${ic('trash','',14)}</button>
            </div>`).join('')}
        </div>
      </details>` : ''}
    </div>`;
  }

  function renderClientRow(u, project){
    const tl = project&&project.timeline ? project.timeline : [];
    const doneCnt = tl.filter(s=>s.status==='done').length;
    const pct = tl.length>0 ? Math.round(doneCnt/tl.length*100) : 0;
    let dueBadge = '';
    if(project&&project.dueDate){
      const today=new Date(); today.setHours(0,0,0,0);
      const due=new Date(project.dueDate);
      const diffDays=Math.ceil((due-today)/(1000*60*60*24));
      if(diffDays<0) dueBadge=`<span style="font-size:.7rem;background:rgba(220,80,80,.18);border:1px solid rgba(220,80,80,.3);color:var(--danger);padding:2px 8px;border-radius:8px;">En retard</span>`;
      else if(diffDays<=7) dueBadge=`<span style="font-size:.7rem;background:rgba(240,169,136,.18);border:1px solid rgba(240,169,136,.3);color:var(--peach);padding:2px 8px;border-radius:8px;">J-${diffDays}</span>`;
    }

  // ─── Rapport hebdomadaire automatique ────────────
  // Pas de backend/cron disponible : le rapport est généré à la première ouverture
  // du dashboard admin après le changement de semaine ISO, puis envoyé sur les
  // canaux déjà existants (centre in-app + Discord).
  function isoWeekKey(d){
    d = d ? new Date(d) : new Date();
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay()+6)%7;
    date.setUTCDate(date.getUTCDate()-dayNum+3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
    const week = 1+Math.round(((date-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
    return date.getUTCFullYear()+'-W'+String(week).padStart(2,'0');
  }
  function buildWeeklyReportText(){
    const since = Date.now()-7*86400000;
    const newProjects = db.projects.filter(p=>new Date(p.createdAt).getTime()>=since).length;
    const completedProjects = db.activityLog.filter(e=>e.type==='project_status'&&new Date(e.at).getTime()>=since&&/→ done/.test(e.description)).length;
    const docsFilled = db.documents.filter(d=>d.filledAt&&new Date(d.filledAt).getTime()>=since).length;
    const docsPendingOld = db.documents.filter(d=>d.status==='pending'&&d.sentAt&&Date.now()-new Date(d.sentAt).getTime()>=7*86400000).length;
    const revenueWeek = (db.finance||[]).filter(e=>e.date&&new Date(e.date).getTime()>=since).reduce((s,e)=>s+Number(e.amount||0),0);
    const activeNow = db.projects.filter(p=>!p.archived&&p.status!=='done').length;
    const overdueNow = db.projects.filter(p=>p.dueDate&&p.status!=='done'&&new Date(p.dueDate)<new Date()).length;
    const pendingInvoices = (db.invoices||[]).filter(i=>i.type==='Facture'&&i.paymentStatus==='pending');
    const pendingInvoicesTotal = pendingInvoices.reduce((s,i)=>s+(i.ttc||0),0);
    const newRequests = (db.pendingUsers||[]).length;
    const lines = [
      `📁 ${newProjects} nouveau(x) projet(s) · ✅ ${completedProjects} terminé(s) cette semaine`,
      `📋 ${docsFilled} document(s) rempli(s) · ⚠️ ${docsPendingOld} en attente depuis 7j+`,
      `💰 ${revenueWeek.toLocaleString('fr-FR')}€ encaissés cette semaine`,
      `⚙️ ${activeNow} projet(s) actif(s) au total${overdueNow>0?` · 🚨 ${overdueNow} en retard`:''}`,
    ];
    if(pendingInvoices.length>0) lines.push(`🧾 ${pendingInvoices.length} facture(s) en attente de paiement, soit ${pendingInvoicesTotal.toLocaleString('fr-FR')}€`);
    if(newRequests>0) lines.push(`📝 ${newRequests} nouvelle(s) demande(s) d'inscription en attente`);
    return lines.join('\n');
  }
  function maybeRunWeeklyReport(){
    const key = isoWeekKey();
    if(db.lastWeeklyReportKey===key) return; // déjà généré pour cette semaine ISO
    db.lastWeeklyReportKey = key;
    const body = buildWeeklyReportText();
    notifyEvent('admins', '📊 Rapport hebdomadaire Flow', body, {color:0x9bb8d8});
    saveDB();
  }

  // Prévision de charge : durée moyenne réelle des projets déjà terminés
  // ayant un nombre d'étapes similaire (±2), pour affiner les délais annoncés
  // sans deviner — basé sur les données réelles de l'agence, pas sur l'IA.
  function estimateProjectDuration(stepCount){
    const finished = db.projects.filter(p=>p.status==='done' && Array.isArray(p.timeline) && p.timeline.length>0 && p.createdAt);
    const similar = finished.filter(p=>Math.abs(p.timeline.length-stepCount)<=2);
    const pool = similar.length>=3 ? similar : finished;
    if(pool.length<2) return null;
    const durations = pool.map(p=>{
      const lastDone = [...p.timeline].reverse().find(s=>s.status==='done'&&s.dueDate);
      const endDate = lastDone?.dueDate ? new Date(lastDone.dueDate) : new Date(p.updatedAt||p.createdAt);
      return Math.round((endDate - new Date(p.createdAt)) / 86400000);
    }).filter(d=>d>0 && d<365);
    if(durations.length<2) return null;
    const avg = Math.round(durations.reduce((s,d)=>s+d,0)/durations.length);
    return { avgDays: avg, sampleSize: durations.length, basedOnSimilar: similar.length>=3 };
  }

        const name=document.getElementById('np-name').value.trim();
        const clientId=document.getElementById('np-client').value||null;
        const desc=document.getElementById('np-desc').value.trim();
        const url=document.getElementById('np-url').value.trim();
        const due=document.getElementById('np-due').value||null;
        const color=document.getElementById('np-color').value||'';
        const tags=document.getElementById('np-tags')?.value.split(',').map(t=>t.trim()).filter(Boolean)||[];

        logActivity('project_created', 'Projet créé : ' + name);
        saveDB(); toast('Projet créé !','success'); closeModal(); refreshAdminTab();
      });
    });

  function exportUsersCSV(){
    const rows = [['ID','Username','Prénom','Nom','Email','Rôle','Projet','Créé le']];
    db.users.forEach(u=>{
      const p = getUserProject(u.id);
      rows.push([u.id, u.username, u.firstName||'', u.lastName||'', u.email||'', u.role, p?p.name:'', u.createdAt||'']);
    });
    const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='flow_users.csv'; a.click();
    URL.revokeObjectURL(url);
    toast('CSV exporté !','success');
  }

  function wireAdminUsers(){
    const btnNew = document.getElementById('btn-new-user');
    if(btnNew) btnNew.addEventListener('click',()=>openCreateUserModal());
    const btnCSV = document.getElementById('btn-export-csv');
    if(btnCSV) btnCSV.addEventListener('click',exportUsersCSV);
    document.querySelectorAll('.btn-edit-user').forEach(b=>{
      b.addEventListener('click',()=>openEditUserModal(b.dataset.uid));
    });
    document.querySelectorAll('.btn-del-user').forEach(b=>{
      b.addEventListener('click',()=>confirmDeleteUser(b.dataset.uid));
    });

    // Pagination — n'affiche que PAGE_SIZE résultats correspondant aux filtres à la fois,
    // pour éviter de garder des centaines de cartes utilisateur rendues simultanément.
    const PAGE_SIZE = 25;
    let activeRoleFilter = '';
    let visibleCount = PAGE_SIZE;
    function applyUserFilters(){
      const q = (document.getElementById('user-search')?.value||'').toLowerCase();
      const allWraps = Array.from(document.querySelectorAll('#users-list .user-card-wrap'));
      const matching = allWraps.filter(wrap=>{
        const uid = wrap.dataset.uid;
        const u = db.users.find(x=>x.id===uid);
        if(!u) return false;
        const hay = `${u.username} ${u.firstName||''} ${u.lastName||''} ${u.email||''} ${u.role}`.toLowerCase();
        return hay.includes(q) && (activeRoleFilter==='' || u.role===activeRoleFilter);
      });
      allWraps.forEach(w=>w.style.display='none');
      matching.slice(0, visibleCount).forEach(w=>w.style.display='');
      const pag = document.getElementById('users-pagination');
      if(pag){
        const remaining = matching.length - visibleCount;
        pag.innerHTML = remaining>0
          ? `<button id="btn-users-more" class="btn btn-ghost btn-sm">Voir ${Math.min(remaining,PAGE_SIZE)} de plus (${remaining} restant${remaining>1?'s':''})</button>`
          : matching.length>PAGE_SIZE ? `<span style="font-size:.75rem;color:var(--ink-4);">${matching.length} résultat(s) affiché(s)</span>` : '';
        const moreBtn = document.getElementById('btn-users-more');
        if(moreBtn) moreBtn.addEventListener('click',()=>{ visibleCount+=PAGE_SIZE; applyUserFilters(); });
      }
    }

    const searchInput = document.getElementById('user-search');
    if(searchInput) searchInput.addEventListener('input', ()=>{ visibleCount=PAGE_SIZE; applyUserFilters(); });

    document.querySelectorAll('.role-chip').forEach(chip=>{
      chip.addEventListener('click',()=>{
        document.querySelectorAll('.role-chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        activeRoleFilter = chip.dataset.role;
        visibleCount = PAGE_SIZE;
        applyUserFilters();
      });
    });

    applyUserFilters();
  }

  function wireAdminDocuments(){
    document.getElementById('btn-all-client-files')?.addEventListener('click',openAllClientFilesModal);
    // Kebab menu toggle — portail body pour échapper à tous les containing blocks
    document.querySelectorAll('.kebab-btn').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const pid = btn.dataset.pid;
        const menu = document.getElementById('kebab-'+pid);
        if(!menu) return;
        const isOpen = menu.classList.contains('open');
        // Fermer tout menu ouvert
        document.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open'));
        if(!isOpen){
          // IMPORTANT : #main et #tab-content utilisent `contain: layout`, ce
          // qui crée un containing block pour les descendants en position:fixed
          // et fausse tout calcul fait par rapport à la fenêtre. On déplace donc
          // le menu directement dans <body> (hors de cette portée) avant de le
          // positionner, et on mémorise son emplacement d'origine pour le
          // remettre en place à la fermeture.
          if(menu.parentElement !== document.body){
            menu._origParent = menu.parentElement;
            menu._origNext   = menu.nextSibling;
            document.body.appendChild(menu);
          }
          const rect = btn.getBoundingClientRect();
          // Positionner en dessous du bouton, aligné à droite
          const top   = rect.bottom + 6;
          const right = window.innerWidth - rect.right;
          menu.style.top   = top + 'px';
          menu.style.right = right + 'px';
          menu.style.left  = 'auto';
          menu.style.bottom = 'auto';
          menu.classList.add('open');
          // Clamp : si dépasse en bas → afficher au-dessus du bouton
          requestAnimationFrame(()=>{
            const mRect = menu.getBoundingClientRect();
            if(mRect.bottom > window.innerHeight - 8){
              menu.style.top = (rect.top - mRect.height - 6) + 'px';
            }
            // Clamp : si dépasse à droite → décaler à gauche
            if(mRect.left < 8){
              menu.style.right = 'auto';
              menu.style.left  = '8px';
            }
          });
        }
      });
    });
    if(!window._kebabCloseWired){
      window._kebabCloseWired = true;
      document.addEventListener('click',()=>{
        document.querySelectorAll('.kebab-menu.open').forEach(m=>{
          m.classList.remove('open');
          // Remettre le menu à sa place d'origine dans le DOM pour que le
          // prochain re-rendu de la liste (innerHTML) le retrouve bien.
          if(m._origParent){
            if(m._origNext) m._origParent.insertBefore(m, m._origNext);
            else m._origParent.appendChild(m);
          }
        });
      });
    }

              navigator.clipboard.writeText(txtEl.value).then(()=>{ toast('Newsletter copiée !','success'); closeModal(); }).catch(()=>toast('Copiez le texte manuellement.','info'));
            });
          }catch(e){
            document.getElementById('ai-news-loading').textContent = '❌ Erreur : '+e.message;
          }
        });
      });
    });

    const DOC_PAGE_SIZE = 25;
    let docVisibleCount = DOC_PAGE_SIZE;
    function applyDocFilters(){
      const q = (document.getElementById('doc-search')?.value||'').toLowerCase();
      const statusF = document.getElementById('doc-filter-status')?.value||'';
      const prioF   = document.getElementById('doc-filter-prio')?.value||'';
      const allWraps = Array.from(document.querySelectorAll('.client-doc-panel-wrap'));
      const matching = allWraps.filter(wrap=>{
        const uid = wrap.dataset.uid;
        const u = db.users.find(x=>x.id===uid);
        if(!u) return false;
        const project = getUserProject(u.id);
        const hay = `${u.username} ${u.firstName||''} ${u.lastName||''} ${project?project.name:''}`.toLowerCase();
        const matchQ = !q || hay.includes(q);
        let matchStatus = true;
        if(statusF && project){
          const docs = getProjectDocs(project.id);
          if(statusF==='nodoc') matchStatus = docs.length===0;
          else matchStatus = docs.some(d=>d.status===statusF);
        } else if(statusF) { matchStatus = false; }
        let matchPrio = !prioF || (project&&(project.priority||'normal')===prioF);
        return matchQ && matchStatus && matchPrio;
      });
      allWraps.forEach(wrap=>wrap.style.display='none');
      matching.slice(0,docVisibleCount).forEach(wrap=>wrap.style.display='');
      const pag = document.getElementById('doc-pagination');
      if(pag){
        const remaining = matching.length - docVisibleCount;
        pag.innerHTML = remaining>0
          ? `<button id="btn-docs-more" class="btn btn-ghost btn-sm">Voir ${Math.min(remaining,DOC_PAGE_SIZE)} de plus (${remaining} restant${remaining>1?'s':''})</button>`
          : matching.length>DOC_PAGE_SIZE ? `<span style="font-size:.75rem;color:var(--ink-4);">${matching.length} résultat(s) affiché(s)</span>` : '';
        const moreBtn = document.getElementById('btn-docs-more');
        if(moreBtn) moreBtn.addEventListener('click',()=>{ docVisibleCount+=DOC_PAGE_SIZE; applyDocFilters(); });
      }
    }
    document.getElementById('doc-search')?.addEventListener('input', ()=>{ docVisibleCount=DOC_PAGE_SIZE; applyDocFilters(); });
    document.getElementById('doc-filter-status')?.addEventListener('change', ()=>{ docVisibleCount=DOC_PAGE_SIZE; applyDocFilters(); });
    document.getElementById('doc-filter-prio')?.addEventListener('change', ()=>{ docVisibleCount=DOC_PAGE_SIZE; applyDocFilters(); });
    applyDocFilters();
  }

  function wireAdminProfile(){
    const btnTheme = document.getElementById('btn-toggle-theme');
    if(btnTheme) btnTheme.addEventListener('click',()=>{
      toggleTheme();
      refreshAdminTab();
    });
    document.getElementById('p-save').addEventListener('click',()=>{
      const fn=document.getElementById('p-fn').value.trim();
      const ln=document.getElementById('p-ln').value.trim();
      const un=document.getElementById('p-un').value.trim();
      const em=document.getElementById('p-em').value.trim();
      const np=document.getElementById('p-np').value;
      const cp=document.getElementById('p-cp').value;
      const ph=document.getElementById('p-ph').value.trim();
      const discord=(document.getElementById('p-discord')||{value:''}).value.trim();
      const msg=document.getElementById('p-msg');

      if(!un){ showMsg(msg,'Le pseudo est requis.','error'); return; }
      if(db.users.some(u=>u.username.toLowerCase()===un.toLowerCase()&&u.id!==me.id)){
        showMsg(msg,'Ce pseudo est déjà utilisé.','error'); return;
      }
      if(np && np!==cp){ showMsg(msg,'Les mots de passe ne correspondent pas.','error'); return; }
      if(np){ const pwErr = validatePasswordStrength(np); if(pwErr){ showMsg(msg,pwErr,'error'); return; } }
      if(discord && !/^https:\/\/(discord\.com|discordapp\.com)\/api\/webhooks\//i.test(discord)){
        showMsg(msg,'L\'URL du webhook Discord ne semble pas valide.','error'); return;
      }

      const u = db.users.find(u=>u.id===me.id);
      u.firstName=fn; u.lastName=ln; u.username=un; u.email=em; u.photo=ph||null; u.discordWebhook=discord||'';
      const applyProfileSave=()=>{ me=u; saveDB(); toast('Profil mis à jour !','success'); showMsg(msg,'Profil mis à jour avec succès !','success'); document.getElementById('app').innerHTML=renderAdminShell(); wireAdmin(); };
      if(np){ hashPwdStrong(np).then(h=>{ u.password=h; applyProfileSave(); }); } else { applyProfileSave(); }
    });

    // Sauvegarde & Restauration — export/import JSON complet de la base
    const btnExportJson = document.getElementById('btn-export-json');
    const btnCopyPortfolio = document.getElementById('btn-copy-portfolio');
    if(btnCopyPortfolio) btnCopyPortfolio.addEventListener('click',()=>{
      const url = window.location.origin + window.location.pathname + '?portfolio=1';
      navigator.clipboard?.writeText(url).then(()=>toast('Lien du portfolio copié ✓','success')).catch(()=>{
        showModal(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><h2 style="font-size:1rem;font-weight:700;">🌐 Lien du portfolio</h2><button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button></div><input class="glass-input" value="${esc(url)}" readonly onclick="this.select()" />`,()=>{});
      });
    });
    if(btnExportJson) btnExportJson.addEventListener('click',()=>{
      try{
        const payload = { exportedAt:new Date().toISOString(), appVersion:APP_VERSION, db };
        const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'flow_backup_'+new Date().toISOString().slice(0,10)+'.json';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        logActivity('backup_exported','Sauvegarde JSON exportée par '+me.username);
        toast('Sauvegarde exportée ✓','success');
      }catch(e){ toast('Erreur lors de l\'export.','error'); }
    });

    const importInput = document.getElementById('btn-import-json');
    if(importInput) importInput.addEventListener('change',()=>{
      const file = importInput.files[0];
      const msg = document.getElementById('import-msg');
      if(!file || !msg) return;
      if(!file.name.endsWith('.json')){ showMsg(msg,'Seuls les fichiers .json sont acceptés.','error'); return; }
      const reader = new FileReader();
      reader.onload = e=>{
        let parsed;
        try{ parsed = JSON.parse(e.target.result); }
        catch(_){ showMsg(msg,'Fichier JSON invalide.','error'); return; }
        const candidate = parsed && parsed.db ? parsed.db : parsed;
        if(!candidate || !Array.isArray(candidate.users) || !Array.isArray(candidate.projects)){
          showMsg(msg,'Structure de fichier non reconnue — restauration annulée.','error'); return;
        }
        confirmAction('Remplacer toutes les données actuelles par celles de ce fichier ? Cette action est irréversible.', ()=>{
          db = candidate;
          normalizeDB();
          logActivity('backup_imported','Sauvegarde JSON importée par '+me.username);
          saveDB();
          toast('Sauvegarde restaurée ✓','success');
          document.getElementById('app').innerHTML=renderAdminShell(); wireAdmin();
        }, {label:'Restaurer', danger:true});
      };
      reader.onerror = ()=>showMsg(msg,'Erreur de lecture du fichier.','error');
      reader.readAsText(file,'UTF-8');
      importInput.value='';
    });
  }

  function renderProjectCard(p){

      const fmt=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
      dueLine=`<div style="font-size:.8rem;color:var(--ink-3);margin-top:6px;">📅 Livraison prévue : ${fmt}</div>`;
    }
    const statusColor = p.status==='done'?'#4cbe7c':p.status==='in_progress'?'var(--coral)':'rgba(var(--ink-rgb),.3)';
    const statusLabel = {'done':'Terminé','in_progress':'En cours','pending':'En attente'}[p.status]||p.status;
    return `
      <div class="glass-card" style="padding:24px;margin-bottom:20px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">

              <span style="font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:999px;
                background:${p.status==='done'?'rgba(76,190,124,.15)':p.status==='in_progress'?'rgba(217,119,87,.15)':'rgba(var(--fg-rgb),.06)'};
                border:1px solid ${p.status==='done'?'rgba(76,190,124,.35)':p.status==='in_progress'?'rgba(217,119,87,.35)':'rgba(var(--fg-rgb),.12)'};
                color:${statusColor};letter-spacing:.04em;">${statusLabel}</span>
            </div>
            ${p.description?`<div style="font-size:.8rem;color:var(--ink-3);margin-top:2px;line-height:1.45;">${esc(p.description)}</div>`:''}
          </div>
          ${p.websiteUrl&&safeUrl(p.websiteUrl)?`<a href="${esc(safeUrl(p.websiteUrl))}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm" style="flex-shrink:0;">🔗 Voir le site</a>`:''}
        </div>
        <!-- Progress bar -->
        <div style="margin-bottom:${p.dueDate?'10':'24'}px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:.72rem;color:var(--ink-4);font-weight:500;letter-spacing:.04em;text-transform:uppercase;">Avancement</span>
            <span style="font-size:.82rem;font-weight:700;color:${pct===100?'#4cbe7c':'var(--ink-2)'};">${pct}%</span>
          </div>
          <div style="height:7px;background:rgba(var(--fg-rgb),.07);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.25);">
            <div style="height:100%;width:${pct}%;border-radius:99px;transition:width .6s ease;
              background:${pct===100
                ? 'linear-gradient(90deg,#4cbe7c,#7ec89a)'
                : 'linear-gradient(90deg,#d97757,#f0a988)'};
              box-shadow:0 1px 6px rgba(217,119,87,.35);"></div>

        ${dueLine}
        ${dueLine?'<div style="margin-bottom:18px;"></div>':''}
        ${p.deliverable?`
        <div style="background:rgba(147,181,148,.10);border:1px solid rgba(147,181,148,.28);border-radius:14px;padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <span style="font-size:1.6rem;">📦</span>
          <div style="flex:1;min-width:0;">

  const _tlCheckSvg = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="3,8 7,12 13,4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const _tlPlaySvg  = `<svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M1 1.5L11 7L1 12.5V1.5Z"/></svg>`;

  function renderFullTimeline(tl, projectId){
    if(!tl || tl.length === 0) return `<div style="text-align:center;padding:24px 0;color:var(--ink-4);font-size:.85rem;">Aucune étape définie.</div>`;
    return `<div style="padding:4px 0;">
      ${tl.map((s,i)=>{
        const isDone    = s.status==='done';
        const isCurrent = s.status==='current';
        const isPending = !isDone && !isCurrent;
        const labelColor = isDone ? 'rgba(var(--ink-rgb),.92)' : isCurrent ? 'var(--coral-soft)' : 'rgba(var(--ink-rgb),.28)';
        const numLabel   = isPending ? `<span style="font-size:.72rem;font-weight:700;font-family:'Geist',sans-serif;">${i+1}</span>` : '';
        const commentCount = (s.comments||[]).length;
        return `
        <div class="tl-step ${s.status}">
          <div class="tl-line-wrap">
            <div class="tl-dot">
              ${isDone ? _tlCheckSvg : isCurrent ? _tlPlaySvg : numLabel}
            </div>
            ${i < tl.length-1 ? `<div class="tl-connector"></div>` : ''}
          </div>
          <div style="padding-top:10px;flex:1;min-width:0;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
              <div style="font-size:.92rem;font-weight:${isPending?'400':'600'};color:${labelColor};line-height:1.3;">
                ${esc(s.label)}
              </div>
              ${s.dueDate ? `<div style="font-size:.7rem;color:rgba(var(--ink-rgb),.32);white-space:nowrap;padding-top:2px;">${esc(new Date(s.dueDate).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}))}</div>` : ''}
            </div>
            ${isCurrent ? `<div style="margin-top:5px;font-size:.72rem;font-weight:600;color:rgba(217,119,87,.75);letter-spacing:.04em;text-transform:uppercase;">En cours</div>` : ''}
            ${s.note ? `<div style="font-size:.76rem;color:var(--ink-4);font-style:italic;margin-top:4px;line-height:1.45;">${esc(s.note)}</div>` : ''}
            ${projectId?`<button class="btn btn-ghost btn-sm btn-step-comments" data-pid="${projectId}" data-sid="${s.id}" style="margin-top:6px;font-size:.72rem;padding:3px 9px;">💬 ${commentCount>0?commentCount+' commentaire'+(commentCount>1?'s':''):'Commenter'}</button>`:''}
          </div>
        </div>`}).join('')}
    </div>`;
  }

  function wireClientHome(){
    // Aperçu « À faire » : cocher une tâche directement depuis l'accueil
    const homeProject = getUserProjects(me.id).find(p=>p.id===window._clientActiveProjectId)||getUserProject(me.id);
    document.querySelectorAll('.ctk-check').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const t = homeProject && homeProject.clientTasks && homeProject.clientTasks[Number(cb.dataset.i)];
        if(!t) return;
        t.done = cb.checked;
        saveDB(); refreshClientTab(true);
      });
    });
    document.querySelectorAll('.btn-download-delivery').forEach(btn=>{
      btn.addEventListener('click',()=>downloadDelivery(btn.dataset.pid));
    });
    document.querySelectorAll('.btn-sign-quote').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const inv = (db.invoices||[]).find(i=>i.id===btn.dataset.id);
        if(!inv) return;
        confirmAction('Confirmer votre accord pour ce devis ? Cette action vaut acceptation et sera horodatée.', ()=>{
          inv.signedAt = new Date().toISOString();
          inv.signedBy = me.username;
          saveDB();
          toast('Devis accepté ✓','success');
          pushNotification('admins', '✅ Devis accepté', '@'+me.username+' a accepté le devis "'+inv.title+'" (N° '+inv.num+').', 'success');
          refreshClientTab(true);
        }, {label:'J\'accepte', danger:false});
      });
    });
    document.querySelectorAll('.btn-step-comments').forEach(btn=>{
      btn.addEventListener('click',()=>openStepCommentsModal(btn.dataset.pid, btn.dataset.sid));
    });
    // Multi-projets : changer de projet actif
    document.querySelectorAll('.btn-switch-project').forEach(btn=>{
      btn.addEventListener('click',()=>{
        window._clientActiveProjectId = btn.dataset.pid;
        refreshClientTab(true);
      });
    });
    // Export PDF résumé client
    const pdfBtn = document.getElementById('btn-client-pdf');
    if(pdfBtn) pdfBtn.addEventListener('click', exportClientProjectPDF);
    // Centre de notifications
    const notifBtn = document.getElementById('btn-client-notifs');
    if(notifBtn) notifBtn.addEventListener('click', openClientNotificationsModal);
    // Avis / satisfaction
    const starEls = document.querySelectorAll('.review-star');
    if(starEls.length){
      const ratingInput = document.getElementById('review-rating');
      function paintStars(n){
        starEls.forEach(s=>{ s.style.opacity = parseInt(s.dataset.star)<=n ? '1' : '.35'; });
      }
      starEls.forEach(s=>{
        s.addEventListener('mouseenter',()=>paintStars(parseInt(s.dataset.star)));
        s.addEventListener('mouseleave',()=>paintStars(parseInt(ratingInput.value||'0')));
        s.addEventListener('click',()=>{ ratingInput.value=s.dataset.star; paintStars(parseInt(s.dataset.star)); });
      });
      const submitBtn = document.getElementById('btn-submit-review');
      if(submitBtn) submitBtn.addEventListener('click',()=>{
        const rating = parseInt(ratingInput.value||'0');
        if(rating<1){ toast('Sélectionnez une note de 1 à 5 étoiles.','error'); return; }
        const comment = (document.getElementById('review-comment').value||'').trim().slice(0,1000);
        const project = getUserProjects(me.id).find(p=>p.id===window._clientActiveProjectId)||getUserProject(me.id);
        if(!project) return;
        if(!db.reviews) db.reviews=[];
        db.reviews.push({
          id:uid(), projectId:project.id, clientId:me.id, clientUsername:me.username,
          rating, comment, createdAt:new Date().toISOString()
        });
        pushNotification('admins', '⭐ Nouvel avis client', '@'+me.username+' a laissé '+rating+'/5 pour "'+project.name+'"'+(comment?' : "'+comment.slice(0,150)+'"':''), 'success');
        sendDiscordNotif('⭐ Nouvel avis client', '@'+me.username+' — '+rating+'/5 sur "'+project.name+'"'+(comment?'\n"'+comment+'"':''), 0xf0c080);
        logActivity('review_submitted', '@'+me.username+' a laissé un avis ('+rating+'/5) sur "'+project.name+'"');
        saveDB(); toast('Merci pour votre avis !','success'); refreshClientTab(true);
      });
    }
  }

  function exportClientProjectPDF(){
    const project = getUserProjects(me.id).find(p=>p.id===window._clientActiveProjectId)||getUserProject(me.id);
    if(!project){ toast('Aucun projet à exporter.','error'); return; }
    if(!window.jspdf){ toast('Chargement du PDF en cours…','info'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ format:'a4', unit:'mm' });
    const W=210, pad=18;
    let y=pad;
    // En-tête
    doc.setFillColor(217,119,87); doc.rect(0,0,W,14,`F`);
    doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text('Flow — Rapport de projet', pad, 9.5);
    doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}), W-pad, 9.5, {align:'right'});
    y=22;
    // Titre projet
    doc.setTextColor(30,20,10); doc.setFontSize(16); doc.setFont('helvetica','bold');
    doc.text(project.name, pad, y); y+=7;
    // Status
    const statusLabel={'pending':'En attente','in_progress':'En cours','done':'Terminé'}[project.status]||project.status;
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(100,80,60);
    doc.text(`Statut : ${statusLabel}${project.dueDate?' · Livraison : '+new Date(project.dueDate).toLocaleDateString('fr-FR'):''}`, pad, y); y+=5;
    if(project.description){ doc.setTextColor(80,60,40); doc.text(doc.splitTextToSize(project.description,W-2*pad), pad, y); y+=doc.splitTextToSize(project.description,W-2*pad).length*4+3; }
    // Bandeau "certificat de fin de projet" — uniquement pour les projets terminés
    if(project.status==='done'){
      y+=2;
      doc.setFillColor(238,247,239); doc.setDrawColor(147,181,148);
      doc.roundedRect(pad, y, W-2*pad, 18, 2, 2, 'FD');
      doc.setTextColor(70,130,90); doc.setFontSize(10); doc.setFont('helvetica','bold');
      doc.text('✓ Projet livré et terminé', pad+6, y+7);
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(80,110,90);
      const createdLbl = project.createdAt ? new Date(project.createdAt).toLocaleDateString('fr-FR') : '—';
      doc.text(`Démarré le ${createdLbl} · Ce document atteste de l'achèvement du projet par l'équipe Flow.`, pad+6, y+13);
      const ownReview = (db.reviews||[]).find(r=>r.projectId===project.id && r.clientId===me.id);
      if(ownReview){ doc.setTextColor(217,160,80); doc.setFontSize(9); doc.text('★'.repeat(ownReview.rating)+'☆'.repeat(5-ownReview.rating), W-pad-6, y+9, {align:'right'}); }
      y+=24;
    }
    // Barre de progression
    const tl=project.timeline||[];
    const pct=tl.length>0?Math.round(tl.filter(s=>s.status==='done').length/tl.length*100):0;
    y+=2;
    doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(30,20,10); doc.text(`Avancement : ${pct}%`, pad, y); y+=4;
    doc.setFillColor(230,220,210); doc.roundedRect(pad, y, W-2*pad, 4, 2, 2, 'F');
    if(pct>0){ doc.setFillColor(217,119,87); doc.roundedRect(pad, y, (W-2*pad)*pct/100, 4, 2, 2, 'F'); } y+=9;
    // Timeline
    if(tl.length>0){
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(30,20,10); doc.text('Étapes du projet', pad, y); y+=5;
      tl.forEach((s,i)=>{
        const statusIcon = s.status==='done'?'✓':s.status==='current'?'▶':'○';
        const clr = s.status==='done'?[76,190,124]:s.status==='current'?[217,119,87]:[160,140,120];
        doc.setTextColor(...clr); doc.setFontSize(8); doc.setFont('helvetica','bold');
        doc.text(statusIcon, pad, y);
        doc.setTextColor(30,20,10); doc.setFont('helvetica', s.status==='pending'?'normal':'bold');
        doc.text(s.label+(s.status==='current'?' (en cours)':''), pad+6, y);
        if(s.dueDate){ doc.setTextColor(130,110,90); doc.setFont('helvetica','normal'); doc.text(new Date(s.dueDate).toLocaleDateString('fr-FR'), W-pad, y, {align:'right'}); }
        y+=5;
        if(y>270){ doc.addPage(); y=20; }
      });
    }
    // Documents
    const docs=getProjectDocs(project.id);
    if(docs.length>0){
      y+=4;
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(30,20,10); doc.text('Documents', pad, y); y+=5;
      docs.forEach(d=>{
        const sl={'pending':'En attente','filled':'Rempli','reviewed':'Validé'}[d.status]||d.status;
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(60,50,40);
        doc.text(`• ${d.name} — ${sl}`, pad, y); y+=4;
      });
    }
    // Pied de page

  function wireClientFiles(){
    const project = getUserProject(me.id);
    if(!project) return;
    const MAX_SIZE = 6 * 1024 * 1024;
    const dropZone = document.getElementById('cf-drop');
    const input    = document.getElementById('cf-input');
    const msg      = document.getElementById('cf-msg');
    const progWrap = document.getElementById('cf-progress-wrap');
    const progBar  = document.getElementById('cf-progress-bar');
    const progTxt  = document.getElementById('cf-progress-txt');

    function handleFile(file){
      if(!file) return;
      if(file.size > MAX_SIZE){
        showMsg(msg, `Fichier trop volumineux (${(file.size/1024/1024).toFixed(1)} Mo). Limite : 6 Mo.`, 'error');
        return;
      }
      progWrap.style.display = 'block';
      const reader = new FileReader();
      reader.onprogress = e=>{ if(e.lengthComputable){ const pct=Math.round(e.loaded/e.total*100); progBar.style.width=pct+'%'; progTxt.textContent=pct+'% envoyé…'; } };
      reader.onload = e=>{
        if(!Array.isArray(project.clientFiles)) project.clientFiles=[];
        project.clientFiles.push({ id:uid(), name:file.name, size:file.size, type:file.type, data:e.target.result, uploadedAt:new Date().toISOString() });
        saveDB();
        progTxt.textContent='Envoyé ✓';
        toast('Fichier envoyé !','success');
        refreshClientTab(true);
      };
      reader.onerror = ()=>showMsg(msg,'Erreur de lecture du fichier.','error');
      reader.readAsDataURL(file);
    }

    if(dropZone) dropZone.addEventListener('click',()=>input.click());
    if(input) input.addEventListener('change',()=>handleFile(input.files[0]));
    if(dropZone){
      dropZone.addEventListener('dragover',e=>{ e.preventDefault(); dropZone.style.borderColor='var(--coral)'; });
      dropZone.addEventListener('dragleave',()=>{ dropZone.style.borderColor=''; });
      dropZone.addEventListener('drop',e=>{ e.preventDefault(); dropZone.style.borderColor=''; handleFile(e.dataTransfer.files[0]); });
    }
    document.querySelectorAll('.cf-delete').forEach(b=>{
      b.addEventListener('click',()=>{
        const i = Number(b.dataset.i);
        const files = [...(project.clientFiles||[])].sort((a,b)=>new Date(b.uploadedAt)-new Date(a.uploadedAt));
        const target = files[i];
        if(!target) return;
        project.clientFiles = project.clientFiles.filter(f=>f.id!==target.id);
        saveDB(); toast('Fichier supprimé.','info'); refreshClientTab(true);
      });
    });
  }

  function showModal(html, onWire){
    let ov = document.getElementById('modal-overlay');
    if(!ov){ ov=document.createElement('div'); ov.id='modal-overlay'; document.body.appendChild(ov); }
    ov.innerHTML=`<div class="modal-box fade-up" role="dialog" aria-modal="true">${html}</div>`;
    ov.style.display='flex';
    ov.setAttribute('role','presentation');
    ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
    if(onWire) onWire();
  }

  function closeModal(){
    const ov=document.getElementById('modal-overlay');
    if(ov){ ov.style.display='none'; ov.innerHTML=''; }
  }

      <div style="margin-bottom:20px;"><label class="label">Nouveau mot de passe (laisser vide)</label><input id="eu-pw" class="glass-input" spellcheck="false" type="password" /></div>

        <button id="eu-save" class="btn btn-primary" style="flex:1;justify-content:center;">Enregistrer</button>
      </div>`,
    ()=>{
      document.getElementById('eu-save').addEventListener('click',()=>{
        const fn=document.getElementById('eu-fn').value.trim();
        const ln=document.getElementById('eu-ln').value.trim();
        const un=document.getElementById('eu-un').value.trim();
        const em=document.getElementById('eu-em').value.trim();
        const phone=document.getElementById('eu-phone')?.value.trim()||'';
        const sector=document.getElementById('eu-sector')?.value.trim()||'';
        const pw=document.getElementById('eu-pw').value;
        const url=document.getElementById('eu-url').value.trim();
        const role=isAdmin?document.getElementById('eu-role').value:u.role;
        const projId=isAdmin?document.getElementById('eu-proj').value:'';
        const msg=document.getElementById('eu-msg');

        if(!un){ showMsg(msg,'Le pseudo est requis.','error'); return; }
        if(db.users.some(x=>x.username.toLowerCase()===un.toLowerCase()&&x.id!==u.id)){
          showMsg(msg,'Ce pseudo est déjà utilisé.','error'); return;
        }
        if(pw){ const pwErr = validatePasswordStrength(pw); if(pwErr){ showMsg(msg,pwErr,'error'); return; } }
        if(url && !safeUrl(url)){ showMsg(msg,'L\'URL du site doit commencer par http:// ou https://.','error'); return; }

        u.firstName=fn; u.lastName=ln; u.username=un; u.email=em; u.role=role; u.phone=phone; u.sector=sector;
        u.internalNotes = document.getElementById('eu-notes')?.value.trim()||'';
        u.aiInstructions = document.getElementById('eu-ai-instr')?.value.trim()||'';

        const applyEdit=()=>{
          if(isAdmin){
            db.projects.forEach(p=>{ if(p.clientId===u.id) p.clientId=null; });
            if(projId){
              const proj=db.projects.find(p=>p.id===projId);
              if(proj){ proj.clientId=u.id; if(url) proj.websiteUrl=url; }
            }
          }
          saveDB(); toast('Utilisateur mis à jour !','success'); closeModal(); refreshAdminTab();
        };
        if(pw){ hashPwdStrong(pw).then(h=>{ u.password=h; applyEdit(); }); } else { applyEdit(); }
      });
    });
  }

  function openDeliverFilesModal(projectId){
    const p = db.projects.find(x=>x.id===projectId);
    if(!p) return;
    const existing = p.deliverable;
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <h2 style="font-size:1.1rem;font-weight:700;">📦 Livrer les fichiers</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <p style="font-size:.85rem;color:var(--ink-3);margin-bottom:18px;">Projet : <strong>${esc(p.name)}</strong></p>
      ${existing?`<div style="background:rgba(147,181,148,.1);border:1px solid rgba(147,181,148,.25);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;">
        <span>📦</span>
        <div style="flex:1;font-size:.85rem;color:var(--sage);">${esc(existing.name)} <span style="color:var(--ink-4);font-size:.75rem;">(${(existing.size/1024/1024).toFixed(2)} Mo — livré le ${new Date(existing.deliveredAt).toLocaleDateString('fr-FR')})</span></div>
        <button id="btn-remove-delivery" class="btn btn-danger btn-sm">✕ Retirer</button>
      </div>`:''}
      <div style="border:2px dashed var(--glass-edge-hi);border-radius:14px;padding:28px;text-align:center;margin-bottom:16px;transition:border-color .2s;" id="drop-zone">
        <div style="font-size:2rem;margin-bottom:8px;">📂</div>
        <div style="font-size:.875rem;color:var(--ink-2);margin-bottom:10px;">Glisser un fichier ici ou</div>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">Parcourir<input type="file" id="deliver-file-input" style="display:none;" /></label>
        <div id="deliver-file-info" style="margin-top:12px;font-size:.82rem;color:var(--ink-3);"></div>
      </div>
      <div id="deliver-progress" style="display:none;margin-bottom:14px;">
        <div style="height:6px;background:rgba(var(--fg-rgb),.08);border-radius:4px;overflow:hidden;">
          <div id="deliver-progress-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--coral),var(--sage));border-radius:4px;transition:width .3s;"></div>
        </div>
        <div id="deliver-progress-txt" style="font-size:.75rem;color:var(--ink-4);margin-top:6px;text-align:center;">Lecture en cours…</div>
      </div>
      <div id="deliver-msg" style="display:none;margin-bottom:14px;padding:10px 14px;border-radius:8px;font-size:.85rem;"></div>
      <div style="display:flex;gap:10px;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
        <button id="deliver-save" class="btn btn-primary" style="flex:1;justify-content:center;" disabled>📤 Enregistrer la livraison</button>
      </div>`,
    ()=>{
      let fileData = null;
      const MAX_SIZE = 9 * 1024 * 1024; // 9MB base64 limit (~6.5MB file)
      const input = document.getElementById('deliver-file-input');
      const info  = document.getElementById('deliver-file-info');
      const saveBtn = document.getElementById('deliver-save');
      const msg   = document.getElementById('deliver-msg');

      function handleFile(file){
        if(!file) return;
        if(file.size > MAX_SIZE){
          showMsg(msg, `Fichier trop volumineux (${(file.size/1024/1024).toFixed(1)} Mo). Limite : 6,5 Mo.`, 'error');
          return;
        }
        info.innerHTML = `<span style="color:var(--sage);">✓</span> ${esc(file.name)} — ${(file.size/1024/1024).toFixed(2)} Mo`;
        document.getElementById('deliver-progress').style.display = 'block';
        const reader = new FileReader();
        reader.onprogress = e=>{ if(e.lengthComputable){ const pct=Math.round(e.loaded/e.total*100); document.getElementById('deliver-progress-bar').style.width=pct+'%'; document.getElementById('deliver-progress-txt').textContent=pct+'% lu…'; } };
        reader.onload = e=>{
          fileData = {name:file.name, size:file.size, type:file.type, data:e.target.result, deliveredAt:new Date().toISOString(), deliveredBy:me.username};
          document.getElementById('deliver-progress-bar').style.width='100%';
          document.getElementById('deliver-progress-txt').textContent='Prêt à enregistrer';
          saveBtn.disabled = false;
        };
        reader.onerror = ()=>showMsg(msg,'Erreur de lecture du fichier.','error');
        reader.readAsDataURL(file);
      }

      input.addEventListener('change',()=>handleFile(input.files[0]));

      const dropZone = document.getElementById('drop-zone');
      dropZone.addEventListener('dragover',e=>{ e.preventDefault(); dropZone.style.borderColor='var(--coral)'; });
      dropZone.addEventListener('dragleave',()=>{ dropZone.style.borderColor=''; });
      dropZone.addEventListener('drop',e=>{ e.preventDefault(); dropZone.style.borderColor=''; handleFile(e.dataTransfer.files[0]); });

      document.getElementById('btn-remove-delivery')?.addEventListener('click',()=>{
        confirmAction('Retirer la livraison existante ?', ()=>{
          p.deliverable = null;
          logActivity('delivery_removed','Livraison retirée : '+p.name);
          saveDB(); toast('Livraison retirée.','info'); closeModal(); refreshAdminTab();
        }, {label:'Retirer'});
      });

      saveBtn.addEventListener('click',()=>{
        if(!fileData){ showMsg(msg,'Sélectionnez un fichier.','error'); return; }
        saveBtn.disabled=true; saveBtn.textContent='Enregistrement…';
        p.deliverable = fileData;
        logActivity('delivery_uploaded','Fichiers livrés pour : '+p.name+' ('+fileData.name+')');
        saveDB();
        toast('Fichiers livrés à '+p.name+' !','success');
        closeModal(); refreshAdminTab();
      });
    });
  }

  function openLinkSiteModal(projectId){
    const p = db.projects.find(x=>x.id===projectId);
    if(!p) return;
    const client = p.clientId ? db.users.find(u=>u.id===p.clientId) : null;
    showModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <h2 style="font-size:1.1rem;font-weight:700;">🌐 Lier le fichier site</h2>
        <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <p style="font-size:.85rem;color:var(--ink-3);margin-bottom:6px;">Projet : <strong>${esc(p.name)}</strong>${client?` · Client : <strong>${esc(client.username)}</strong>`:''}</p>
      <p style="font-size:.78rem;color:var(--ink-4);margin-bottom:18px;">Une fois le fichier lié, l'onglet Discussion s'activera automatiquement pour le client. Il pourra poser des questions à Gemini sur ce site.</p>
      ${p.siteHtml?`<div style="background:rgba(147,181,148,.1);border:1px solid rgba(147,181,148,.25);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
        <span>✅</span>
        <span style="font-size:.82rem;color:var(--sage);flex:1;">Fichier site déjà lié (${(p.siteHtml.length/1024).toFixed(0)} Ko)</span>
        <button id="btn-unlink-site" class="btn btn-danger btn-sm" style="flex-shrink:0;">✕ Délier</button>
      </div>`:''}
      <div style="border:2px dashed var(--glass-edge-hi);border-radius:14px;padding:24px;text-align:center;margin-bottom:16px;" id="site-drop-zone">
        <div style="font-size:1.8rem;margin-bottom:8px;">🗂</div>
        <div style="font-size:.875rem;color:var(--ink-2);margin-bottom:10px;">Glissez votre fichier <code style="background:rgba(var(--fg-rgb),.07);padding:2px 6px;border-radius:4px;">.html</code> ici ou</div>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">Choisir un fichier<input type="file" id="site-file-input" accept=".html,text/html" style="display:none;" /></label>
        <div id="site-file-info" style="margin-top:12px;font-size:.82rem;color:var(--ink-3);"></div>
      </div>
      <div id="site-link-msg" style="display:none;margin-bottom:14px;padding:10px 14px;border-radius:8px;font-size:.85rem;"></div>
      <div style="display:flex;gap:10px;">
        <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;justify-content:center;">Annuler</button>
        <button id="site-link-save" class="btn btn-primary" style="flex:1;justify-content:center;" disabled>🔗 Lier ce fichier</button>
      </div>`,
    ()=>{
      let htmlContent = null;
      const input = document.getElementById('site-file-input');
      const info  = document.getElementById('site-file-info');
      const saveBtn = document.getElementById('site-link-save');
      const msg   = document.getElementById('site-link-msg');
      const MAX_HTML = 2 * 1024 * 1024; // 2MB HTML max

      function showMsg(el,txt,type){
        el.style.display='block';
        el.style.background=type==='error'?'rgba(240,138,138,.12)':'rgba(147,181,148,.12)';
        el.style.border='1px solid '+(type==='error'?'rgba(240,138,138,.3)':'rgba(147,181,148,.3)');
        el.style.color=type==='error'?'#f08a8a':'#b6d1b7';
        el.textContent=txt;
      }

      function handleFile(file){
        if(!file) return;
        if(file.size > MAX_HTML){ showMsg(msg,'Fichier trop volumineux (max 2 Mo).','error'); return; }
        if(!file.name.endsWith('.html') && file.type!=='text/html'){ showMsg(msg,'Seuls les fichiers .html sont acceptés.','error'); return; }
        info.innerHTML = `<span style="color:var(--sage);">✓</span> ${esc(file.name)} — ${(file.size/1024).toFixed(0)} Ko`;
        const reader = new FileReader();
        reader.onload = e=>{ htmlContent = e.target.result; saveBtn.disabled=false; showMsg(msg,'Fichier prêt à être lié.','success'); };
        reader.onerror = ()=>showMsg(msg,'Erreur de lecture.','error');
        reader.readAsText(file,'UTF-8');
      }

      input.addEventListener('change',()=>handleFile(input.files[0]));
      const dropZone = document.getElementById('site-drop-zone');
      dropZone.addEventListener('dragover',e=>{ e.preventDefault(); dropZone.style.borderColor='var(--coral)'; });
      dropZone.addEventListener('dragleave',()=>{ dropZone.style.borderColor=''; });
      dropZone.addEventListener('drop',e=>{ e.preventDefault(); dropZone.style.borderColor=''; handleFile(e.dataTransfer.files[0]); });

      document.getElementById('btn-unlink-site')?.addEventListener('click',()=>{
        confirmAction('Délier le fichier site ? Le client n\'aura plus accès à l\'onglet Discussion.', ()=>{
          p.siteHtml = null; p.siteLinkedAt = null;
          saveDB(); toast('Fichier site délié.','info'); closeModal(); refreshAdminTab();
        }, {label:'Délier', danger:true}); return;
      });

      saveBtn.addEventListener('click',()=>{
        if(!htmlContent){ showMsg(msg,'Aucun fichier sélectionné.','error'); return; }
        saveBtn.disabled=true; saveBtn.textContent='Enregistrement…';
        // Historique de versions — on garde un résumé léger (pas le HTML complet)
        // de la version précédente, pour montrer au client ce qui a changé.
        if(!Array.isArray(p.siteHistory)) p.siteHistory=[];
        const isUpdate = !!p.siteHtml;
        if(isUpdate){
          const prevText = p.siteHtml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          p.siteHistory.push({
            replacedAt: new Date().toISOString(),
            replacedBy: me.username,
            sizeBefore: p.siteHtml.length,
            excerptBefore: prevText.substring(0,200)
          });
          if(p.siteHistory.length>20) p.siteHistory = p.siteHistory.slice(-20);
        }
        p.siteHtml = htmlContent;
        p.siteLinkedAt = new Date().toISOString();
        p.siteLinkedBy = me.username;
        if(p.clientId){
          pushNotification(p.clientId,
            isUpdate ? '🌐 Le site de votre projet a été mis à jour' : '🌐 Votre site est maintenant lié',
            isUpdate ? 'Une nouvelle version de "'+p.name+'" est disponible. Consultez l\'onglet Discussion pour voir ce qui a changé.' : 'L\'assistant Discussion est désormais actif pour "'+p.name+'".',
            'info');
        }
        saveDB();
        toast(isUpdate?'Site mis à jour ! Le client a été notifié.':'Fichier site lié ! L\'onglet Discussion est maintenant actif pour le client.','success');
        closeModal(); refreshAdminTab();
      });
    });
  }

      </div>

        <label class="label">Couleur du projet</label>
        <div id="tl-colors" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
          ${['#d97757','#93b594','#9bb8d8','#c4a3d4','#f0c080','#e07080','#70b8b8','#b0b0b0'].map(c=>`

          <option value="normal"  ${(p.priority||'normal')==='normal'?'selected':''}>🔵 Normal</option>
          <option value="low"     ${p.priority==='low'?'selected':''}>⚪ Basse priorité</option>
